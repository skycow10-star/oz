  paras: [
[`h`, `원작 1장 「회오리바람」`],
[`1-1`, `도로시는 캔자스의 드넓은 대초원 한가운데에서 농부인 헨리 아저씨, 그리고 농부의 아내인 엠 아주머니와 함께 살았다. 집은 작았다. 집 지을 목재를 마차에 싣고 몇 마일이나 날라 와야 했기 때문이다. 벽 네 개와 바닥, 지붕으로 이루어진 방 하나가 집의 전부였다. 그 방 안에는 녹슨 듯한 요리용 화덕과 그릇 찬장, 식탁 하나, 의자 서너 개, 그리고 침대들이 있었다. 헨리 아저씨와 엠 아주머니의 큰 침대는 한쪽 구석에, 도로시의 작은 침대는 다른 쪽 구석에 놓여 있었다. 다락방은 아예 없었고 지하실도 없었다. 다만 땅을 파서 만든 작은 구덩이가 하나 있었는데, 이것을 회오리바람 대피 굴이라고 불렀다. 길을 가로막는 건물이라면 무엇이든 박살 낼 만큼 거센 회오리바람이 불어오면 가족이 몸을 피하는 곳이었다. 방바닥 한가운데에 있는 들창문을 열면 사다리가 그 작고 컴컴한 구덩이 속으로 이어져 있었다.`],
[`1-2`, `도로시가 문간에 서서 둘러보면 사방에 보이는 것이라고는 드넓은 잿빛 대초원뿐이었다. 하늘 끝까지 모든 방향으로 펼쳐진 평평한 땅에는 나무 한 그루, 집 한 채 솟아 있지 않았다. 해가 갈아엎은 밭을 구워 잿빛 덩어리로 만들어 놓았고, 그 위로 자잘한 금이 가 있었다. 풀조차 초록빛이 아니었다. 해가 기다란 풀잎 끝을 태워 버려서 풀도 어디서나 보이는 똑같은 잿빛이 되어 있었다. 집도 한때는 페인트칠이 되어 있었지만, 햇볕에 페인트가 부풀어 일어나고 빗물에 씻겨 나가, 이제는 다른 모든 것처럼 칙칙한 잿빛이었다.`],
[`1-3`, `엠 아주머니가 처음 이곳에 와서 살게 되었을 때, 아주머니는 젊고 예쁜 새댁이었다. 그런 아주머니도 해와 바람에 변해 버렸다. 해와 바람은 아주머니의 눈에서 반짝임을 앗아 가 수수한 잿빛만 남겨 놓았고, 뺨과 입술에서 붉은빛을 앗아 가 그것마저 잿빛으로 만들었다. 아주머니는 마르고 수척했으며, 이제는 웃는 일이 없었다. 고아인 도로시가 처음 아주머니에게 왔을 때, 아주머니는 아이의 웃음소리에 어찌나 깜짝 놀랐던지, 도로시의 명랑한 목소리가 들려올 때마다 비명을 지르며 손으로 가슴을 누르곤 했다. 그리고 지금도 아주머니는 이 어린 소녀가 웃을 거리를 찾아낸다는 것이 신기하다는 듯 도로시를 바라보았다.`],
[`1-4`, `헨리 아저씨는 결코 웃지 않았다. 아저씨는 아침부터 밤까지 고되게 일했고, 기쁨이 무엇인지 알지 못했다. 아저씨 역시 기다란 턱수염부터 투박한 장화까지 온통 잿빛이었고, 엄하고 근엄해 보였으며, 말이 거의 없었다.`],
[`1-5`, `도로시를 웃게 하고, 주위의 다른 모든 것처럼 잿빛이 되지 않도록 도로시를 지켜 준 것은 바로 토토였다. 토토는 잿빛이 아니었다. 토토는 작고 까만 개였는데, 털은 길고 비단처럼 부드러웠고, 우스꽝스럽고 조그만 코 양옆에서 작고 까만 눈이 즐겁게 반짝였다. 토토는 온종일 뛰어놀았고, 도로시는 토토와 함께 놀며 토토를 무척 사랑했다.`],
[`1-6`, `그런데 오늘은 둘이 놀고 있지 않았다. 헨리 아저씨는 문간 계단에 앉아 여느 때보다 더 잿빛인 하늘을 걱정스럽게 올려다보고 있었다. 도로시도 토토를 품에 안고 문간에 서서 하늘을 올려다보았다. 엠 아주머니는 설거지를 하고 있었다.`],
[`1-7`, `저 멀리 북쪽에서 낮게 우는 바람 소리가 들려왔다. 헨리 아저씨와 도로시의 눈에, 다가오는 폭풍 앞에서 기다란 풀들이 물결치며 고개 숙이는 모습이 보였다. 이번에는 남쪽에서 날카롭게 휘파람 부는 소리가 공기를 가르며 들려왔다. 둘이 그쪽으로 눈을 돌리자, 그 방향에서도 풀이 잔물결처럼 일렁이며 다가오고 있었다.`],
[`1-8`, `갑자기 헨리 아저씨가 벌떡 일어섰다.`],
[`1-9`, `“회오리바람이 오고 있어, 엠.” 아저씨가 아내에게 소리쳤다. “나는 가축들을 살피러 가겠소.” 그러고는 소와 말을 두는 헛간 쪽으로 달려갔다.`],
[`1-10`, `엠 아주머니는 하던 일을 내려놓고 문간으로 왔다. 한 번 흘끗 보는 것만으로도 위험이 코앞에 닥쳤다는 것을 알 수 있었다.`],
[`1-11`, `“서둘러, 도로시!” 아주머니가 비명을 질렀다. “어서 대피 굴로 뛰어가!”`],
[`1-12`, `토토가 도로시의 품에서 뛰어내려 침대 밑으로 숨어 버렸다. 도로시는 토토를 붙잡으러 갔다. 잔뜩 겁에 질린 엠 아주머니는 바닥의 들창문을 홱 열어젖히고 사다리를 타고 작고 컴컴한 구덩이 속으로 내려갔다. 도로시는 마침내 토토를 붙잡아 아주머니를 따라가려 했다. 그런데 도로시가 방을 반쯤 가로질렀을 때, 바람이 무시무시한 비명을 질렀다. 그러자 집이 어찌나 세게 흔들렸던지 도로시는 발을 헛디뎌 그만 바닥에 털썩 주저앉고 말았다.`],
[`1-13`, `그때 이상한 일이 일어났다.`],
[`1-14`, `집이 두세 바퀴 빙글빙글 돌더니 천천히 공중으로 떠올랐다. 도로시는 마치 열기구를 타고 올라가는 것 같은 기분이 들었다.`],
[`1-15`, `북풍과 남풍이 집이 서 있던 바로 그 자리에서 맞부딪쳐, 집을 회오리바람의 한가운데로 만들어 버린 것이다. 회오리바람의 한가운데는 보통 공기가 잔잔하다. 하지만 집을 사방에서 짓누르는 거센 바람의 힘이 집을 점점 더 높이 들어 올려, 마침내 회오리바람의 맨 꼭대기까지 올라가게 했다. 그리고 집은 그곳에 머문 채, 여러분이 깃털 하나를 나르듯 가볍게 몇 마일이고 몇 마일이고 실려 갔다.`],
[`1-16`, `사방은 몹시 어두웠고 바람이 도로시 주위에서 무시무시하게 울부짖었다. 그런데 도로시는 자기가 꽤 편안하게 떠가고 있다는 것을 알게 되었다. 처음 몇 번 빙글빙글 돌았을 때와 한 번 집이 심하게 기울어졌을 때를 빼고는, 마치 요람 속 아기처럼 살살 흔들리는 기분이었다.`],
[`1-17`, `토토는 이것이 마음에 들지 않았다. 토토는 큰 소리로 짖으며 방 안을 이리저리 뛰어다녔다. 하지만 도로시는 바닥에 가만히 앉아 무슨 일이 일어날지 기다렸다.`],
[`1-18`, `한 번은 토토가 열려 있는 들창문에 너무 가까이 다가갔다가 그 속으로 빠지고 말았다. 처음에 소녀는 토토를 잃어버린 줄 알았다. 그런데 곧 구멍 위로 토토의 한쪽 귀가 삐죽 솟아 있는 것이 보였다. 거센 공기의 힘이 토토를 받쳐 주어 아래로 떨어지지 않았던 것이다. 도로시는 구멍으로 기어가서 토토의 귀를 붙잡아 다시 방 안으로 끌어 올렸다. 그러고는 더는 사고가 나지 않도록 들창문을 닫았다.`],
[`1-19`, `한 시간, 또 한 시간이 흘렀고, 도로시는 차츰 두려움을 이겨 냈다. 하지만 무척 외로웠다. 게다가 바람이 사방에서 어찌나 크게 비명을 질러 대는지 귀가 먹을 것만 같았다. 처음에는 집이 다시 떨어질 때 산산조각이 나지 않을까 걱정했다. 그러나 몇 시간이 지나도록 끔찍한 일이 일어나지 않자 걱정을 멈추고, 앞으로 무슨 일이 일어날지 차분하게 기다려 보기로 마음먹었다. 마침내 도로시는 흔들리는 바닥을 기어 침대로 가서 누웠다. 토토도 따라와 도로시 곁에 누웠다.`],
[`1-20`, `집이 흔들리고 바람이 울부짖는데도, 도로시는 곧 눈을 감고 깊은 잠에 빠져들었다.`],
[`h`, `원작 2장 「먼치킨들과의 회의」`],
[`2-1`, `도로시는 갑작스럽고 거센 충격에 잠에서 깼다. 푹신한 침대에 누워 있지 않았더라면 다쳤을지도 모를 만큼 큰 충격이었다. 쿵 하는 바람에 도로시는 숨을 헉 들이켜며 무슨 일이 일어났는지 어리둥절했다. 토토는 차갑고 작은 코를 도로시의 얼굴에 들이밀며 서글프게 낑낑거렸다. 도로시는 일어나 앉았다. 집은 움직이지 않았고 어둡지도 않았다. 밝은 햇살이 창문으로 들어와 작은 방을 가득 채우고 있었다. 도로시는 침대에서 뛰어내려 토토를 뒤에 달고 달려가 문을 열었다.`],
[`2-2`, `어린 소녀는 놀라서 탄성을 지르며 주위를 둘러보았다. 눈앞에 펼쳐진 놀라운 광경에 도로시의 눈은 점점 더 휘둥그레졌다.`],
[`2-3`, `회오리바람은 집을 아주 살며시, 회오리바람치고는 정말 살며시, 경이로울 만큼 아름다운 나라 한가운데에 내려놓았다. 주위에는 사랑스러운 초록 풀밭이 군데군데 펼쳐져 있었고, 늠름한 나무들에는 탐스럽고 달콤한 열매가 주렁주렁 열려 있었다. 사방에 화려한 꽃들이 둑을 이루며 피어 있었고, 진귀하고 눈부신 깃털을 지닌 새들이 나무와 덤불 사이에서 노래하며 날아다녔다. 조금 떨어진 곳에는 작은 시냇물이 초록 둑 사이로 반짝이며 흘러가고 있었다. 메마른 잿빛 대초원에서 그토록 오래 살아온 어린 소녀에게, 시냇물이 졸졸거리는 소리는 무척 고맙게 들렸다.`],
[`2-4`, `낯설고 아름다운 광경을 넋을 놓고 바라보던 도로시는, 지금껏 본 사람들 가운데 가장 별난 사람들이 무리 지어 자기 쪽으로 다가오는 것을 보았다. 그들은 도로시가 늘 보아 온 어른들만큼 크지는 않았지만, 아주 작지도 않았다. 사실 그들은 나이에 비해 키가 큰 편인 도로시와 키가 비슷해 보였다. 하지만 생김새로 보아서는 도로시보다 나이가 훨씬 많았다.`],
[`2-5`, `세 사람은 남자였고 한 사람은 여자였는데, 모두 별난 옷차림을 하고 있었다. 그들은 머리 위로 한 자쯤 솟아올라 끝이 뾰족해지는 둥근 모자를 쓰고 있었고, 모자 챙에 달린 작은 방울들이 움직일 때마다 듣기 좋게 딸랑거렸다. 남자들의 모자는 파란색이었다. 작은 여자의 모자는 흰색이었고, 여자는 어깨에서부터 주름이 져 내려오는 하얀 드레스를 입고 있었다. 드레스 위에는 햇빛을 받아 다이아몬드처럼 반짝이는 작은 별들이 흩뿌려져 있었다. 남자들은 모자와 똑같은 빛깔의 파란 옷을 입고, 윗부분이 파랗게 두툼히 접혀 있는 반질반질한 장화를 신고 있었다. 도로시는 남자들이 헨리 아저씨쯤 나이가 되었으리라고 생각했다. 그중 두 사람은 턱수염이 나 있었기 때문이다. 하지만 작은 여자는 틀림없이 훨씬 더 늙었을 것이다. 얼굴은 주름투성이였고, 머리는 거의 하얗게 세었으며, 걸음걸이도 꽤 뻣뻣했다.`],
[`2-6`, `이 사람들은 도로시가 문간에 서 있는 집 가까이 오더니, 더 다가가기가 두렵다는 듯 걸음을 멈추고 저희끼리 소곤거렸다. 하지만 작은 할머니는 도로시에게 걸어와 허리를 깊이 숙여 인사하고는 다정한 목소리로 말했다.`],
[`2-7`, `“가장 고귀하신 마법사님, 먼치킨 나라에 오신 것을 환영합니다. 동쪽의 나쁜 마녀를 없애 주시고, 우리 백성을 노예 신세에서 풀어 주셔서 정말 고맙습니다.”`],
[`2-8`, `도로시는 이 말을 듣고 어리둥절했다. 이 작은 여자는 도대체 무슨 뜻으로 자기를 마법사라고 부르고, 자기가 동쪽의 나쁜 마녀를 없앴다고 하는 걸까? 도로시는 회오리바람에 실려 집에서 몇 마일이나 떨어진 곳까지 날아온, 순진하고 해코지할 줄 모르는 어린 소녀일 뿐이었다. 태어나서 지금까지 무엇 하나 죽여 본 적이 없었다.`],
[`2-9`, `하지만 작은 여자는 분명히 도로시의 대답을 기다리고 있었다. 그래서 도로시는 머뭇거리며 말했다. “정말 친절하시네요. 하지만 무언가 잘못 아신 것 같아요. 저는 아무것도 죽이지 않았어요.”`],
[`2-10`, `“어쨌든 아가씨의 집이 그랬지요.” 작은 할머니가 웃으며 대답했다. “그게 그거랍니다. 보세요!” 할머니는 집 모퉁이를 가리키며 말을 이었다. “저기 마녀의 두 발이 아직도 나무토막 밑으로 삐죽 나와 있잖아요.”`],
[`2-11`, `그쪽을 본 도로시는 겁에 질려 작게 비명을 질렀다. 정말로 집을 떠받치고 있는 커다란 들보의 모퉁이 바로 밑으로, 앞코가 뾰족한 은 구두를 신은 두 발이 삐죽 나와 있었다.`],
[`2-12`, `“어머나, 어쩜 좋아! 어쩜 좋아!” 도로시는 당황해서 두 손을 꼭 맞잡으며 소리쳤다. “집이 저 사람 위로 떨어졌나 봐요. 이제 어떡하죠?”`],
[`2-13`, `“어떻게 할 일은 없답니다.” 작은 여자가 차분하게 말했다.`],
[`2-14`, `“그런데 저 사람은 누구였어요?” 도로시가 물었다.`],
[`2-15`, `“아까 말한 대로 동쪽의 나쁜 마녀였지요.” 작은 여자가 대답했다. “마녀는 오랫동안 먼치킨들을 모두 노예로 부리면서 밤낮으로 자기를 위해 일하게 했어요. 이제 먼치킨들은 모두 자유가 되었고, 아가씨가 베풀어 준 은혜에 고마워하고 있답니다.”`],
[`2-16`, `“먼치킨이 누구예요?” 도로시가 물었다.`],
[`2-17`, `“나쁜 마녀가 다스리던 이 동쪽 나라에 사는 사람들이에요.”`],
[`2-18`, `“할머니도 먼치킨이세요?” 도로시가 물었다.`],
[`2-19`, `“아니요. 나는 북쪽 나라에 살지만 먼치킨들의 친구랍니다. 동쪽 마녀가 죽은 것을 보고 먼치킨들이 날랜 심부름꾼을 내게 보냈고, 나는 곧바로 이리로 왔지요. 나는 북쪽 마녀예요.”`],
[`2-20`, `“세상에!” 도로시가 소리쳤다. “진짜 마녀세요?”`],
[`2-21`, `“그럼요.” 작은 여자가 대답했다. “하지만 나는 착한 마녀라서 사람들이 나를 좋아한답니다. 다만 이곳을 다스리던 나쁜 마녀만큼 힘이 세지는 않아요. 그랬다면 내가 직접 사람들을 풀어 주었을 거예요.”`],
[`2-22`, `“하지만 저는 마녀는 다 나쁜 줄 알았어요.” 진짜 마녀와 마주하고 있어서 반쯤 겁이 난 소녀가 말했다.`],
[`2-23`, `“어머, 아니에요. 그건 큰 오해랍니다. 오즈 나라 전체에 마녀는 넷뿐이었는데, 그중 북쪽과 남쪽에 사는 둘은 착한 마녀예요. 내가 바로 그중 하나니까 틀릴 리가 없지요. 동쪽과 서쪽에 살던 마녀는 정말로 나쁜 마녀였어요. 그런데 아가씨가 그중 하나를 없앴으니, 이제 오즈 나라 전체에 나쁜 마녀는 서쪽에 사는 마녀 하나뿐이랍니다.”`],
[`2-24`, `“그런데요.” 도로시가 잠시 생각하더니 말했다. “엠 아주머니는 마녀들이 아주아주 오래전에 다 죽었다고 하셨는데요.”`],
[`2-25`, `“엠 아주머니가 누구지요?” 작은 할머니가 물었다.`],
[`2-26`, `“제가 살던 캔자스에 계시는 우리 아주머니예요.”`],
[`2-27`, `북쪽 마녀는 고개를 숙이고 땅을 내려다보며 한동안 생각에 잠긴 것 같았다. 그러다가 고개를 들고 말했다. “캔자스가 어디 있는지 나는 모르겠어요. 그런 나라 이름은 한 번도 들어 본 적이 없거든요. 그런데 말해 봐요, 그곳은 문명국인가요?”`],
[`2-28`, `“아, 네.” 도로시가 대답했다.`],
[`2-29`, `“그렇다면 이해가 되네요. 문명국에는 이제 마녀도, 마법사도, 요술쟁이도, 마술사도 남아 있지 않다고 들었어요. 하지만 보다시피 오즈 나라는 한 번도 문명화된 적이 없답니다. 우리는 바깥세상과 완전히 떨어져 있으니까요. 그래서 우리에게는 아직도 마녀와 마법사가 있는 거예요.”`],
[`2-30`, `“마법사는 누구예요?” 도로시가 물었다.`],
[`2-31`, `“오즈님이 바로 위대한 마법사시지요.” 마녀가 목소리를 낮춰 속삭이듯 대답했다. “오즈님은 우리 마녀들을 모두 합친 것보다도 힘이 세답니다. 에메랄드 시에 사시지요.”`],
[`2-32`, `도로시가 또 하나 물어보려던 참에, 옆에서 말없이 서 있던 먼치킨들이 큰 소리를 지르며 나쁜 마녀가 누워 있던 집 모퉁이를 가리켰다.`],
[`2-33`, `“무슨 일이에요?” 작은 할머니가 묻고는 그쪽을 보더니 웃기 시작했다. 죽은 마녀의 두 발은 감쪽같이 사라지고, 은 구두만 남아 있었다.`],
[`2-34`, `“마녀가 워낙 늙었으니까 햇볕에 금세 말라 버린 거예요.” 북쪽 마녀가 설명했다. “이걸로 마녀는 끝이에요. 하지만 은 구두는 아가씨 것이니, 아가씨가 신도록 해요.” 마녀는 몸을 숙여 구두를 집어 들고, 먼지를 탈탈 털어 도로시에게 건네주었다.`],
[`2-35`, `“동쪽 마녀는 그 은 구두를 무척 자랑스러워했어요.” 먼치킨 하나가 말했다. “그 구두에는 무슨 마법이 깃들어 있다던데, 그게 뭔지는 우리도 끝내 알지 못했어요.”`],
[`2-36`, `도로시는 구두를 집 안으로 가지고 들어가 식탁 위에 올려놓았다. 그러고는 다시 먼치킨들에게 나와서 말했다.`],
[`2-37`, `“저는 얼른 아주머니와 아저씨께 돌아가고 싶어요. 틀림없이 저를 걱정하고 계실 거예요. 길을 찾도록 도와주실 수 있나요?”`],
[`2-38`, `먼치킨들과 마녀는 먼저 서로를 쳐다보고, 다음에는 도로시를 쳐다보더니, 고개를 저었다.`],
[`2-39`, `“여기서 멀지 않은 동쪽에는 커다란 사막이 있어요.” 한 사람이 말했다. “거기를 건너고 살아남은 사람은 아무도 없어요.”`],
[`2-40`, `“남쪽도 마찬가지예요.” 다른 사람이 말했다. “내가 거기 가서 직접 보았거든요. 남쪽은 쿼들링들의 나라예요.”`],
[`2-41`, `“듣자 하니 서쪽도 똑같다더군요.” 세 번째 남자가 말했다. “게다가 윙키들이 사는 그 나라는 서쪽의 나쁜 마녀가 다스리고 있어서, 아가씨가 그쪽으로 지나가면 마녀가 아가씨를 노예로 삼을 거예요.”`],
[`2-42`, `“북쪽은 내 고향이에요.” 할머니가 말했다. “그런데 그 끝에도 이 오즈 나라를 빙 둘러싼 똑같은 큰 사막이 있지요. 아가씨, 아무래도 우리와 함께 살아야 할 것 같군요.”`],
[`2-43`, `이 말을 듣자 도로시는 흐느껴 울기 시작했다. 낯선 사람들 틈에 있자니 너무 외로웠던 것이다. 마음씨 고운 먼치킨들은 도로시의 눈물을 보고 마음이 아팠는지, 곧바로 손수건을 꺼내더니 저희도 따라 울기 시작했다. 작은 할머니는 모자를 벗어 뾰족한 끝을 코끝에 세워 균형을 잡고는 엄숙한 목소리로 “하나, 둘, 셋” 하고 세었다. 그러자 모자가 곧바로 석판으로 바뀌었고, 그 위에는 커다란 흰 분필 글씨로 이렇게 적혀 있었다.`],
[`2-44`, `“도로시를 에메랄드 시로 보내라”`],
[`2-45`, `작은 할머니는 코끝에서 석판을 내려 글자를 읽더니 물었다. “아가씨 이름이 도로시인가요?”`],
[`2-46`, `“네.” 아이가 고개를 들고 눈물을 닦으며 대답했다.`],
[`2-47`, `“그렇다면 에메랄드 시로 가야 해요. 어쩌면 오즈님이 도와주실지도 몰라요.”`],
[`2-48`, `“그 도시는 어디에 있어요?” 도로시가 물었다.`],
[`2-49`, `“이 나라의 딱 한가운데에 있어요. 내가 말한 위대한 마법사 오즈님이 다스리는 곳이지요.”`],
[`2-50`, `“그분은 좋은 사람이에요?” 소녀가 걱정스럽게 물었다.`],
[`2-51`, `“좋은 마법사예요. 사람인지 아닌지는 나도 모르겠어요. 한 번도 본 적이 없거든요.”`],
[`2-52`, `“거기까지 어떻게 가요?” 도로시가 물었다.`],
[`2-53`, `“걸어가야 해요. 먼 길이랍니다. 때로는 즐겁고, 때로는 어둡고 무시무시한 땅을 지나야 하지요. 하지만 아가씨가 다치지 않도록 내가 아는 모든 마법을 다 쓸게요.”`],
[`2-54`, `“저랑 같이 가 주시면 안 돼요?” 소녀가 애원했다. 도로시에게는 어느새 이 작은 할머니가 단 하나뿐인 친구처럼 느껴졌던 것이다.`],
[`2-55`, `“그럴 수는 없어요.” 할머니가 대답했다. “하지만 내 입맞춤을 줄게요. 북쪽 마녀의 입맞춤을 받은 사람은 아무도 감히 해치지 못한답니다.”`],
[`2-56`, `할머니는 도로시에게 다가와 이마에 살며시 입을 맞추었다. 나중에 도로시가 알게 된 것이지만, 할머니의 입술이 닿은 자리에는 둥글고 반짝이는 자국이 남았다.`],
[`2-57`, `“에메랄드 시로 가는 길은 노란 벽돌로 깔려 있어서 길을 잃을 염려는 없어요.” 마녀가 말했다. “오즈님을 만나거든 무서워하지 말고, 아가씨 이야기를 하면서 도와 달라고 부탁해요. 잘 가요, 아가씨.”`],
[`2-58`, `세 먼치킨은 마녀에게 허리 숙여 인사하고 도로시에게 즐거운 여행이 되기를 빌어 준 다음, 나무들 사이로 걸어가 버렸다. 마녀는 도로시에게 다정하게 살짝 고개를 끄덕여 보이고는 왼쪽 발꿈치를 축으로 세 바퀴 빙그르르 돌더니 그 자리에서 사라져 버렸다. 꼬마 토토는 깜짝 놀랐다. 마녀가 곁에 있을 때는 무서워서 으르렁거리지도 못했던 토토는, 마녀가 사라지고 나서야 그 뒤에 대고 요란하게 짖어 댔다.`],
[`2-59`, `하지만 도로시는 그 사람이 마녀라는 걸 알고 있었으니, 꼭 그렇게 사라지리라고 생각했다. 그래서 조금도 놀라지 않았다.`],
  ]
};

/* 원문 책장: 원작 3~4장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch2 = {
  title: `허수아비를 구하다 · 숲으로 가는 길`,
  orig: `원작 3~4장`,
  paras: [
[`h`, `원작 3장 「도로시, 허수아비를 구하다」`],
[`3-1`, `혼자 남은 도로시는 배가 고파지기 시작했다. 그래서 찬장으로 가서 빵을 잘라 버터를 발랐다. 토토에게도 조금 나눠 주고, 선반에서 들통을 꺼내 들고 작은 시냇물로 내려가 맑고 반짝이는 물을 가득 길었다. 토토는 나무 쪽으로 달려가 가지에 앉은 새들을 향해 짖기 시작했다. 토토를 데리러 간 도로시는 가지마다 맛있어 보이는 열매가 주렁주렁 매달린 것을 보고 몇 개를 땄다. 아침 식사에 곁들이기에 딱 알맞은 열매였다.`],
[`3-2`, `그런 다음 집으로 돌아와 시원하고 맑은 물을 토토와 함께 실컷 마시고는, 에메랄드 시로 떠날 채비를 시작했다.`],
[`3-3`, `도로시에게는 옷이 딱 한 벌 더 있었는데, 마침 깨끗하게 빨아서 침대 옆 못에 걸어 둔 참이었다. 흰색과 파란색 체크무늬 면 원피스였다. 여러 번 빤 탓에 파란색이 조금 바래긴 했지만 여전히 예쁜 옷이었다. 소녀는 몸을 꼼꼼히 씻고 깨끗한 체크무늬 원피스를 입은 다음, 분홍색 햇빛 가리개 모자를 머리에 썼다. 그리고 작은 바구니를 꺼내 찬장에 있던 빵을 가득 담고 그 위를 하얀 천으로 덮었다. 그러다 자기 발을 내려다보고는 신발이 얼마나 낡고 해졌는지 알게 되었다.`],
[`3-4`, `“이 신발로는 먼 길을 절대 못 가겠어, 토토.” 도로시가 말했다. 토토는 작고 까만 눈으로 도로시의 얼굴을 올려다보며, 무슨 말인지 안다는 듯 꼬리를 흔들었다.`],
[`3-5`, `바로 그때 도로시의 눈에 식탁 위에 놓인 은 구두가 들어왔다. 동쪽 마녀가 신던 구두였다.`],
[`3-6`, `“이게 나한테 맞을까?” 도로시가 토토에게 말했다. “닳지도 않을 테니 먼 길을 걷기에는 딱이겠는데.”`],
[`3-7`, `도로시는 낡은 가죽 신발을 벗고 은 구두를 신어 보았다. 구두는 마치 도로시를 위해 만든 것처럼 발에 꼭 맞았다.`],
[`3-8`, `마지막으로 도로시는 바구니를 집어 들었다.`],
[`3-9`, `“가자, 토토.” 도로시가 말했다. “에메랄드 시로 가서 위대한 오즈님께 캔자스로 돌아가는 방법을 여쭤보자.”`],
[`3-10`, `도로시는 문을 닫고 잠근 다음, 열쇠를 원피스 주머니에 조심스럽게 넣었다. 그렇게 토토가 뒤에서 얌전히 종종걸음으로 따라오는 가운데, 도로시는 여행을 시작했다.`],
[`3-11`, `근처에는 길이 여러 갈래 있었지만, 노란 벽돌이 깔린 길을 찾는 데는 오래 걸리지 않았다. 도로시는 곧 에메랄드 시를 향해 씩씩하게 걸어가고 있었다. 단단한 노란 길바닥 위에서 은 구두가 즐겁게 짤랑거렸다. 해는 밝게 빛나고 새들은 달콤하게 노래했다. 그래서 도로시는, 갑자기 제 나라에서 휙 날려 와 낯선 땅 한가운데에 떨어진 어린 소녀라면 그러리라고 여러분이 생각하는 것만큼 그렇게 슬프지는 않았다.`],
[`3-12`, `걸어가면서 도로시는 주위의 땅이 무척 아름다워서 놀랐다. 길 양옆에는 산뜻한 파란색으로 칠한 깔끔한 울타리가 있었고, 그 너머에는 곡식과 채소가 가득한 밭이 펼쳐져 있었다. 먼치킨들은 솜씨 좋은 농부들이어서 농사를 풍성하게 짓는 것이 분명했다. 이따금 집 앞을 지나가면 사람들이 나와서 도로시를 바라보며 허리 숙여 깊이 인사했다. 나쁜 마녀를 없애고 자기들을 노예 신세에서 풀어 준 사람이 도로시라는 것을 모두가 알고 있었기 때문이다. 먼치킨들의 집은 별난 모양이었다. 집마다 둥글고, 지붕은 커다란 둥근 지붕이었다. 그리고 모두 파란색으로 칠해져 있었다. 이 동쪽 나라에서는 파란색이 가장 사랑받는 색이었기 때문이다.`],
[`3-13`, `저녁 무렵, 오래 걸어서 지친 도로시가 오늘 밤은 어디서 지내야 하나 걱정하기 시작했을 때, 다른 집들보다 조금 더 큰 집 한 채가 나타났다. 집 앞 초록 잔디밭에서는 많은 남자와 여자들이 춤을 추고 있었다. 꼬마 바이올린 연주자 다섯이 힘껏 큰 소리로 연주했고, 사람들은 웃으며 노래했다. 그 옆 커다란 식탁 위에는 맛있는 과일과 견과, 파이와 케이크, 그 밖에도 맛있는 음식이 가득 차려져 있었다.`],
[`3-14`, `사람들은 도로시를 반갑게 맞이하며 함께 저녁을 먹고 하룻밤 묵어 가라고 권했다. 이곳은 이 나라에서 가장 부유한 먼치킨의 집이었고, 친구들이 그와 함께 모여 나쁜 마녀에게서 풀려난 것을 축하하고 있었다.`],
[`3-15`, `도로시는 저녁을 배불리 먹었다. 그 부자 먼치킨이 몸소 도로시의 시중을 들었는데, 그의 이름은 보크였다. 식사를 마친 도로시는 긴 의자에 앉아 사람들이 춤추는 것을 구경했다.`],
[`3-16`, `보크는 도로시의 은 구두를 보더니 말했다. “아가씨는 틀림없이 위대한 마법사이시군요.”`],
[`3-17`, `“왜요?” 소녀가 물었다.`],
[`3-18`, `“은 구두를 신고 계시고 나쁜 마녀를 없애셨으니까요. 게다가 옷에 흰색이 들어 있잖아요. 흰옷은 마녀와 마법사만 입거든요.”`],
[`3-19`, `“제 옷은 파란색과 흰색 체크무늬인걸요.” 도로시는 원피스의 구김을 펴며 말했다.`],
[`3-20`, `“그 옷을 입어 주시다니 고맙습니다.” 보크가 말했다. “파란색은 먼치킨의 색이고 흰색은 마녀의 색이지요. 그러니 아가씨가 우리와 친한 마녀라는 걸 알 수 있답니다.”`],
[`3-21`, `도로시는 뭐라고 대답해야 할지 몰랐다. 사람들은 모두 도로시를 마녀라고 생각하는 것 같았지만, 도로시는 자기가 우연히 회오리바람에 실려 낯선 땅에 오게 된 평범한 어린 소녀일 뿐이라는 것을 잘 알고 있었다.`],
[`3-22`, `춤 구경에 지치자 보크는 도로시를 집 안으로 데려가 예쁜 침대가 있는 방을 내주었다. 침대보는 파란 천으로 되어 있었다. 도로시는 그 침대에서 아침까지 푹 잤고, 토토는 곁의 파란 깔개 위에 몸을 말고 잠들었다.`],
[`3-23`, `도로시는 아침을 든든히 먹고, 아주 조그만 먼치킨 아기가 토토와 노는 모습을 구경했다. 아기는 토토의 꼬리를 잡아당기며 까르르 웃고 소리를 질렀는데, 그 모습이 도로시에게는 무척 재미있었다. 이곳 사람들은 개를 한 번도 본 적이 없었기 때문에 토토는 모두에게 아주 신기한 구경거리였다.`],
[`3-24`, `“에메랄드 시까지는 얼마나 멀어요?” 소녀가 물었다.`],
[`3-25`, `“모르겠어요.” 보크가 진지하게 대답했다. “나는 한 번도 가 본 적이 없거든요. 볼일이 있는 게 아니라면 오즈님 곁에는 가지 않는 게 좋아요. 하지만 에메랄드 시까지는 먼 길이라 여러 날이 걸릴 거예요. 이곳은 풍요롭고 즐거운 땅이지만, 여행이 끝나기 전에 험하고 위험한 곳들을 지나야 할 거예요.”`],
[`3-26`, `도로시는 이 말에 조금 걱정이 되었다. 하지만 캔자스로 다시 돌아가도록 도와줄 수 있는 사람은 위대한 오즈님뿐이라는 것을 알았기에, 돌아서지 않겠다고 용감하게 마음먹었다.`],
[`3-27`, `도로시는 친구들에게 작별 인사를 하고 다시 노란 벽돌 길을 따라 걷기 시작했다. 몇 마일쯤 걸어가자 좀 쉬어야겠다는 생각이 들어서, 길가 울타리 꼭대기에 올라가 앉았다. 울타리 너머에는 커다란 옥수수밭이 있었다. 멀지 않은 곳에 허수아비 하나가 보였는데, 잘 익은 옥수수에 새들이 오지 못하도록 장대 위에 높이 세워져 있었다.`],
[`3-28`, `도로시는 손으로 턱을 괴고 허수아비를 곰곰이 바라보았다. 허수아비의 머리는 짚을 채운 작은 자루였고, 얼굴처럼 보이도록 눈과 코와 입이 그려져 있었다. 머리에는 어느 먼치킨이 쓰던 낡고 뾰족한 파란 모자가 얹혀 있었다. 나머지는 낡고 빛바랜 파란 옷 한 벌이었는데, 거기에도 짚이 채워져 있었다. 발에는 이 나라 남자들이 모두 신는 것처럼 윗부분이 파란 낡은 장화를 신고 있었다. 그리고 등에 꽂은 장대에 매달려 옥수숫대 위로 높이 들려 있었다.`],
[`3-29`, `도로시가 허수아비의 별나게 그려진 얼굴을 유심히 들여다보고 있는데, 깜짝 놀랍게도 허수아비의 한쪽 눈이 천천히 윙크를 하는 것이 아닌가. 처음에는 잘못 본 줄 알았다. 캔자스의 허수아비들은 윙크를 하는 법이 없었으니까. 그런데 곧 허수아비가 도로시에게 다정하게 고개를 끄덕였다. 도로시는 울타리에서 내려와 허수아비에게 걸어갔고, 토토는 장대 주위를 빙빙 돌며 짖어 댔다.`],
[`3-30`, `“안녕하세요.” 허수아비가 조금 쉰 목소리로 말했다.`],
[`3-31`, `“방금 말했어요?” 소녀가 놀라서 물었다.`],
[`3-32`, `“그럼요.” 허수아비가 대답했다. “잘 지내세요?”`],
[`3-33`, `“네, 잘 지내요. 고마워요.” 도로시가 공손하게 대답했다. “당신은 어떠세요?”`],
[`3-34`, `“나는 별로예요.” 허수아비가 빙긋 웃으며 말했다. “까마귀를 쫓으려고 밤낮으로 여기 매달려 있자니 너무 지루하거든요.”`],
[`3-35`, `“내려올 수 없어요?” 도로시가 물었다.`],
[`3-36`, `“네, 이 장대가 등에 꽂혀 있어서요. 장대를 빼 주신다면 정말 고맙겠어요.”`],
[`3-37`, `도로시는 두 팔을 뻗어 허수아비를 장대에서 들어 올렸다. 짚으로 채워져 있어서 아주 가벼웠다.`],
[`3-38`, `“정말 고마워요.” 땅에 내려선 허수아비가 말했다. “새사람이 된 기분이에요.”`],
[`3-39`, `도로시는 어리둥절했다. 속을 채운 인형이 말을 하고, 허리 숙여 인사하고, 자기 옆에서 함께 걷는 모습이 무척 이상했기 때문이다.`],
[`3-40`, `“아가씨는 누구예요?” 허수아비가 기지개를 켜고 하품을 하더니 물었다. “어디로 가는 길이에요?”`],
[`3-41`, `“제 이름은 도로시예요.” 소녀가 말했다. “에메랄드 시에 가서, 위대한 오즈님께 저를 캔자스로 돌려보내 달라고 부탁하려고요.”`],
[`3-42`, `“에메랄드 시가 어디 있는데요?” 허수아비가 물었다. “그리고 오즈가 누구예요?”`],
[`3-43`, `“어머, 모르세요?” 도로시가 놀라서 되물었다.`],
[`3-44`, `“네, 정말 몰라요. 나는 아무것도 몰라요. 보다시피 속이 짚으로 채워져 있어서 뇌가 하나도 없거든요.” 허수아비가 슬프게 대답했다.`],
[`3-45`, `“아.” 도로시가 말했다. “정말 안됐네요.”`],
[`3-46`, `“혹시,” 허수아비가 물었다. “내가 아가씨랑 같이 에메랄드 시에 가면, 오즈가 나한테 뇌를 좀 줄까요?”`],
[`3-47`, `“그건 모르겠어요.” 도로시가 대답했다. “하지만 원한다면 저랑 같이 가도 돼요. 오즈님이 뇌를 주지 않더라도 지금보다 나빠지지는 않을 테니까요.”`],
[`3-48`, `“그건 그렇네요.” 허수아비가 말했다. 그러고는 속을 털어놓듯 말을 이었다. “있잖아요, 나는 팔다리와 몸통에 짚이 들어 있는 건 괜찮아요. 다칠 일이 없으니까요. 누가 내 발가락을 밟거나 핀으로 찔러도 상관없어요. 아무것도 느끼지 못하니까요. 하지만 사람들이 나를 바보라고 부르는 건 싫어요. 아가씨처럼 머릿속에 뇌가 아니라 계속 짚만 들어 있다면, 내가 어떻게 무엇이든 알 수 있겠어요?”`],
[`3-49`, `“어떤 기분인지 알아요.” 진심으로 허수아비를 가엾게 여긴 어린 소녀가 말했다. “저랑 같이 가면 오즈님께 당신을 위해 할 수 있는 일을 다 해 달라고 부탁할게요.”`],
[`3-50`, `“고마워요.” 허수아비가 고마워하며 대답했다.`],
[`3-51`, `둘은 길로 돌아갔다. 도로시는 허수아비가 울타리를 넘도록 도와주었고, 둘은 에메랄드 시를 향해 노란 벽돌 길을 걷기 시작했다.`],
[`3-52`, `토토는 처음에는 일행이 하나 늘어난 것이 마음에 들지 않았다. 짚 속에 쥐 둥지라도 있는지 의심하는 것처럼 속을 채운 남자 주위를 킁킁거리고 다녔고, 허수아비를 향해 자주 사납게 으르렁거렸다.`],
[`3-53`, `“토토는 신경 쓰지 마세요.” 도로시가 새 친구에게 말했다. “절대 물지 않아요.”`],
[`3-54`, `“아, 무섭지 않아요.” 허수아비가 대답했다. “짚은 다칠 일이 없으니까요. 그 바구니는 내가 들어 줄게요. 나는 지치지 않으니 괜찮아요. 비밀 하나 알려 줄까요?” 허수아비가 걸으면서 말을 이었다. “세상에서 내가 무서워하는 건 딱 하나뿐이에요.”`],
[`3-55`, `“그게 뭔데요?” 도로시가 물었다. “당신을 만든 먼치킨 농부요?”`],
[`3-56`, `“아니요.” 허수아비가 대답했다. “불붙은 성냥이에요.”`],
[`h`, `원작 4장 「숲으로 가는 길」`],
[`4-1`, `몇 시간이 지나자 길이 험해지기 시작했다. 이곳의 노란 벽돌은 몹시 울퉁불퉁해서 걷기가 무척 힘들었고, 허수아비는 자꾸 벽돌에 걸려 비틀거렸다. 어떤 곳은 벽돌이 깨지거나 아예 빠져 있어서 구멍이 나 있었는데, 토토는 그 구멍을 폴짝 뛰어넘었고 도로시는 빙 돌아서 걸었다. 하지만 뇌가 없는 허수아비는 곧장 앞으로만 걸어서, 구멍에 발을 헛디뎌 딱딱한 벽돌 위로 길게 쭉 넘어지곤 했다. 그래도 허수아비는 조금도 아프지 않았다. 도로시가 허수아비를 일으켜 다시 세워 주면, 허수아비는 도로시와 함께 자기 실수를 두고 즐겁게 웃었다.`],
[`4-2`, `이곳의 농장들은 앞서 지나온 곳만큼 잘 가꾸어져 있지 않았다. 집도 과일나무도 드물었고, 멀리 갈수록 땅은 점점 더 쓸쓸하고 외로워졌다.`],
[`4-3`, `한낮이 되자 둘은 작은 시냇가 옆 길가에 앉았다. 도로시는 바구니를 열고 빵을 꺼냈다. 허수아비에게도 한 조각 권했지만 허수아비는 사양했다.`],
[`4-4`, `“나는 배가 고픈 적이 없어요.” 허수아비가 말했다. “그게 다행이에요. 내 입은 그려 놓은 것뿐이라, 먹으려고 입에 구멍을 내면 속에 든 짚이 빠져나와서 머리 모양이 망가질 테니까요.”`],
[`4-5`, `도로시는 그 말이 맞다는 걸 금방 알아차리고, 고개만 끄덕인 채 빵을 계속 먹었다.`],
[`4-6`, `“아가씨 이야기랑 아가씨가 살던 나라 이야기를 좀 해 줘요.” 도로시가 식사를 마치자 허수아비가 말했다. 그래서 도로시는 캔자스에 대해, 그곳이 얼마나 온통 잿빛인지, 그리고 회오리바람이 자기를 어떻게 이 별난 오즈 나라로 데려왔는지 모두 이야기해 주었다.`],
[`4-7`, `허수아비는 귀 기울여 듣더니 말했다. “이렇게 아름다운 나라를 떠나서, 아가씨가 캔자스라고 부르는 그 메마른 잿빛 곳으로 왜 돌아가고 싶어 하는지 모르겠어요.”`],
[`4-8`, `“그건 당신이 뇌가 없어서 그래요.” 소녀가 대답했다. “우리 집이 아무리 쓸쓸하고 잿빛이라도, 살과 피로 된 우리 사람들은 다른 어떤 나라보다 거기서 살고 싶어 해요. 그곳이 아무리 아름답더라도요. 집만 한 곳은 없어요.”`],
[`4-9`, `허수아비는 한숨을 쉬었다.`],
[`4-10`, `“물론 나는 이해할 수 없지요.” 허수아비가 말했다. “사람들 머리가 나처럼 짚으로 채워져 있다면 아마 모두 아름다운 곳에서 살 테고, 그러면 캔자스에는 사람이 하나도 없겠지요. 사람들에게 뇌가 있다는 게 캔자스로서는 다행이네요.”`],
[`4-11`, `“쉬는 동안 이야기 하나 해 주지 않을래요?” 아이가 물었다.`],
[`4-12`, `허수아비는 원망스럽다는 듯 도로시를 바라보며 대답했다.`],
[`4-13`, `“나는 태어난 지 얼마 안 돼서 정말 아무것도 몰라요. 그저께 만들어졌거든요. 그 전에 세상에서 일어난 일은 하나도 몰라요. 다행히 농부가 내 머리를 만들 때 맨 처음 한 일 가운데 하나가 귀를 그리는 거였어요. 그래서 주위에서 무슨 일이 일어나는지 들을 수 있었지요. 농부 곁에는 다른 먼치킨이 한 명 있었는데, 내가 처음 들은 말은 농부가 이렇게 말하는 소리였어요. ‘이 귀 어때?’`],
[`4-14`, `“ ‘비뚤어졌는데.’ 다른 사람이 대답했어요.`],
[`4-15`, `“ ‘상관없어.’ 농부가 말했어요. ‘그래도 귀는 귀니까.’ 맞는 말이었지요.`],
[`4-16`, `“ ‘이제 눈을 그려야지.’ 농부가 말했어요. 그러고는 내 오른쪽 눈을 그렸는데, 다 그리자마자 나는 농부와 내 주위의 모든 것을 아주 궁금한 마음으로 바라보게 되었어요. 내가 세상을 처음으로 본 순간이었거든요.`],
[`4-17`, `“ ‘꽤 예쁜 눈이군.’ 농부를 지켜보던 먼치킨이 말했어요. ‘눈에는 파란 물감이 딱이야.’`],
[`4-18`, `“ ‘다른 쪽 눈은 조금 더 크게 그려야겠어.’ 농부가 말했어요. 두 번째 눈이 다 그려지자 전보다 훨씬 잘 보였지요. 그런 다음 농부는 내 코와 입을 그렸어요. 하지만 나는 말을 하지 않았어요. 그때는 입이 무엇에 쓰는 건지 몰랐거든요. 두 사람이 내 몸통과 팔다리를 만드는 걸 구경하는 건 재미있었어요. 그리고 마침내 머리를 몸에 붙였을 때, 나는 무척 자랑스러웠어요. 나도 누구 못지않게 훌륭한 사람이라고 생각했거든요.`],
[`4-19`, `“ ‘이 녀석이면 까마귀를 금방 쫓아내겠어.’ 농부가 말했어요. ‘꼭 사람 같잖아.’`],
[`4-20`, `“ ‘아니, 사람이 맞지.’ 다른 사람이 말했고, 나도 그 말에 완전히 동의했어요. 농부는 나를 옆구리에 끼고 옥수수밭으로 가서, 아가씨가 나를 찾은 그 높은 막대 위에 세웠어요. 그러고는 친구와 함께 곧 가 버리고 나만 혼자 남겨 두었지요.`],
[`4-21`, `“이렇게 버려지는 건 싫었어요. 그래서 그 사람들을 따라 걸어가려고 했어요. 하지만 발이 땅에 닿지 않아서 어쩔 수 없이 장대 위에 있어야 했지요. 외로운 생활이었어요. 만들어진 지 얼마 안 돼서 생각할 거리가 하나도 없었으니까요. 까마귀랑 다른 새들이 옥수수밭에 많이 날아들었는데, 나를 보자마자 먼치킨인 줄 알고 다시 날아가 버렸어요. 그게 기뻐서 나는 내가 꽤 중요한 사람이라고 느꼈어요. 그러다 늙은 까마귀 한 마리가 내 곁으로 날아오더니, 나를 꼼꼼히 살펴보고는 내 어깨에 앉아서 말했어요.`],
[`4-22`, `“ ‘그 농부가 이런 어설픈 꾀로 나를 속일 수 있다고 생각했나 보군. 생각이 있는 까마귀라면 네가 짚으로 채운 인형일 뿐이라는 걸 다 알 텐데.’ 그러고는 내 발치로 폴짝 내려와 옥수수를 실컷 먹었어요. 다른 새들도 까마귀가 나한테 아무 해도 입지 않는 걸 보고 옥수수를 먹으러 왔고, 금세 내 주위에 커다란 새 떼가 모였어요.`],
[`4-23`, `“나는 슬펐어요. 결국 내가 그리 훌륭한 허수아비가 아니라는 뜻이었으니까요. 하지만 늙은 까마귀가 나를 위로하며 말했어요. ‘네 머릿속에 뇌만 있다면 너도 저 사람들 누구 못지않은 사람일 거야. 어떤 사람들보다는 더 나은 사람일 테고. 까마귀든 사람이든, 이 세상에서 가질 만한 건 뇌뿐이란다.’`],
[`4-24`, `“까마귀들이 떠난 뒤 나는 이 말을 곰곰이 생각했어요. 그리고 어떻게든 뇌를 얻어야겠다고 마음먹었지요. 운 좋게도 아가씨가 지나가다 나를 막대에서 내려 주었어요. 아가씨 말을 들어 보니, 에메랄드 시에 가기만 하면 위대한 오즈가 틀림없이 나한테 뇌를 줄 것 같아요.”`],
[`4-25`, `“그러면 좋겠어요.” 도로시가 진심으로 말했다. “그렇게 갖고 싶어 하니까요.”`],
[`4-26`, `“아, 그럼요. 정말 갖고 싶어요.” 허수아비가 대답했다. “자기가 바보라는 걸 안다는 건 정말 불편한 기분이거든요.”`],
[`4-27`, `“자,” 소녀가 말했다. “이제 가요.” 그러고는 바구니를 허수아비에게 건넸다.`],
[`4-28`, `이제 길가에는 울타리가 하나도 없었고, 땅은 거칠고 아무도 일구지 않은 채였다. 저녁 무렵 둘은 커다란 숲에 이르렀다. 나무들이 어찌나 크고 빽빽하게 자랐는지 가지들이 노란 벽돌 길 위에서 서로 맞닿아 있었다. 가지들이 햇빛을 가려서 나무 아래는 거의 캄캄했다. 하지만 여행자들은 멈추지 않고 숲속으로 들어갔다.`],
[`4-29`, `“이 길이 숲으로 들어간다면 나오기도 할 거예요.” 허수아비가 말했다. “그리고 에메랄드 시는 이 길의 끝에 있으니까, 우리는 길이 이끄는 대로 어디든 가야 해요.”`],
[`4-30`, `“그건 누구나 알아요.” 도로시가 말했다.`],
[`4-31`, `“물론이지요. 그러니까 나도 아는 거예요.” 허수아비가 대답했다. “뇌가 있어야 알 수 있는 거라면 나는 절대 그런 말을 못 했을 거예요.”`],
[`4-32`, `한 시간쯤 지나자 빛이 사라지고, 둘은 어둠 속을 비틀거리며 걷게 되었다. 도로시는 아무것도 보이지 않았지만 토토는 잘 보였다. 어떤 개들은 어둠 속에서도 아주 잘 보기 때문이다. 허수아비도 낮처럼 잘 보인다고 했다. 그래서 도로시는 허수아비의 팔을 붙잡고 그럭저럭 잘 걸어갈 수 있었다.`],
[`4-33`, `“집이나 밤을 지낼 만한 곳이 보이면 꼭 말해 줘요.” 도로시가 말했다. “어둠 속을 걷는 건 너무 힘들어요.”`],
[`4-34`, `얼마 지나지 않아 허수아비가 걸음을 멈췄다.`],
[`4-35`, `“우리 오른쪽에 작은 오두막이 보여요.” 허수아비가 말했다. “통나무랑 나뭇가지로 지은 집이에요. 거기로 갈까요?”`],
[`4-36`, `“네, 좋아요.” 아이가 대답했다. “너무 지쳤어요.”`],
[`4-37`, `그래서 허수아비가 나무들 사이로 도로시를 이끌어 오두막에 이르렀다. 안으로 들어간 도로시는 한쪽 구석에서 마른 나뭇잎으로 된 잠자리를 발견했다. 도로시는 곧바로 누웠고, 곁에 누운 토토와 함께 곧 깊은 잠에 빠졌다. 지치는 법이 없는 허수아비는 다른 구석에 서서 아침이 올 때까지 참을성 있게 기다렸다.`],
  ]
};

/* 원문 책장: 원작 5장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch3 = {
  title: `양철 나무꾼을 구하다`,
  orig: `원작 5장`,
  paras: [
[`5-1`, `도로시가 잠에서 깼을 때 햇살이 나무 사이로 비치고 있었고, 토토는 벌써 한참 전에 밖으로 나가 주위의 새와 다람쥐를 쫓아다니고 있었다. 도로시는 일어나 앉아 주위를 둘러보았다. 허수아비가 여전히 구석에 참을성 있게 서서 도로시를 기다리고 있었다.`],
[`5-2`, `“물을 찾으러 가야겠어요.” 도로시가 허수아비에게 말했다.`],
[`5-3`, `“물은 왜요?” 허수아비가 물었다.`],
[`5-4`, `“길에서 묻은 먼지를 씻어 내려고요. 그리고 마른 빵이 목에 걸리지 않게 마시기도 해야 하고요.”`],
[`5-5`, `“살로 만들어진다는 건 참 불편하겠어요.” 허수아비가 생각에 잠겨 말했다. “잠도 자야 하고, 먹고 마시기도 해야 하니까요. 그래도 아가씨에게는 뇌가 있잖아요. 제대로 생각할 수 있다는 건 그런 수고를 많이 들일 만한 가치가 있지요.”`],
[`5-6`, `둘은 오두막을 나와 나무 사이를 걷다가 맑은 물이 솟는 작은 샘을 찾았다. 도로시는 그곳에서 물을 마시고 몸을 씻고 아침을 먹었다. 바구니를 보니 빵이 얼마 남지 않았다. 소녀는 허수아비가 아무것도 먹지 않아도 된다는 게 고마웠다. 남은 빵은 오늘 하루 자신과 토토가 먹기에도 빠듯했기 때문이다.`],
[`5-7`, `식사를 마치고 노란 벽돌 길로 돌아가려던 참에, 도로시는 가까운 곳에서 들려오는 깊은 신음 소리에 깜짝 놀랐다.`],
[`5-8`, `“방금 그게 뭐였어요?” 도로시가 겁먹은 목소리로 물었다.`],
[`5-9`, `“짐작도 안 가요.” 허수아비가 대답했다. “하지만 가 보면 알 수 있겠지요.”`],
[`5-10`, `바로 그때 또 한 번 신음 소리가 들렸는데, 뒤쪽에서 나는 소리 같았다. 둘이 돌아서서 숲속으로 몇 걸음 걸어가자, 도로시는 나무 사이로 떨어지는 햇살 한 줄기 속에서 무언가 반짝이는 것을 발견했다. 그곳으로 달려간 도로시는 놀라서 작게 소리치며 우뚝 멈춰 섰다.`],
[`5-11`, `커다란 나무 한 그루가 반쯤 베어져 있었고, 그 옆에 도끼를 높이 쳐든 채 서 있는 것은 온몸이 양철로 된 사람이었다. 머리와 팔다리는 마디로 몸통에 이어져 있었지만, 그 사람은 꼼짝도 할 수 없다는 듯 완전히 굳은 채 서 있었다.`],
[`5-12`, `도로시는 깜짝 놀라 그 사람을 바라보았고 허수아비도 마찬가지였다. 토토는 날카롭게 짖으며 양철 다리를 콱 물었다가 이빨만 아팠다.`],
[`5-13`, `“방금 신음 소리 낸 게 당신이에요?” 도로시가 물었다.`],
[`5-14`, `“네.” 양철 사람이 대답했다. “제가 그랬어요. 일 년도 넘게 신음하고 있었는데, 지금까지 아무도 그 소리를 듣거나 도우러 와 주지 않았어요.”`],
[`5-15`, `“제가 뭘 도와 드릴까요?” 도로시가 부드럽게 물었다. 그 사람의 슬픈 목소리에 마음이 움직였기 때문이다.`],
[`5-16`, `“기름통을 가져와서 제 마디마디에 기름을 쳐 주세요.” 그가 대답했다. “너무 심하게 녹슬어서 전혀 움직일 수가 없어요. 기름을 잘 치면 곧 괜찮아질 거예요. 제 오두막 선반 위에 기름통이 있을 거예요.”`],
[`5-17`, `도로시는 곧장 오두막으로 달려가 기름통을 찾아 돌아와서는 걱정스럽게 물었다. “마디가 어디 있어요?”`],
[`5-18`, `“목부터 기름을 쳐 주세요.” 양철 나무꾼이 대답했다. 도로시가 목에 기름을 쳤는데, 꽤 심하게 녹슬어 있어서 허수아비가 양철 머리를 붙잡고 부드럽게 좌우로 움직여 주었다. 목이 부드럽게 돌아가자 그 사람도 스스로 머리를 돌릴 수 있게 되었다.`],
[`5-19`, `“이제 팔 마디에 기름을 쳐 주세요.” 그가 말했다. 도로시가 기름을 치자 허수아비가 팔을 조심스럽게 구부렸고, 마침내 팔은 녹이 말끔히 풀려 새것처럼 되었다.`],
[`5-20`, `양철 나무꾼은 흡족한 한숨을 내쉬며 도끼를 내려 나무에 기대 놓았다.`],
[`5-21`, `“정말 살 것 같아요.” 그가 말했다. “녹슨 뒤로 줄곧 도끼를 공중에 들고 있었는데, 마침내 내려놓을 수 있어서 기뻐요. 이제 다리 마디에도 기름을 쳐 주시면 완전히 괜찮아질 거예요.”`],
[`5-22`, `그래서 둘은 그가 다리를 자유롭게 움직일 수 있을 때까지 기름을 쳐 주었다. 양철 나무꾼은 풀려난 것에 대해 몇 번이고 고맙다고 했다. 아주 예의 바르고 고마움을 잘 아는 사람 같았다.`],
[`5-23`, `“두 분이 오지 않았다면 저는 영영 거기 서 있었을지도 몰라요.” 그가 말했다. “그러니 두 분은 틀림없이 제 목숨을 구해 준 거예요. 어떻게 여기까지 오셨어요?”`],
[`5-24`, `“우리는 위대한 오즈님을 만나러 에메랄드 시로 가는 길이에요.” 도로시가 대답했다. “그러다 당신 오두막에서 하룻밤 묵었어요.”`],
[`5-25`, `“왜 오즈를 만나려고 해요?” 그가 물었다.`],
[`5-26`, `“저는 오즈님께 캔자스로 돌려보내 달라고 부탁하려고요. 그리고 허수아비는 머리에 뇌를 좀 넣어 달라고 부탁하려고요.” 도로시가 대답했다.`],
[`5-27`, `양철 나무꾼은 잠시 깊이 생각하는 것 같더니 말했다.`],
[`5-28`, `“오즈가 나에게 심장을 줄 수 있을까요?”`],
[`5-29`, `“아마 그럴 거예요.” 도로시가 대답했다. “허수아비에게 뇌를 주는 것만큼 쉬운 일일 테니까요.”`],
[`5-30`, `“그렇겠군요.” 양철 나무꾼이 대답했다. “그러면 저도 일행에 끼워 주신다면, 에메랄드 시에 가서 오즈에게 도와 달라고 부탁하고 싶어요.”`],
[`5-31`, `“같이 가요!” 허수아비가 반갑게 말했고, 도로시도 함께 가게 되어 기쁘다고 덧붙였다. 그래서 양철 나무꾼은 도끼를 어깨에 메었고, 셋은 숲을 지나 노란 벽돌이 깔린 길에 이르렀다.`],
[`5-32`, `양철 나무꾼은 기름통을 도로시의 바구니에 넣어 달라고 부탁했다. “혹시 비를 맞아서 다시 녹슬면 기름통이 꼭 필요하거든요.” 그가 말했다.`],
[`5-33`, `새 동료가 일행에 끼게 된 것은 꽤 운 좋은 일이었다. 다시 길을 떠난 지 얼마 지나지 않아, 나무와 가지가 길 위로 어찌나 빽빽하게 자랐는지 여행자들이 지나갈 수 없는 곳이 나타났기 때문이다. 하지만 양철 나무꾼이 도끼를 들고 일을 시작하더니 어찌나 잘 베었는지 곧 일행 모두가 지나갈 길이 뚫렸다.`],
[`5-34`, `걸어가면서 도로시는 생각에 너무 깊이 빠져 있어서, 허수아비가 구멍에 걸려 길가로 굴러떨어진 것도 알아채지 못했다. 허수아비는 도로시를 불러서 일으켜 달라고 해야 했다.`],
[`5-35`, `“왜 구멍을 돌아서 걷지 않았어요?” 양철 나무꾼이 물었다.`],
[`5-36`, `“나는 아는 게 별로 없거든요.” 허수아비가 명랑하게 대답했다. “알다시피 내 머리에는 짚이 들어 있어요. 그래서 오즈에게 뇌를 좀 달라고 부탁하러 가는 거예요.”`],
[`5-37`, `“아, 그렇군요.” 양철 나무꾼이 말했다. “하지만 뇌가 세상에서 제일 좋은 건 아니에요.”`],
[`5-38`, `“당신은 뇌가 있어요?” 허수아비가 물었다.`],
[`5-39`, `“아니요, 제 머리는 텅 비었어요.” 나무꾼이 대답했다. “하지만 예전에는 뇌도 있었고 심장도 있었지요. 둘 다 가져 본 사람으로서, 저는 심장을 갖는 쪽이 훨씬 좋아요.”`],
[`5-40`, `“왜요?” 허수아비가 물었다.`],
[`5-41`, `“제 이야기를 들려드릴게요. 그러면 알게 될 거예요.”`],
[`5-42`, `그래서 숲속을 걸어가는 동안 양철 나무꾼은 이런 이야기를 들려주었다.`],
[`5-43`, `“저는 숲에서 나무를 베어 그 나무를 팔아 먹고사는 나무꾼의 아들로 태어났어요. 자라서 저도 나무꾼이 되었고, 아버지가 돌아가신 뒤에는 늙은 어머니가 살아 계시는 동안 어머니를 돌보았어요. 그러다 혼자 살면 외로울 테니 결혼을 해야겠다고 마음먹었지요.`],
[`5-44`, `“먼치킨 처녀 가운데 한 사람이 무척 아름다워서, 저는 곧 온 마음을 다해 그녀를 사랑하게 되었어요. 그녀도 제가 더 좋은 집을 지을 만큼 돈을 벌면 곧바로 결혼하겠다고 약속했어요. 그래서 저는 전보다 더 열심히 일했지요. 그런데 그녀는 한 노파와 함께 살고 있었는데, 그 노파는 그녀가 아무하고도 결혼하지 않기를 바랐어요. 노파는 너무 게을러서 그녀가 자기 곁에 남아 요리와 집안일을 해 주기를 바랐거든요. 그래서 노파는 동쪽의 나쁜 마녀를 찾아가, 결혼을 막아 주면 양 두 마리와 소 한 마리를 주겠다고 약속했어요. 그러자 나쁜 마녀는 제 도끼에 마법을 걸었어요. 새집과 아내를 빨리 얻고 싶어서 어느 날 제가 열심히 나무를 베고 있을 때, 도끼가 갑자기 미끄러지더니 제 왼쪽 다리를 잘라 버렸어요.`],
[`5-45`, `“처음엔 큰 불행인 것 같았어요. 다리가 하나뿐인 사람은 나무꾼 노릇을 잘할 수 없다는 걸 알았으니까요. 그래서 양철공을 찾아가 양철로 새 다리를 만들어 달라고 했어요. 익숙해지고 나니 그 다리는 아주 잘 움직였어요. 하지만 그 일은 동쪽의 나쁜 마녀를 화나게 했어요. 마녀는 제가 그 예쁜 먼치킨 처녀와 결혼하지 못하게 하겠다고 노파에게 약속했으니까요. 제가 다시 나무를 베기 시작하자 도끼가 미끄러져 이번에는 오른쪽 다리를 잘랐어요. 저는 또다시 양철공을 찾아갔고, 양철공은 또 양철로 다리를 만들어 주었어요. 그 뒤로 마법에 걸린 도끼는 제 두 팔을 하나씩 잘랐지만, 저는 조금도 굴하지 않고 양철 팔로 바꿔 달았어요. 그러자 나쁜 마녀는 도끼를 미끄러지게 해서 제 머리를 잘라 버렸고, 저는 처음에 이걸로 끝이구나 생각했어요. 하지만 마침 양철공이 지나가다가 양철로 새 머리를 만들어 주었지요.`],
[`5-46`, `“그때 저는 나쁜 마녀를 이겼다고 생각하고 더 열심히 일했어요. 하지만 제 적이 얼마나 잔인한지 미처 몰랐어요. 마녀는 아름다운 먼치킨 처녀를 향한 제 사랑을 없앨 새로운 방법을 생각해 냈어요. 다시 도끼를 미끄러지게 해서 제 몸통을 두 동강 내 버린 거예요. 이번에도 양철공이 도와주러 와서 양철로 몸통을 만들고, 양철 팔다리와 머리를 마디로 이어 붙여서 전처럼 잘 움직일 수 있게 해 주었어요. 하지만 아아! 이제 저에게는 심장이 없었어요. 그래서 먼치킨 처녀를 향한 사랑도 모두 잃어버렸고, 그녀와 결혼하든 말든 아무렇지도 않게 되었어요. 그녀는 아마 지금도 그 노파와 함께 살면서, 제가 데리러 오기를 기다리고 있을 거예요.`],
[`5-47`, `“제 몸은 햇빛을 받으면 어찌나 밝게 빛나는지 무척 자랑스러웠어요. 이제는 도끼가 미끄러져도 상관없었지요. 저를 벨 수 없었으니까요. 위험은 딱 하나, 마디가 녹스는 것뿐이었어요. 하지만 오두막에 기름통을 두고 필요할 때마다 꼭꼭 기름을 쳤어요. 그런데 어느 날 깜빡 잊고 기름을 치지 않았다가 폭풍우를 만났고, 위험하다는 생각이 들기도 전에 마디가 녹슬어 버렸어요. 그래서 두 분이 도와주러 올 때까지 숲속에 서 있어야 했던 거예요. 끔찍한 일이었어요. 하지만 그곳에 서 있던 일 년 동안 생각할 시간이 있었어요. 그리고 제가 겪은 가장 큰 손실은 심장을 잃은 것이었다는 걸 깨달았어요. 사랑에 빠져 있을 때 저는 세상에서 가장 행복한 사람이었어요. 하지만 심장이 없으면 아무도 사랑할 수 없어요. 그래서 오즈에게 심장을 달라고 부탁하기로 마음먹었어요. 심장을 얻으면 먼치킨 처녀에게 돌아가 그녀와 결혼할 거예요.”`],
[`5-48`, `도로시와 허수아비는 양철 나무꾼의 이야기에 무척 흥미를 느꼈고, 이제 그가 왜 그토록 새 심장을 갖고 싶어 하는지 알게 되었다.`],
[`5-49`, `“그래도 나는,” 허수아비가 말했다. “심장 대신 뇌를 달라고 할래요. 바보는 심장이 있어도 그걸로 뭘 해야 할지 모를 테니까요.”`],
[`5-50`, `“저는 심장을 달라고 할래요.” 양철 나무꾼이 대답했다. “뇌가 사람을 행복하게 해 주지는 않으니까요. 그리고 행복이야말로 세상에서 가장 좋은 거예요.”`],
[`5-51`, `도로시는 아무 말도 하지 않았다. 두 친구 가운데 누구 말이 옳은지 알 수 없었기 때문이다. 그리고 자기가 캔자스와 엠 아주머니에게 돌아갈 수만 있다면, 나무꾼에게 뇌가 없고 허수아비에게 심장이 없든, 둘 다 원하는 것을 얻든 그리 중요하지 않다고 생각했다.`],
[`5-52`, `도로시가 가장 걱정하는 것은 빵이 거의 떨어졌다는 것이었다. 자신과 토토가 한 끼만 더 먹으면 바구니가 텅 빌 터였다. 물론 나무꾼도 허수아비도 아무것도 먹지 않았지만, 도로시는 양철로도 짚으로도 만들어지지 않았으니 먹지 않고는 살 수 없었다.`],
  ]
};

/* 원문 책장: 원작 6~7장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch4 = {
  title: `겁쟁이 사자 · 위대한 오즈를 찾아가는 길`,
  orig: `원작 6~7장`,
  paras: [
[`h`, `원작 6장 「겁쟁이 사자」`],
[`6-1`, `그동안 도로시와 동료들은 빽빽한 숲속을 걷고 있었다. 길은 여전히 노란 벽돌로 깔려 있었지만, 나무에서 떨어진 마른 가지와 낙엽이 잔뜩 덮여 있어서 걷기가 전혀 좋지 않았다.`],
[`6-2`, `숲의 이쪽에는 새가 거의 없었다. 새들은 햇빛이 가득한 탁 트인 들판을 좋아하기 때문이다. 대신 이따금 나무 사이에 숨은 어떤 사나운 짐승이 낮게 으르렁거리는 소리가 들려왔다. 그 소리를 들을 때마다 어린 소녀의 가슴은 두근거렸다. 무엇이 그런 소리를 내는지 몰랐기 때문이다. 하지만 토토는 알았다. 그래서 토토는 도로시 곁에 바짝 붙어서 걸었고, 맞받아 짖지도 않았다.`],
[`6-3`, `“숲을 빠져나가려면 얼마나 더 가야 해요?” 아이가 양철 나무꾼에게 물었다.`],
[`6-4`, `“모르겠어요.” 나무꾼이 대답했다. “저는 에메랄드 시에 가 본 적이 없거든요. 하지만 제가 어렸을 때 아버지가 한 번 다녀오셨는데, 위험한 땅을 지나는 먼 여행이었다고 하셨어요. 그래도 오즈가 사는 도시에 가까워지면 땅이 아름다워진대요. 하지만 저는 기름통만 있으면 무섭지 않고, 허수아비는 아무것도 다치게 할 수 없어요. 그리고 아가씨는 이마에 착한 마녀의 입맞춤 자국이 있으니, 그게 아가씨를 해로운 것에서 지켜 줄 거예요.”`],
[`6-5`, `“하지만 토토는요!” 소녀가 걱정스럽게 말했다. “토토는 무엇이 지켜 줘요?”`],
[`6-6`, `“토토가 위험에 빠지면 우리가 직접 지켜야지요.” 양철 나무꾼이 대답했다.`],
[`6-7`, `그가 말하는 바로 그 순간, 숲에서 무시무시한 포효가 울려 퍼지더니 다음 순간 커다란 사자 한 마리가 길로 뛰어들었다. 사자는 앞발을 한 번 휘둘러 허수아비를 데굴데굴 길가로 굴려 버리고, 날카로운 발톱으로 양철 나무꾼을 내리쳤다. 그런데 사자가 놀랍게도, 나무꾼은 길에 쓰러져 가만히 누워 있었지만 양철에는 아무 자국도 나지 않았다.`],
[`6-8`, `이제 맞설 적이 생기자 꼬마 토토가 짖으며 사자에게 달려들었다. 거대한 짐승이 토토를 물려고 입을 쩍 벌린 순간, 토토가 죽을까 봐 겁이 난 도로시는 위험도 잊은 채 앞으로 뛰어나가 있는 힘껏 사자의 코를 찰싹 때리며 외쳤다.`],
[`6-9`, `“감히 토토를 물기만 해 봐! 부끄러운 줄 알아야지. 너처럼 덩치 큰 짐승이 불쌍한 작은 개를 물다니!”`],
[`6-10`, `“물지 않았어.” 사자가 도로시에게 맞은 코를 앞발로 문지르며 말했다.`],
[`6-11`, `“그래, 하지만 물려고 했잖아.” 도로시가 쏘아붙였다. “너는 그냥 덩치만 큰 겁쟁이야.”`],
[`6-12`, `“알아.” 사자가 부끄러워 고개를 푹 숙이며 말했다. “나도 늘 알고 있었어. 하지만 어쩔 수가 없는걸.”`],
[`6-13`, `“그건 나도 모르겠어. 불쌍한 허수아비처럼 속을 채운 사람을 때리다니!”`],
[`6-14`, `“저 친구는 속을 채운 거야?” 사자가 놀라서 물었다. 도로시가 허수아비를 일으켜 세우고 두드려 모양을 다시 잡아 주는 것을 지켜보면서였다.`],
[`6-15`, `“당연히 속을 채운 거지.” 아직 화가 덜 풀린 도로시가 대답했다.`],
[`6-16`, `“그래서 그렇게 쉽게 넘어갔구나.” 사자가 말했다. “그렇게 빙글빙글 도는 걸 보고 깜짝 놀랐어. 저 다른 친구도 속을 채운 거야?”`],
[`6-17`, `“아니.” 도로시가 말했다. “저 사람은 양철로 만들어졌어.” 그러고는 나무꾼을 다시 일으켜 주었다.`],
[`6-18`, `“그래서 내 발톱이 무뎌질 뻔했구나.” 사자가 말했다. “발톱이 양철을 긁을 때 등골이 오싹했어. 네가 그렇게 아끼는 그 작은 동물은 뭐야?”`],
[`6-19`, `“내 강아지 토토야.” 도로시가 대답했다.`],
[`6-20`, `“양철로 만든 거야, 속을 채운 거야?” 사자가 물었다.`],
[`6-21`, `“둘 다 아니야. 토토는… 그러니까… 살로 된 개야.” 소녀가 말했다.`],
[`6-22`, `“아! 신기한 동물이구나. 지금 보니 정말 작네. 이렇게 작은 걸 물 생각을 하는 건 나 같은 겁쟁이밖에 없을 거야.” 사자가 슬프게 말을 이었다.`],
[`6-23`, `“너는 왜 겁쟁이가 됐어?” 도로시가 물었다. 사자는 작은 말만큼이나 커서, 도로시는 그 커다란 짐승을 신기한 듯 바라보았다.`],
[`6-24`, `“그건 수수께끼야.” 사자가 대답했다. “아마 태어날 때부터 그랬나 봐. 숲속의 다른 동물들은 모두 당연히 내가 용감할 거라고 생각해. 어디서나 사자는 동물의 왕이라고 여기니까. 나는 아주 크게 울부짖기만 하면 살아 있는 건 모두 겁을 먹고 길을 비켜 준다는 걸 알게 됐어. 사람을 만날 때마다 나는 너무너무 무서웠어. 하지만 그냥 사람한테 울부짖기만 하면, 사람은 언제나 있는 힘껏 도망쳤지. 코끼리나 호랑이나 곰이 나랑 싸우려고 했다면 내가 먼저 도망쳤을 거야. 나는 그렇게 겁쟁이니까. 그런데 그 동물들은 내가 울부짖는 소리를 듣자마자 모두 나한테서 달아나려고 해. 그러면 물론 나는 그냥 가게 내버려 두지.”`],
[`6-25`, `“하지만 그건 옳지 않아요. 동물의 왕이 겁쟁이면 안 되지요.” 허수아비가 말했다.`],
[`6-26`, `“알아.” 사자가 꼬리 끝으로 눈물을 닦으며 대답했다. “그게 나의 가장 큰 슬픔이고, 그래서 사는 게 정말 불행해. 하지만 위험한 일이 생길 때마다 내 심장이 빠르게 뛰기 시작하는걸.”`],
[`6-27`, `“어쩌면 심장병이 있는지도 몰라요.” 양철 나무꾼이 말했다.`],
[`6-28`, `“그럴지도 몰라.” 사자가 말했다.`],
[`6-29`, `“만약 그렇다면,” 양철 나무꾼이 말을 이었다. “기뻐해야 해요. 심장이 있다는 증거니까요. 저는 심장이 없어서 심장병에도 걸릴 수가 없어요.”`],
[`6-30`, `“어쩌면,” 사자가 생각에 잠겨 말했다. “심장이 없다면 겁쟁이가 되지 않았을지도 몰라.”`],
[`6-31`, `“당신은 뇌가 있어요?” 허수아비가 물었다.`],
[`6-32`, `“그런 것 같아. 들여다본 적은 없지만.” 사자가 대답했다.`],
[`6-33`, `“나는 위대한 오즈에게 뇌를 좀 달라고 하러 가는 길이에요.” 허수아비가 말했다. “내 머리에는 짚이 들어 있거든요.”`],
[`6-34`, `“그리고 저는 심장을 달라고 할 거예요.” 나무꾼이 말했다.`],
[`6-35`, `“그리고 나는 토토랑 나를 캔자스로 돌려보내 달라고 할 거야.” 도로시가 덧붙였다.`],
[`6-36`, `“오즈가 나에게 용기를 줄 수 있을까?” 겁쟁이 사자가 물었다.`],
[`6-37`, `“나한테 뇌를 주는 것만큼 쉽게요.” 허수아비가 말했다.`],
[`6-38`, `“아니면 나에게 심장을 주는 것만큼요.” 양철 나무꾼이 말했다.`],
[`6-39`, `“아니면 나를 캔자스로 돌려보내는 것만큼.” 도로시가 말했다.`],
[`6-40`, `“그럼 괜찮다면 나도 같이 갈게.” 사자가 말했다. “용기가 조금도 없는 삶은 정말 견딜 수가 없거든.”`],
[`6-41`, `“정말 환영이야.” 도로시가 대답했다. “네가 다른 사나운 짐승들을 쫓아 줄 테니까. 네가 그렇게 쉽게 겁을 줄 수 있다면, 그 짐승들이 너보다 더 겁쟁이인 게 틀림없어.”`],
[`6-42`, `“정말 그래.” 사자가 말했다. “하지만 그렇다고 내가 조금이라도 더 용감해지는 건 아니야. 그리고 내가 겁쟁이라는 걸 알고 있는 한, 나는 불행할 거야.”`],
[`6-43`, `그래서 작은 일행은 다시 한번 길을 떠났다. 사자는 도로시 곁에서 위엄 있게 성큼성큼 걸었다. 토토는 처음에는 이 새 동료가 마음에 들지 않았다. 사자의 커다란 턱 사이에서 하마터면 짓이겨질 뻔했던 일을 잊을 수 없었기 때문이다. 하지만 시간이 좀 지나자 토토도 마음이 편해졌고, 얼마 뒤 토토와 겁쟁이 사자는 좋은 친구가 되었다.`],
[`6-44`, `그날 남은 시간 동안에는 여행의 평화를 깨뜨리는 다른 모험이 없었다. 딱 한 번, 양철 나무꾼이 길을 기어가던 딱정벌레를 밟아 그 불쌍한 작은 것을 죽이고 말았다. 이 일로 양철 나무꾼은 무척 슬퍼했다. 그는 살아 있는 것은 무엇이든 다치게 하지 않으려고 늘 조심했기 때문이다. 그래서 걸어가면서 슬픔과 후회의 눈물을 몇 방울 흘렸다. 그 눈물이 얼굴을 따라 천천히 흘러내려 턱의 경첩에 닿더니, 그곳을 녹슬게 해 버렸다. 잠시 뒤 도로시가 무언가를 물었을 때 양철 나무꾼은 입을 열 수가 없었다. 턱이 녹슬어 꽉 붙어 버렸기 때문이다. 그는 몹시 겁이 나서 도로시에게 도와 달라고 여러 번 몸짓을 했지만, 도로시는 무슨 뜻인지 알아듣지 못했다. 사자도 무엇이 잘못됐는지 몰라 어리둥절했다. 하지만 허수아비가 도로시의 바구니에서 기름통을 꺼내 나무꾼의 턱에 기름을 쳐 주었고, 몇 분 뒤 나무꾼은 전처럼 말할 수 있게 되었다.`],
[`6-45`, `“이 일로 좋은 교훈을 얻었어요.” 그가 말했다. “어디를 밟는지 잘 봐야겠어요. 벌레나 딱정벌레를 또 죽이면 틀림없이 또 울 텐데, 울면 턱이 녹슬어서 말을 못 하게 되니까요.”`],
[`6-46`, `그 뒤로 그는 길을 똑바로 내려다보며 아주 조심조심 걸었다. 그리고 아주 작은 개미 한 마리가 힘겹게 지나가는 것을 보면 다치지 않게 그 위로 넘어갔다. 양철 나무꾼은 자기에게 심장이 없다는 것을 잘 알고 있었다. 그래서 무엇에게든 결코 잔인하거나 매정하게 굴지 않으려고 무척 조심했다.`],
[`6-47`, `“심장이 있는 여러분은,” 그가 말했다. “이끌어 주는 것이 있으니 잘못을 저지를 일이 없겠지요. 하지만 저는 심장이 없으니 아주 조심해야 해요. 오즈가 저에게 심장을 주면 그때는 물론 이렇게까지 신경 쓰지 않아도 되겠지요.”`],
[`h`, `원작 7장 「위대한 오즈를 찾아가는 길」`],
[`7-1`, `근처에 집이 하나도 없어서 그날 밤 일행은 숲속 커다란 나무 아래에서 야영을 해야 했다. 나무가 두툼한 지붕이 되어 이슬을 막아 주었다. 양철 나무꾼은 도끼로 장작을 수북이 패 주었고, 도로시는 멋진 모닥불을 피웠다. 불은 도로시를 따뜻하게 해 주었고 외로움도 덜어 주었다. 도로시와 토토는 마지막 남은 빵을 먹었다. 이제 아침으로 무엇을 먹어야 할지 알 수 없었다.`],
[`7-2`, `“원한다면,” 사자가 말했다. “내가 숲에 가서 사슴을 잡아다 줄게. 너는 입맛이 별나서 익힌 음식을 좋아하니까 모닥불에 구우면 돼. 그러면 아주 훌륭한 아침밥이 될 거야.”`],
[`7-3`, `“안 돼요! 제발 그러지 마세요.” 양철 나무꾼이 애원했다. “불쌍한 사슴을 죽이면 저는 틀림없이 울 거예요. 그러면 턱이 또 녹슬어 버려요.”`],
[`7-4`, `하지만 사자는 숲으로 들어가 자기 저녁거리를 찾아 먹었다. 그게 무엇이었는지는 아무도 몰랐다. 사자가 말하지 않았기 때문이다. 그리고 허수아비는 견과가 가득 열린 나무를 찾아 도로시의 바구니를 견과로 채워 주었다. 그만하면 도로시가 오랫동안 배고프지 않을 터였다. 도로시는 허수아비가 무척 친절하고 사려 깊다고 생각했지만, 그 불쌍한 친구가 견과를 줍는 서툰 모습에는 배를 잡고 웃었다. 솜을 채운 손이 너무 서툴고 견과는 너무 작아서, 허수아비는 바구니에 넣는 만큼이나 많이 떨어뜨렸다. 하지만 허수아비는 바구니를 채우는 데 시간이 아무리 오래 걸려도 상관하지 않았다. 그러는 동안 모닥불에서 떨어져 있을 수 있었기 때문이다. 불똥이 짚에 튀어 몸이 다 타 버릴까 봐 무서웠던 것이다. 그래서 허수아비는 불길에서 멀찍이 떨어져 있다가, 도로시가 잠자리에 누웠을 때만 다가와서 마른 나뭇잎으로 덮어 주었다. 나뭇잎 덕분에 도로시는 무척 아늑하고 따뜻하게 아침까지 푹 잤다.`],
[`7-5`, `날이 밝자 소녀는 졸졸 흐르는 작은 시냇물에 세수를 했고, 곧 모두 에메랄드 시를 향해 출발했다.`],
[`7-6`, `이날은 여행자들에게 사건이 많은 날이 될 터였다. 한 시간도 채 걷지 않았을 때, 앞에 커다란 골짜기가 나타났다. 골짜기는 길을 가로지르며, 눈에 보이는 한 양쪽으로 끝없이 숲을 갈라놓고 있었다. 무척 넓은 골짜기였다. 가장자리로 기어가서 내려다보니 아주 깊기도 했고, 바닥에는 크고 뾰족뾰족한 바위가 잔뜩 있었다. 벽이 너무 가팔라서 아무도 내려갈 수 없었다. 한순간 여행이 여기서 끝나야 할 것만 같았다.`],
[`7-7`, `“어떡하지?” 도로시가 절망에 빠져 물었다.`],
[`7-8`, `“전혀 모르겠어요.” 양철 나무꾼이 말했다. 사자는 텁수룩한 갈기를 흔들며 생각에 잠긴 얼굴을 했다.`],
[`7-9`, `그런데 허수아비가 말했다. “우리가 날 수 없다는 건 확실해요. 이 커다란 골짜기를 기어 내려갈 수도 없고요. 그러니 뛰어넘지 못한다면 여기서 멈춰야 해요.”`],
[`7-10`, `“내가 뛰어넘을 수 있을 것 같아.” 겁쟁이 사자가 거리를 마음속으로 꼼꼼히 재 보더니 말했다.`],
[`7-11`, `“그럼 됐어요.” 허수아비가 대답했다. “사자가 우리를 하나씩 등에 태워 건너가면 되니까요.”`],
[`7-12`, `“그래, 한번 해 볼게.” 사자가 말했다. “누가 먼저 갈래?”`],
[`7-13`, `“내가 갈게요.” 허수아비가 나섰다. “만약 사자가 골짜기를 뛰어넘지 못하면, 도로시는 죽을 테고 양철 나무꾼은 아래 바위에 부딪혀 심하게 찌그러질 거예요. 하지만 내가 등에 타고 있으면 별문제 없어요. 떨어져도 나는 하나도 다치지 않으니까요.”`],
[`7-14`, `“나도 떨어지는 게 무지무지 무서워.” 겁쟁이 사자가 말했다. “하지만 해 보는 수밖에 없겠지. 그럼 내 등에 타. 한번 해 보자.”`],
[`7-15`, `허수아비가 사자의 등에 앉자, 커다란 짐승은 골짜기 가장자리로 걸어가 몸을 웅크렸다.`],
[`7-16`, `“왜 달려가서 뛰지 않아요?” 허수아비가 물었다.`],
[`7-17`, `“우리 사자들은 그런 식으로 하지 않거든.” 사자가 대답했다. 그러고는 힘차게 도약하더니 공중을 쏜살같이 날아 건너편에 무사히 내려섰다. 사자가 그렇게 쉽게 해내는 것을 보고 모두 무척 기뻐했다. 허수아비가 등에서 내리자 사자는 다시 골짜기를 뛰어 건너왔다.`],
[`7-18`, `다음은 도로시가 가기로 했다. 도로시는 토토를 품에 안고 사자의 등에 올라, 한 손으로 갈기를 꽉 붙잡았다. 다음 순간 공중을 나는 것만 같았고, 무슨 생각을 할 겨를도 없이 건너편에 무사히 도착해 있었다. 사자는 세 번째로 돌아가 양철 나무꾼을 데려왔다. 그런 다음 모두 잠시 앉아 사자가 쉴 틈을 주었다. 큰 도약을 거듭하느라 숨이 가빠진 사자는 너무 오래 달린 큰 개처럼 헐떡이고 있었다.`],
[`7-19`, `이쪽 숲은 무척 빽빽하고 어둡고 음침해 보였다. 사자가 쉬고 나자 일행은 노란 벽돌 길을 따라 걸으며, 저마다 속으로 과연 숲의 끝에 이르러 다시 밝은 햇살을 볼 수 있을지 말없이 생각했다. 게다가 곧 숲 깊은 곳에서 이상한 소리가 들려와 더욱 불안해졌다. 사자는 이 지역에 칼리다들이 산다고 속삭였다.`],
[`7-20`, `“칼리다가 뭐야?” 소녀가 물었다.`],
[`7-21`, `“몸은 곰 같고 머리는 호랑이 같은 괴물들이야.” 사자가 대답했다. “발톱이 어찌나 길고 날카로운지, 내가 토토를 해치는 것만큼이나 쉽게 나를 두 동강 낼 수 있어. 나는 칼리다가 무지무지 무서워.”`],
[`7-22`, `“무서워하는 것도 당연해.” 도로시가 대답했다. “정말 끔찍한 짐승들인가 봐.”`],
[`7-23`, `사자가 대답하려는 순간, 갑자기 길을 가로지르는 또 하나의 골짜기가 나타났다. 그런데 이번 골짜기는 어찌나 넓고 깊은지, 사자는 자기가 뛰어넘을 수 없다는 것을 단번에 알았다.`],
[`7-24`, `그래서 모두 앉아서 어떻게 해야 할지 궁리했다. 진지하게 생각한 끝에 허수아비가 말했다.`],
[`7-25`, `“여기 골짜기 바로 옆에 큰 나무가 있어요. 양철 나무꾼이 이 나무를 베어서 건너편으로 쓰러뜨리면, 우리는 그 위로 쉽게 걸어서 건널 수 있어요.”`],
[`7-26`, `“그거 최고의 생각이야.” 사자가 말했다. “네 머릿속에 짚이 아니라 뇌가 들어 있는 게 아닌가 싶을 정도야.”`],
[`7-27`, `나무꾼은 곧바로 일을 시작했다. 도끼가 어찌나 날카로운지 나무는 곧 거의 다 베어졌다. 그러자 사자가 튼튼한 앞다리를 나무에 대고 온 힘을 다해 밀었고, 큰 나무는 천천히 기울더니 쿵 하고 골짜기 위로 쓰러졌다. 윗가지가 건너편에 걸쳐졌다.`],
[`7-28`, `일행이 이 별난 다리를 막 건너기 시작했을 때, 날카롭게 으르렁거리는 소리에 모두 고개를 들었다. 그리고 몸은 곰 같고 머리는 호랑이 같은 커다란 짐승 두 마리가 자기들을 향해 달려오는 것을 보고 공포에 질렸다.`],
[`7-29`, `“칼리다야!” 겁쟁이 사자가 떨기 시작하며 말했다.`],
[`7-30`, `“어서요!” 허수아비가 외쳤다. “건너가요.”`],
[`7-31`, `그래서 도로시가 토토를 안고 먼저 건넜고, 양철 나무꾼이 뒤따랐고, 허수아비가 그다음이었다. 사자는 분명히 무서웠지만 칼리다들을 향해 돌아섰다. 그러고는 어찌나 크고 무시무시하게 울부짖었는지 도로시는 비명을 질렀고 허수아비는 뒤로 벌렁 넘어졌다. 사나운 짐승들조차 우뚝 멈춰 서서 놀란 눈으로 사자를 바라보았다.`],
[`7-32`, `하지만 칼리다들은 자기들이 사자보다 크다는 것을 알아차리고, 자기들은 둘이고 사자는 하나뿐이라는 것을 떠올리고는 다시 달려들었다. 사자는 나무를 건너간 다음 칼리다들이 어떻게 하는지 보려고 돌아섰다. 사나운 짐승들은 한순간도 멈추지 않고 나무를 건너오기 시작했다. 사자가 도로시에게 말했다.`],
[`7-33`, `“우리는 끝났어. 저것들이 날카로운 발톱으로 우리를 틀림없이 갈기갈기 찢어 놓을 거야. 하지만 내 뒤에 바짝 붙어 서. 내가 살아 있는 한 저것들과 싸울게.”`],
[`7-34`, `“잠깐만요!” 허수아비가 외쳤다. 그는 어떻게 하는 게 가장 좋을지 생각하고 있었는데, 이제 나무꾼에게 골짜기 이쪽에 걸쳐 있는 나무 끝을 베어 달라고 했다. 양철 나무꾼이 곧바로 도끼질을 시작했고, 칼리다 두 마리가 거의 다 건너왔을 무렵 나무가 쿵 하고 골짜기 속으로 떨어졌다. 으르렁거리던 흉측한 짐승들도 함께 떨어져 바닥의 뾰족한 바위 위로 곤두박질쳤다.`],
[`7-35`, `“휴.” 겁쟁이 사자가 길게 안도의 숨을 내쉬며 말했다. “조금 더 살 수 있게 됐구나. 정말 다행이야. 살아 있지 않다는 건 무척 불편한 일일 테니까. 저것들 때문에 어찌나 무서웠는지 아직도 심장이 두근거려.”`],
[`7-36`, `“아.” 양철 나무꾼이 슬프게 말했다. “나도 두근거릴 심장이 있으면 좋겠어요.”`],
[`7-37`, `이 모험을 겪고 나자 여행자들은 어느 때보다 숲을 빠져나가고 싶어졌다. 어찌나 빨리 걸었는지 도로시는 지쳐서 사자의 등에 타야 했다. 기쁘게도 앞으로 나아갈수록 나무가 점점 드문드문해졌고, 오후가 되자 갑자기 바로 앞에 빠르게 흐르는 넓은 강이 나타났다. 강 건너편으로는 노란 벽돌 길이 아름다운 땅을 가로지르고 있었다. 초록 풀밭에는 밝은 꽃들이 점점이 피어 있었고, 길가에는 맛있는 열매가 주렁주렁 달린 나무들이 늘어서 있었다. 눈앞에 펼쳐진 이 즐거운 땅을 보고 모두 무척 기뻐했다.`],
[`7-38`, `“강은 어떻게 건너지?” 도로시가 물었다.`],
[`7-39`, `“그건 쉬워요.” 허수아비가 대답했다. “양철 나무꾼이 뗏목을 만들면 우리는 그걸 타고 건너편으로 떠내려가면 돼요.”`],
[`7-40`, `그래서 나무꾼은 도끼를 들고 작은 나무들을 베어 뗏목을 만들기 시작했다. 나무꾼이 그 일에 매달려 있는 동안 허수아비는 강가에서 좋은 열매가 가득 열린 나무를 찾아냈다. 하루 종일 견과밖에 먹지 못한 도로시는 무척 기뻐하며 잘 익은 열매로 배불리 먹었다.`],
[`7-41`, `하지만 뗏목을 만드는 데는 시간이 걸린다. 양철 나무꾼처럼 부지런하고 지칠 줄 모르는 이라도 마찬가지다. 밤이 되었는데도 일은 끝나지 않았다. 그래서 일행은 나무 아래 아늑한 곳을 찾아 아침까지 푹 잤다. 도로시는 에메랄드 시와, 곧 자기를 집으로 돌려보내 줄 착한 마법사 오즈의 꿈을 꾸었다.`],
  ]
};

/* 원문 책장: 원작 8~9장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch5 = {
  title: `죽음의 양귀비 꽃밭 · 들쥐 여왕`,
  orig: `원작 8~9장`,
  paras: [
[`h`, `원작 8장 「죽음의 양귀비 꽃밭」`],
[`8-1`, `이튿날 아침, 우리의 작은 여행자 일행은 상쾌한 기분과 희망을 가득 안고 잠에서 깼다. 도로시는 강가 나무에 열린 복숭아와 자두로 공주처럼 아침을 먹었다. 뒤로는 여러 번 낙담하기도 했지만 무사히 빠져나온 어두운 숲이 있었고, 앞으로는 에메랄드 시로 어서 오라고 손짓하는 듯한 아름답고 햇살 가득한 땅이 있었다.`],
[`8-2`, `물론 지금은 넓은 강이 그 아름다운 땅과 일행을 갈라놓고 있었다. 하지만 뗏목은 거의 완성되어 있었다. 양철 나무꾼이 통나무 몇 개를 더 베어 나무못으로 단단히 묶자 떠날 준비가 끝났다. 도로시는 뗏목 한가운데에 앉아 토토를 품에 안았다. 겁쟁이 사자가 뗏목에 올라서자 뗏목이 심하게 기울었다. 사자가 크고 무거웠기 때문이다. 하지만 허수아비와 양철 나무꾼이 반대쪽 끝에 서서 균형을 잡았다. 두 사람은 긴 장대를 손에 들고 물속을 밀어 뗏목을 나아가게 했다.`],
[`8-3`, `처음에는 꽤 잘 나아갔다. 그런데 강 한가운데에 이르자 빠른 물살이 뗏목을 하류로 휩쓸어 가기 시작했고, 노란 벽돌 길에서 점점 더 멀어졌다. 게다가 물이 너무 깊어져서 긴 장대가 바닥에 닿지 않았다.`],
[`8-4`, `“큰일이에요.” 양철 나무꾼이 말했다. “뭍에 닿지 못하면 서쪽의 나쁜 마녀의 나라로 떠내려갈 거예요. 그러면 마녀가 우리에게 마법을 걸어 노예로 삼을 거예요.”`],
[`8-5`, `“그러면 나는 뇌를 얻지 못하겠지요.” 허수아비가 말했다.`],
[`8-6`, `“그러면 나는 용기를 얻지 못하겠지.” 겁쟁이 사자가 말했다.`],
[`8-7`, `“그러면 저는 심장을 얻지 못하겠지요.” 양철 나무꾼이 말했다.`],
[`8-8`, `“그러면 나는 캔자스로 영영 돌아가지 못하겠지.” 도로시가 말했다.`],
[`8-9`, `“어떻게든 에메랄드 시에 꼭 가야 해요.” 허수아비가 말을 이으며 긴 장대를 어찌나 세게 밀었는지, 장대가 강바닥 진흙에 단단히 박혀 버렸다. 그리고 허수아비가 장대를 다시 뽑거나 손을 놓기도 전에 뗏목이 휩쓸려 가 버렸다. 불쌍한 허수아비는 강 한가운데에서 장대에 매달린 채 남겨졌다.`],
[`8-10`, `“잘 가요!” 허수아비가 뒤에서 외쳤다. 일행은 허수아비를 두고 가는 것이 무척 슬펐다. 양철 나무꾼은 울음을 터뜨렸다가, 다행히 녹슬 수도 있다는 것을 떠올리고 도로시의 앞치마에 눈물을 닦았다.`],
[`8-11`, `물론 허수아비에게는 큰일이었다.`],
[`8-12`, `‘처음 도로시를 만났을 때보다 더 나빠졌어.’ 허수아비는 생각했다. ‘그때는 옥수수밭에서 장대에 꽂혀 있었지만, 어쨌든 까마귀를 쫓는 척이라도 할 수 있었어. 하지만 강 한가운데 장대에 매달린 허수아비는 아무 쓸모가 없잖아. 결국 나는 영영 뇌를 얻지 못할 것 같아!’`],
[`8-13`, `뗏목은 물살을 따라 떠내려갔고, 불쌍한 허수아비는 저 멀리 뒤에 남겨졌다. 그때 사자가 말했다.`],
[`8-14`, `“우리를 구할 무슨 수를 내야 해. 너희가 내 꼬리 끝만 꽉 잡고 있으면, 내가 기슭까지 헤엄쳐 가서 뗏목을 끌고 갈 수 있을 것 같아.”`],
[`8-15`, `그래서 사자는 물속으로 뛰어들었고, 양철 나무꾼이 사자의 꼬리를 꽉 붙잡았다. 사자는 있는 힘을 다해 기슭을 향해 헤엄치기 시작했다. 덩치가 그렇게 큰데도 힘든 일이었다. 하지만 마침내 뗏목이 물살에서 벗어났고, 도로시는 양철 나무꾼의 긴 장대를 받아 들고 뗏목을 뭍으로 미는 것을 도왔다.`],
[`8-16`, `마침내 기슭에 닿아 예쁜 초록 풀밭에 발을 디뎠을 때 모두 녹초가 되어 있었다. 그리고 강물에 실려 에메랄드 시로 가는 노란 벽돌 길을 한참이나 지나쳐 왔다는 것도 알게 되었다.`],
[`8-17`, `“이제 어떡하지요?” 양철 나무꾼이 물었다. 사자는 햇볕에 몸을 말리려고 풀밭에 누워 있었다.`],
[`8-18`, `“어떻게든 길로 돌아가야 해.” 도로시가 말했다.`],
[`8-19`, `“강기슭을 따라 걸어서 다시 길이 나올 때까지 가는 게 제일 좋겠어.” 사자가 말했다.`],
[`8-20`, `그래서 일행은 쉬고 나서 도로시가 바구니를 집어 들자, 강물이 자기들을 휩쓸어 오기 전의 그 길을 향해 풀이 우거진 강둑을 따라 걷기 시작했다. 꽃과 과일나무가 가득하고 햇살이 마음을 북돋아 주는 아름다운 땅이었다. 불쌍한 허수아비 때문에 그토록 마음 아프지 않았다면 무척 행복했을 것이다.`],
[`8-21`, `일행은 최대한 빨리 걸었다. 도로시는 딱 한 번 아름다운 꽃 한 송이를 꺾으려고 멈췄을 뿐이었다. 얼마쯤 지나자 양철 나무꾼이 외쳤다. “저기 봐요!”`],
[`8-22`, `모두 강을 바라보았다. 허수아비가 물 한가운데 장대 위에 매달려 무척 외롭고 슬픈 모습으로 있었다.`],
[`8-23`, `“어떻게 하면 허수아비를 구할 수 있을까?” 도로시가 물었다.`],
[`8-24`, `사자와 나무꾼은 둘 다 고개를 저었다. 방법을 몰랐기 때문이다. 그래서 모두 강둑에 앉아 안타깝게 허수아비를 바라보고만 있었다. 그때 황새 한 마리가 날아가다가 일행을 보고 물가에 내려앉아 쉬었다.`],
[`8-25`, `“너희는 누구니? 어디로 가는 길이야?” 황새가 물었다.`],
[`8-26`, `“저는 도로시예요.” 소녀가 대답했다. “그리고 이쪽은 제 친구들인 양철 나무꾼과 겁쟁이 사자예요. 우리는 에메랄드 시로 가는 길이에요.”`],
[`8-27`, `“여기는 그 길이 아닌데.” 황새가 긴 목을 비틀며 별난 일행을 날카롭게 쳐다보았다.`],
[`8-28`, `“알아요.” 도로시가 대답했다. “그런데 허수아비를 잃어버려서, 어떻게 하면 다시 데려올 수 있을까 고민하고 있어요.”`],
[`8-29`, `“그 친구가 어디 있는데?” 황새가 물었다.`],
[`8-30`, `“저기 강 한가운데요.” 어린 소녀가 대답했다.`],
[`8-31`, `“그 친구가 그렇게 크고 무겁지만 않다면 내가 데려다줄 텐데.” 황새가 말했다.`],
[`8-32`, `“전혀 무겁지 않아요.” 도로시가 신이 나서 말했다. “속이 짚으로 채워져 있거든요. 허수아비를 데려다주시면 정말정말 고마울 거예요.”`],
[`8-33`, `“그럼 한번 해 볼게.” 황새가 말했다. “하지만 너무 무거워서 못 들겠으면 다시 강에 떨어뜨릴 수밖에 없어.”`],
[`8-34`, `그래서 큰 새는 하늘로 날아올라 물 위를 지나 허수아비가 장대에 매달려 있는 곳까지 갔다. 그러고는 커다란 발톱으로 허수아비의 팔을 움켜쥐고 공중으로 들어 올려, 도로시와 사자와 양철 나무꾼과 토토가 앉아 있는 강둑으로 데려왔다.`],
[`8-35`, `다시 친구들 사이에 있게 된 허수아비는 너무 기뻐서 모두를 끌어안았다. 사자와 토토까지도 말이다. 그리고 함께 걸어가면서 한 걸음 내디딜 때마다 “랄랄라 룰루랄라!” 노래를 불렀다. 그만큼 신이 났던 것이다.`],
[`8-36`, `“영영 강에 있어야 하는 줄 알고 무서웠어요.” 허수아비가 말했다. “하지만 친절한 황새가 나를 구해 줬어요. 언젠가 뇌를 얻으면 황새를 다시 찾아가서 은혜를 갚을 거예요.”`],
[`8-37`, `“괜찮아.” 그들 곁에서 날고 있던 황새가 말했다. “나는 곤경에 빠진 이를 돕는 게 언제나 좋거든. 하지만 이제 가 봐야 해. 둥지에서 아기들이 기다리고 있거든. 에메랄드 시를 찾아서 오즈에게 도움을 받길 바랄게.”`],
[`8-38`, `“고마워요.” 도로시가 대답했다. 친절한 황새는 하늘로 날아올라 곧 보이지 않게 되었다.`],
[`8-39`, `일행은 알록달록한 새들의 노랫소리를 들으며, 아름다운 꽃들을 구경하며 걸었다. 꽃은 점점 빽빽해져서 땅이 꽃으로 융단을 깐 듯했다. 노랗고 하얗고 파랗고 보랏빛인 커다란 꽃들이 있었고, 그 밖에도 진홍빛 양귀비가 크게 무리 지어 피어 있었다. 양귀비는 빛깔이 어찌나 선명한지 도로시의 눈이 부실 지경이었다.`],
[`8-40`, `“정말 아름답지 않아요?” 소녀가 밝은 꽃들의 알싸한 향기를 들이마시며 물었다.`],
[`8-41`, `“그런 것 같네요.” 허수아비가 대답했다. “뇌가 생기면 아마 더 좋아하게 되겠지요.”`],
[`8-42`, `“심장만 있다면 저는 저 꽃들을 사랑할 거예요.” 양철 나무꾼이 덧붙였다.`],
[`8-43`, `“나는 늘 꽃을 좋아했어.” 사자가 말했다. “꽃은 너무 연약하고 여려 보이거든. 하지만 숲에는 이렇게 밝은 꽃이 없어.”`],
[`8-44`, `이제 커다란 진홍빛 양귀비가 점점 많아지고 다른 꽃들은 점점 줄어들더니, 곧 일행은 드넓은 양귀비 꽃밭 한가운데에 서 있었다. 그런데 이 꽃이 많이 모여 있으면 그 향기가 어찌나 강한지, 그 냄새를 맡는 이는 누구든 잠이 들어 버린다는 사실은 잘 알려져 있다. 그리고 잠든 이를 꽃향기가 닿지 않는 곳으로 옮기지 않으면, 그는 영원히 잠들고 만다. 하지만 도로시는 그것을 몰랐다. 게다가 사방에 피어 있는 새빨간 꽃들에게서 벗어날 수도 없었다. 그래서 곧 눈꺼풀이 무거워지더니, 앉아서 쉬며 잠을 자야만 할 것 같았다.`],
[`8-45`, `하지만 양철 나무꾼은 도로시가 그렇게 하도록 내버려 두지 않았다.`],
[`8-46`, `“어두워지기 전에 서둘러 노란 벽돌 길로 돌아가야 해요.” 그가 말했고, 허수아비도 그 말에 동의했다. 그래서 도로시는 더는 서 있을 수 없을 때까지 계속 걸었다. 하지만 자기도 모르게 눈이 감겼고, 어디에 있는지도 잊은 채 양귀비 사이로 쓰러져 깊이 잠들고 말았다.`],
[`8-47`, `“어떡하지요?” 양철 나무꾼이 물었다.`],
[`8-48`, `“여기 두고 가면 도로시는 죽을 거야.” 사자가 말했다. “꽃향기가 우리 모두를 죽이고 있어. 나도 눈을 뜨고 있기가 힘들고, 개는 벌써 잠들었어.”`],
[`8-49`, `정말이었다. 토토는 어린 주인 곁에 쓰러져 있었다. 하지만 살로 만들어지지 않은 허수아비와 양철 나무꾼은 꽃향기에 아무렇지도 않았다.`],
[`8-50`, `“빨리 달려요.” 허수아비가 사자에게 말했다. “최대한 빨리 이 죽음의 꽃밭에서 빠져나가요. 도로시는 우리가 데리고 갈게요. 하지만 사자가 잠들면 너무 커서 옮길 수가 없어요.”`],
[`8-51`, `그래서 사자는 정신을 차리고 있는 힘껏 앞으로 뛰어갔다. 순식간에 사자는 보이지 않게 되었다.`],
[`8-52`, `“우리 손으로 의자를 만들어서 도로시를 옮겨요.” 허수아비가 말했다. 그래서 둘은 토토를 들어 도로시의 무릎에 올려놓고, 손을 엮어 앉는 자리를 만들고 팔로 팔걸이를 만들어, 잠든 소녀를 둘 사이에 앉힌 채 꽃밭을 지나갔다.`],
[`8-53`, `둘은 걷고 또 걸었다. 자기들을 둘러싼 죽음의 꽃 융단은 영영 끝나지 않을 것만 같았다. 강이 굽은 대로 따라가다 보니, 마침내 양귀비 사이에서 깊이 잠들어 있는 친구 사자를 발견했다. 꽃의 힘은 그 거대한 짐승에게도 너무 강했다. 사자는 끝내 버티지 못하고, 양귀비 꽃밭이 끝나기 바로 몇 걸음 앞에서 쓰러져 있었다. 그 앞으로는 향긋한 풀이 아름다운 초록 들판을 이루며 펼쳐져 있었다.`],
[`8-54`, `“사자를 위해 우리가 할 수 있는 일은 없어요.” 양철 나무꾼이 슬프게 말했다. “너무 무거워서 들 수가 없으니까요. 여기 두고 가서 영원히 잠들게 할 수밖에 없어요. 어쩌면 마침내 용기를 찾은 꿈을 꿀지도 모르지요.”`],
[`8-55`, `“안타깝네요.” 허수아비가 말했다. “사자는 그렇게 겁이 많은 것치고는 아주 좋은 동료였는데. 하지만 우리는 계속 가요.”`],
[`8-56`, `둘은 잠든 소녀를 강가의 예쁜 곳으로 옮겼다. 꽃의 독을 더 들이마시지 않을 만큼 양귀비 꽃밭에서 충분히 떨어진 곳이었다. 그리고 그곳 부드러운 풀밭에 도로시를 살며시 눕히고, 상쾌한 바람이 도로시를 깨워 주기를 기다렸다.`],
[`h`, `원작 9장 「들쥐 여왕」`],
[`9-1`, `“이제 노란 벽돌 길에서 그리 멀지 않을 거예요.” 소녀 곁에 서 있던 허수아비가 말했다. “강물이 우리를 휩쓸어 간 만큼 거의 다 되돌아왔으니까요.”`],
[`9-2`, `양철 나무꾼이 대답하려는 순간 낮게 으르렁거리는 소리가 들렸다. 나무꾼이 고개를 돌리자(경첩 덕분에 머리가 아주 잘 돌아갔다) 이상한 짐승 한 마리가 풀밭을 가로질러 펄쩍펄쩍 뛰어오는 것이 보였다. 그것은 커다란 노란 살쾡이였다. 나무꾼은 그 짐승이 무언가를 쫓고 있는 게 틀림없다고 생각했다. 귀를 머리에 바짝 붙이고, 입을 쩍 벌려 흉측한 이빨 두 줄을 드러내고, 빨간 눈은 불덩이처럼 이글거리고 있었기 때문이다. 짐승이 가까이 오자 양철 나무꾼은 그 앞에서 작은 회색 들쥐 한 마리가 달아나고 있는 것을 보았다. 나무꾼은 심장이 없었지만, 살쾡이가 그토록 예쁘고 해롭지 않은 생명을 죽이려 하는 것은 잘못이라는 것을 알았다.`],
[`9-3`, `그래서 나무꾼은 도끼를 들어, 살쾡이가 옆으로 달려 지나가는 순간 재빨리 내리쳤다. 짐승은 단번에 쓰러져 그의 발치로 굴렀다.`],
[`9-4`, `적에게서 풀려난 들쥐는 우뚝 멈춰 서더니, 나무꾼에게 천천히 다가와 작고 찍찍거리는 목소리로 말했다.`],
[`9-5`, `“아, 고마워요! 제 목숨을 구해 주셔서 정말정말 고마워요.”`],
[`9-6`, `“그런 말씀 마세요.” 나무꾼이 대답했다. “알다시피 저는 심장이 없어서, 친구가 필요할지 모르는 이는 누구든 도우려고 조심하거든요. 그게 생쥐 한 마리라도요.”`],
[`9-7`, `“생쥐 한 마리라니요!” 작은 동물이 화가 나서 외쳤다. “나는 여왕이에요. 모든 들쥐의 여왕이라고요!”`],
[`9-8`, `“아, 그렇군요.” 나무꾼이 허리 숙여 인사하며 말했다.`],
[`9-9`, `“그러니 당신은 내 목숨을 구함으로써 용감한 일일 뿐 아니라 위대한 일을 한 거예요.” 여왕이 덧붙였다.`],
[`9-10`, `그때 생쥐 여러 마리가 작은 다리로 있는 힘껏 달려오는 것이 보였다. 생쥐들은 여왕을 보자 소리쳤다.`],
[`9-11`, `“아, 여왕 폐하, 돌아가시는 줄 알았어요! 그 커다란 살쾡이에게서 어떻게 빠져나오셨어요?” 생쥐들이 작은 여왕에게 어찌나 깊이 고개를 숙였는지 거의 물구나무를 설 지경이었다.`],
[`9-12`, `“이 우스꽝스러운 양철 사람이,” 여왕이 대답했다. “살쾡이를 물리치고 내 목숨을 구해 주었어요. 그러니 앞으로 너희 모두는 이분을 섬기고, 아무리 작은 바람이라도 따라야 해요.”`],
[`9-13`, `“그러겠습니다!” 생쥐들이 모두 한목소리로 날카롭게 외쳤다. 그러고는 사방으로 흩어져 달아났다. 잠에서 깬 토토가 주위에 생쥐들이 가득한 것을 보고 신이 나서 한 번 짖더니 무리 한가운데로 뛰어들었기 때문이다. 토토는 캔자스에 살 때부터 생쥐 쫓기를 무척 좋아했고, 그게 나쁜 일이라고 생각하지 않았다.`],
[`9-14`, `하지만 양철 나무꾼이 토토를 품에 안고 꽉 붙잡으며 생쥐들에게 소리쳤다. “돌아와요! 돌아와요! 토토가 당신들을 해치지 않게 할게요.”`],
[`9-15`, `그러자 들쥐 여왕이 풀숲 밑에서 고개를 내밀고 겁먹은 목소리로 물었다. “정말 저 개가 우리를 물지 않을까요?”`],
[`9-16`, `“제가 그러지 못하게 할게요.” 나무꾼이 말했다. “그러니 무서워하지 마세요.”`],
[`9-17`, `생쥐들은 하나씩 살금살금 돌아왔다. 토토는 다시 짖지 않았다. 나무꾼의 품에서 빠져나가려고 버둥거렸고, 나무꾼이 양철로 만들어졌다는 걸 잘 알지 못했다면 물기라도 했을 것이다. 마침내 가장 큰 생쥐 하나가 입을 열었다.`],
[`9-18`, `“우리 여왕님의 목숨을 구해 주신 은혜를 갚으려면,” 그가 물었다. “무엇을 해 드리면 될까요?”`],
[`9-19`, `“딱히 생각나는 건 없어요.” 나무꾼이 대답했다. 그런데 머리에 짚이 들어 있어서 생각하려고 애써도 잘 안 되던 허수아비가 재빨리 말했다. “아, 있어요! 양귀비 꽃밭에서 잠든 우리 친구 겁쟁이 사자를 구해 줄 수 있어요.”`],
[`9-20`, `“사자라니!” 작은 여왕이 외쳤다. “그러면 우리를 다 잡아먹을 거예요.”`],
[`9-21`, `“아니요.” 허수아비가 단언했다. “이 사자는 겁쟁이예요.”`],
[`9-22`, `“정말이요?” 생쥐가 물었다.`],
[`9-23`, `“자기 입으로 그렇게 말해요.” 허수아비가 대답했다. “그리고 우리 친구라면 절대로 해치지 않을 거예요. 사자를 구하는 걸 도와준다면, 사자가 여러분 모두에게 친절하게 대하겠다고 약속할게요.”`],
[`9-24`, `“좋아요.” 여왕이 말했다. “당신을 믿을게요. 그런데 우리가 무엇을 하면 되지요?”`],
[`9-25`, `“여왕님이라고 부르며 따르는 생쥐들이 많이 있나요?”`],
[`9-26`, `“아, 그럼요. 수천 마리가 있지요.” 여왕이 대답했다.`],
[`9-27`, `“그럼 모두 최대한 빨리 이리로 오라고 하세요. 그리고 저마다 기다란 끈을 하나씩 가져오라고 하세요.”`],
[`9-28`, `여왕은 시중드는 생쥐들을 돌아보며 당장 가서 백성들을 모두 데려오라고 말했다. 명령을 듣자마자 생쥐들은 사방으로 있는 힘껏 달려갔다.`],
[`9-29`, `“자,” 허수아비가 양철 나무꾼에게 말했다. “강가의 저 나무들로 가서 사자를 실을 수레를 만들어요.”`],
[`9-30`, `그래서 나무꾼은 곧장 나무 쪽으로 가서 일을 시작했다. 그는 굵은 나뭇가지에서 잎과 잔가지를 모두 쳐 내고 곧 수레를 만들었다. 나무못으로 단단히 짜 맞추고, 큰 나무 둥치를 짧게 잘라 바퀴 네 개를 만들었다. 어찌나 빠르고 솜씨 좋게 일했는지, 생쥐들이 도착하기 시작할 무렵에는 수레가 다 준비되어 있었다.`],
[`9-31`, `생쥐들은 사방에서 몰려왔다. 수천 마리나 되었다. 큰 생쥐, 작은 생쥐, 중간 크기 생쥐가 저마다 입에 끈을 하나씩 물고 왔다. 바로 그 무렵 도로시가 긴 잠에서 깨어 눈을 떴다. 도로시는 자기가 풀밭에 누워 있고, 수천 마리 생쥐들이 주위에 서서 수줍게 자기를 바라보고 있는 것을 보고 무척 놀랐다. 하지만 허수아비가 모든 일을 이야기해 주었다. 그러고는 위엄 있는 작은 생쥐를 돌아보며 말했다.`],
[`9-32`, `“여왕 폐하를 소개해 드리지요.”`],
[`9-33`, `도로시는 정중하게 고개를 끄덕였고, 여왕은 무릎을 굽혀 인사했다. 그 뒤로 여왕은 어린 소녀와 무척 친해졌다.`],
[`9-34`, `이제 허수아비와 나무꾼은 생쥐들이 가져온 끈으로 생쥐들을 수레에 매기 시작했다. 끈 한쪽 끝은 생쥐마다 목에 두르고, 다른 쪽 끝은 수레에 묶었다. 물론 수레는 그것을 끌 생쥐 한 마리보다 천 배는 컸다. 하지만 생쥐들을 모두 매고 나자 꽤 쉽게 끌 수 있었다. 허수아비와 양철 나무꾼까지 수레에 올라탈 수 있었고, 별난 작은 말들은 둘을 태우고 사자가 잠들어 있는 곳까지 재빨리 달려갔다.`],
[`9-35`, `사자가 무거워서 무척 애를 쓴 끝에야 사자를 수레 위에 올릴 수 있었다. 그러자 여왕은 서둘러 백성들에게 출발하라고 명령했다. 생쥐들이 양귀비 사이에 너무 오래 있으면 그들도 잠들어 버릴까 봐 걱정되었던 것이다.`],
[`9-36`, `처음에는 작은 생쥐들이 아무리 많아도 무거운 짐을 실은 수레를 거의 움직이지 못했다. 하지만 나무꾼과 허수아비가 뒤에서 밀자 훨씬 잘 나아갔다. 곧 그들은 사자를 양귀비 꽃밭에서 초록 들판으로 굴려 냈다. 이제 사자는 독한 꽃향기 대신 달콤하고 신선한 공기를 다시 마실 수 있었다.`],
[`9-37`, `도로시는 마중을 나와서, 친구를 죽음에서 구해 준 작은 생쥐들에게 진심으로 고맙다고 했다. 커다란 사자가 무척 좋아진 도로시는 사자가 구조되어 정말 기뻤다.`],
[`9-38`, `그런 다음 생쥐들은 수레에서 풀려나 풀숲을 지나 집으로 쪼르르 달려갔다. 들쥐 여왕이 맨 마지막으로 떠났다.`],
[`9-39`, `“다시 우리가 필요하면,” 여왕이 말했다. “들판에 나와서 불러요. 그러면 우리가 듣고 도우러 올 거예요. 안녕히!”`],
[`9-40`, `“안녕히 가세요!” 모두 대답했다. 여왕이 달려가는 동안, 도로시는 토토가 쫓아가서 여왕을 놀라게 하지 않도록 꼭 붙잡고 있었다.`],
[`9-41`, `그런 다음 일행은 사자가 깨어날 때까지 그 곁에 앉아 있었다. 허수아비는 근처 나무에서 열매를 따다 도로시에게 주었고, 도로시는 그것으로 점심을 먹었다.`],
  ]
};

/* 원문 책장: 원작 10~11장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch6 = {
  title: `에메랄드 시의 문지기 · 놀라운 에메랄드 시`,
  orig: `원작 10~11장`,
  paras: [
[`h`, `원작 10장 「성문 문지기」`],
[`10-1`, `겁쟁이 사자가 깨어나기까지는 한참이 걸렸다. 양귀비 사이에 오래 누워 그 독한 향기를 들이마셨기 때문이다. 하지만 마침내 눈을 뜨고 수레에서 굴러 내려왔을 때, 사자는 자기가 아직 살아 있다는 것을 알고 무척 기뻐했다.`],
[`10-2`, `“있는 힘껏 달렸는데,” 사자가 앉아서 하품을 하며 말했다. “꽃이 나한테는 너무 셌어. 나를 어떻게 꺼냈어?”`],
[`10-3`, `그러자 일행은 들쥐들이 얼마나 너그럽게 사자를 죽음에서 구해 주었는지 이야기해 주었다. 겁쟁이 사자는 웃으며 말했다.`],
[`10-4`, `“나는 늘 내가 아주 크고 무시무시하다고 생각했어. 그런데 꽃처럼 작은 것이 나를 죽일 뻔했고, 생쥐처럼 작은 동물들이 내 목숨을 구했구나. 정말 이상한 일이야! 그런데 친구들, 이제 어떡하지?”`],
[`10-5`, `“노란 벽돌 길을 다시 찾을 때까지 계속 가야 해.” 도로시가 말했다. “그러면 에메랄드 시까지 계속 갈 수 있어.”`],
[`10-6`, `그래서 기운을 완전히 되찾고 원래 모습으로 돌아온 사자와 함께, 모두 다시 길을 떠났다. 부드럽고 싱그러운 풀밭을 걷는 것은 무척 즐거웠다. 얼마 지나지 않아 일행은 노란 벽돌 길에 다다랐고, 다시 위대한 오즈가 사는 에메랄드 시를 향해 돌아섰다.`],
[`10-7`, `이제 길은 매끄럽고 잘 닦여 있었고, 주위의 땅은 아름다웠다. 여행자들은 숲과, 그 어두운 그늘 속에서 마주쳤던 수많은 위험을 멀리 뒤로하게 되어 기뻤다. 다시 길가에 울타리가 보였는데, 이번에는 초록색으로 칠해져 있었다. 농부가 사는 것이 분명한 작은 집에 이르렀을 때 보니 그 집도 초록색으로 칠해져 있었다. 오후 동안 그런 집을 여러 채 지나쳤다. 이따금 사람들이 문간에 나와 무언가 묻고 싶은 듯 일행을 바라보았지만, 아무도 가까이 오거나 말을 걸지 않았다. 커다란 사자가 무척 무서웠기 때문이다. 사람들은 모두 아름다운 에메랄드빛 초록 옷을 입고, 먼치킨들처럼 뾰족한 모자를 쓰고 있었다.`],
[`10-8`, `“여기가 오즈의 나라인가 봐.” 도로시가 말했다. “틀림없이 에메랄드 시에 가까워지고 있어.”`],
[`10-9`, `“그래요.” 허수아비가 대답했다. “먼치킨 나라에서는 파란색을 좋아했는데, 여기서는 모든 게 초록색이에요. 그런데 사람들이 먼치킨들만큼 친절해 보이지 않네요. 밤을 지낼 곳을 찾지 못할까 봐 걱정이에요.”`],
[`10-10`, `“나는 과일 말고 다른 것도 좀 먹고 싶어.” 소녀가 말했다. “토토도 틀림없이 배가 고파 죽을 지경일 거야. 다음 집에 들러서 사람들에게 이야기해 보자.”`],
[`10-11`, `그래서 꽤 큰 농가에 이르자, 도로시는 씩씩하게 문으로 걸어가 노크했다.`],
[`10-12`, `한 여자가 밖을 내다볼 만큼만 문을 열고 말했다. “무슨 일이니, 얘야? 그리고 저 커다란 사자는 왜 너랑 같이 있니?”`],
[`10-13`, `“허락해 주신다면 하룻밤 묵어 가고 싶어요.” 도로시가 대답했다. “그리고 사자는 제 친구이자 동료예요. 절대로 아주머니를 해치지 않을 거예요.”`],
[`10-14`, `“길들여진 사자니?” 여자가 문을 조금 더 열며 물었다.`],
[`10-15`, `“네, 그럼요.” 소녀가 말했다. “게다가 엄청난 겁쟁이예요. 아주머니가 사자를 무서워하는 것보다 사자가 아주머니를 더 무서워할걸요.”`],
[`10-16`, `“그렇다면,” 여자가 곰곰이 생각하며 사자를 한 번 더 엿보고는 말했다. “들어와도 좋아. 저녁도 주고 잘 곳도 내주마.”`],
[`10-17`, `그래서 모두 집 안으로 들어갔다. 집에는 여자 말고도 아이 둘과 남자 한 사람이 있었다. 남자는 다리를 다쳐 구석의 긴 의자에 누워 있었다. 식구들은 이렇게 별난 일행을 보고 무척 놀란 것 같았다. 여자가 식탁을 차리느라 바쁜 동안 남자가 물었다.`],
[`10-18`, `“모두 어디로 가는 길이니?”`],
[`10-19`, `“에메랄드 시요.” 도로시가 말했다. “위대한 오즈님을 만나러요.”`],
[`10-20`, `“아, 그래!” 남자가 소리쳤다. “오즈가 너희를 만나 줄 거라고 확신하니?”`],
[`10-21`, `“왜 안 만나 주세요?” 도로시가 되물었다.`],
[`10-22`, `“오즈는 아무도 자기 앞에 들이지 않는다고들 하거든. 나는 에메랄드 시에 여러 번 가 봤어. 아름답고 놀라운 곳이지. 하지만 위대한 오즈를 만나도록 허락받은 적은 한 번도 없어. 오즈를 본 사람을 하나도 알지 못하고.”`],
[`10-23`, `“오즈는 밖에 나오지도 않아요?” 허수아비가 물었다.`],
[`10-24`, `“절대로. 오즈는 날마다 궁전의 커다란 알현실에 앉아 있고, 시중드는 사람들조차 얼굴을 마주 보지 못해.”`],
[`10-25`, `“어떻게 생겼어요?” 소녀가 물었다.`],
[`10-26`, `“그건 말하기 어려워.” 남자가 생각에 잠겨 말했다. “알다시피 오즈는 위대한 마법사라서 원하는 모습은 무엇이든 될 수 있어. 그래서 어떤 사람들은 새처럼 생겼다고 하고, 어떤 사람들은 코끼리처럼 생겼다고 하고, 어떤 사람들은 고양이처럼 생겼다고 해. 또 다른 사람들에게는 아름다운 요정이나 꼬마 요정, 또는 마음에 드는 무슨 모습으로든 나타난대. 하지만 진짜 오즈가 제 모습일 때 어떻게 생겼는지는 살아 있는 누구도 말할 수 없어.”`],
[`10-27`, `“정말 이상하네요.” 도로시가 말했다. “하지만 어떻게든 만나 봐야 해요. 안 그러면 여기까지 온 게 헛수고가 될 테니까요.”`],
[`10-28`, `“그 무시무시한 오즈를 왜 만나려고 하니?” 남자가 물었다.`],
[`10-29`, `“나는 오즈에게 뇌를 좀 달라고 할 거예요.” 허수아비가 들떠서 말했다.`],
[`10-30`, `“아, 오즈라면 그건 쉽게 해 줄 수 있지.” 남자가 단언했다. “오즈는 필요한 것보다 뇌가 더 많거든.”`],
[`10-31`, `“그리고 저는 심장을 달라고 할 거예요.” 양철 나무꾼이 말했다.`],
[`10-32`, `“그것도 어렵지 않을 거야.” 남자가 말을 이었다. “오즈는 크기와 모양이 가지각색인 심장을 잔뜩 모아 두었거든.”`],
[`10-33`, `“그리고 나는 용기를 달라고 할 거야.” 겁쟁이 사자가 말했다.`],
[`10-34`, `“오즈는 알현실에 용기가 든 커다란 단지를 두고 있어.” 남자가 말했다. “넘치지 않게 황금 접시로 덮어 두었지. 기꺼이 나눠 줄 거야.”`],
[`10-35`, `“그리고 저는 캔자스로 돌려보내 달라고 할 거예요.” 도로시가 말했다.`],
[`10-36`, `“캔자스가 어디니?” 남자가 놀라서 물었다.`],
[`10-37`, `“모르겠어요.” 도로시가 슬프게 대답했다. “하지만 우리 집이에요. 틀림없이 어딘가에 있어요.”`],
[`10-38`, `“그렇겠지. 뭐, 오즈는 무엇이든 할 수 있으니 캔자스도 찾아 주겠지. 하지만 먼저 오즈를 만나야 하는데, 그게 어려운 일이야. 위대한 마법사는 누구도 만나고 싶어 하지 않고, 대개 자기 뜻대로 하거든. 그런데 너는 뭘 원하니?” 남자가 토토에게 말을 걸었다. 토토는 꼬리만 흔들었다. 이상하게도 토토는 말을 할 줄 몰랐기 때문이다.`],
[`10-39`, `그때 여자가 저녁이 다 됐다고 불렀다. 모두 식탁에 둘러앉았다. 도로시는 맛있는 죽과 스크램블드에그 한 접시, 그리고 하얀 빵 한 접시를 먹으며 식사를 즐겼다. 사자는 죽을 조금 먹었지만 별로 좋아하지 않았다. 귀리로 만든 죽인데, 귀리는 말이 먹는 것이지 사자가 먹는 게 아니라는 것이었다. 허수아비와 양철 나무꾼은 아무것도 먹지 않았다. 토토는 모든 음식을 조금씩 먹었고, 다시 든든한 저녁을 먹게 되어 기뻐했다.`],
[`10-40`, `여자는 도로시에게 잘 침대를 내주었다. 토토는 도로시 곁에 누웠고, 사자는 아무도 도로시를 방해하지 못하도록 방문을 지켰다. 허수아비와 양철 나무꾼은 구석에 서서 밤새 조용히 있었다. 물론 둘은 잠을 잘 수 없었다.`],
[`10-41`, `이튿날 아침 해가 뜨자마자 일행은 길을 떠났고, 곧 바로 앞 하늘에서 아름다운 초록빛이 빛나는 것을 보았다.`],
[`10-42`, `“저게 에메랄드 시인가 봐.” 도로시가 말했다.`],
[`10-43`, `걸어갈수록 초록빛은 점점 더 밝아졌고, 마침내 여행의 끝에 가까워지는 것 같았다. 하지만 도시를 둘러싼 커다란 성벽에 이른 것은 오후가 되어서였다. 성벽은 높고 두껍고 밝은 초록색이었다.`],
[`10-44`, `일행 앞, 노란 벽돌 길이 끝나는 곳에 커다란 문이 있었다. 문에는 에메랄드가 빽빽이 박혀 있었는데, 햇빛에 어찌나 반짝이는지 허수아비의 그려 놓은 눈마저 눈이 부실 정도였다.`],
[`10-45`, `문 옆에 종이 있어서 도로시가 단추를 누르자 안에서 은방울 같은 소리가 딸랑 울렸다. 그러자 커다란 문이 천천히 열렸다. 모두 안으로 들어가 보니, 높은 아치형 천장이 있는 방이었고 벽에는 셀 수 없이 많은 에메랄드가 반짝이고 있었다.`],
[`10-46`, `일행 앞에 먼치킨들과 키가 비슷한 작은 남자가 서 있었다. 그는 머리부터 발끝까지 온통 초록색 옷을 입고 있었고, 피부마저 초록빛이 돌았다. 그 옆에는 커다란 초록색 상자가 있었다.`],
[`10-47`, `도로시와 동료들을 보자 남자가 물었다. “에메랄드 시에는 무슨 일로 왔느냐?”`],
[`10-48`, `“위대한 오즈님을 만나러 왔어요.” 도로시가 말했다.`],
[`10-49`, `남자는 이 대답에 어찌나 놀랐는지 자리에 앉아 곰곰이 생각했다.`],
[`10-50`, `“오즈님을 만나게 해 달라는 사람은 여러 해 만에 처음이로구나.” 그가 난처한 듯 고개를 저으며 말했다. “오즈님은 힘이 세고 무시무시한 분이시다. 쓸데없거나 어리석은 볼일로 위대한 마법사의 지혜로운 생각을 방해하면, 화가 나셔서 순식간에 너희 모두를 없애 버리실지도 몰라.”`],
[`10-51`, `“하지만 어리석은 볼일도 쓸데없는 볼일도 아니에요.” 허수아비가 대답했다. “중요한 일이에요. 그리고 오즈님은 착한 마법사라고 들었어요.”`],
[`10-52`, `“그렇지.” 초록 남자가 말했다. “오즈님은 에메랄드 시를 지혜롭고 훌륭하게 다스리신다. 하지만 정직하지 않은 자나 호기심으로 다가오는 자에게는 더없이 무시무시하시지. 그래서 감히 오즈님의 얼굴을 보여 달라고 청한 사람은 거의 없었다. 나는 성문 문지기다. 너희가 위대한 오즈님을 만나겠다고 하니 궁전으로 데려가야겠구나. 하지만 먼저 안경을 써야 한다.”`],
[`10-53`, `“왜요?” 도로시가 물었다.`],
[`10-54`, `“안경을 쓰지 않으면 에메랄드 시의 눈부신 빛과 영광에 눈이 멀고 말 테니까. 이 도시에 사는 사람들조차 밤낮으로 안경을 써야 한다. 안경은 모두 잠가 두는데, 도시를 처음 세울 때 오즈님이 그렇게 명령하셨기 때문이지. 그리고 안경을 풀 수 있는 열쇠는 나만 가지고 있다.”`],
[`10-55`, `문지기가 커다란 상자를 열자, 도로시는 상자 안에 크기와 모양이 가지각색인 안경이 가득한 것을 보았다. 모두 초록색 알이 끼워져 있었다. 문지기는 도로시에게 꼭 맞는 안경을 찾아 눈에 씌워 주었다. 안경에는 금띠 두 개가 달려 있어 뒷머리를 둘러 감았고, 문지기가 목에 건 사슬 끝의 작은 열쇠로 띠를 잠갔다. 안경을 쓰고 나니 도로시는 벗고 싶어도 벗을 수가 없었다. 하지만 물론 에메랄드 시의 눈부신 빛에 눈이 멀고 싶지는 않았기에 아무 말도 하지 않았다.`],
[`10-56`, `그런 다음 초록 남자는 허수아비와 양철 나무꾼과 사자, 그리고 꼬마 토토에게까지 안경을 맞춰 씌워 주었고, 모두 열쇠로 단단히 잠갔다.`],
[`10-57`, `그러고는 문지기도 자기 안경을 쓰고, 이제 궁전으로 안내할 준비가 되었다고 말했다. 그는 벽의 못에 걸린 커다란 금 열쇠를 집어 들어 또 하나의 문을 열었고, 모두 그를 따라 문을 지나 에메랄드 시의 거리로 들어섰다.`],
[`h`, `원작 11장 「놀라운 오즈의 에메랄드 시」`],
[`11-1`, `초록 안경으로 눈을 가렸는데도 도로시와 친구들은 처음에 그 놀라운 도시의 눈부신 빛에 눈이 부셨다. 거리에는 온통 초록 대리석으로 짓고 곳곳에 반짝이는 에메랄드를 박은 아름다운 집들이 늘어서 있었다. 일행이 걷는 길바닥도 같은 초록 대리석이었고, 돌과 돌 사이 이음매마다 에메랄드가 빽빽이 줄지어 박혀 햇빛에 반짝였다. 유리창은 초록 유리였다. 도시 위의 하늘마저 초록빛을 띠었고, 햇살도 초록색이었다.`],
[`11-2`, `남자, 여자, 아이 할 것 없이 많은 사람이 거리를 걸어 다니고 있었는데, 모두 초록 옷을 입었고 피부도 초록빛이 돌았다. 사람들은 도로시와 별나게 뒤섞인 일행을 신기한 눈으로 바라보았다. 아이들은 사자를 보자 모두 달아나 엄마 뒤에 숨었다. 하지만 아무도 말을 걸지 않았다. 거리에는 가게가 많았는데, 도로시가 보니 가게 안의 물건도 모두 초록색이었다. 초록 사탕과 초록 팝콘을 팔았고, 초록 신발과 초록 모자, 온갖 초록 옷도 팔았다. 어떤 곳에서는 한 남자가 초록 레모네이드를 팔고 있었는데, 아이들이 그것을 살 때 보니 초록 동전으로 값을 치르고 있었다.`],
[`11-3`, `말이나 다른 동물은 하나도 없는 것 같았다. 사람들은 작은 초록 수레를 앞으로 밀며 물건을 날랐다. 모두 행복하고 만족스럽고 넉넉해 보였다.`],
[`11-4`, `성문 문지기는 일행을 이끌고 거리를 지나 도시의 딱 한가운데에 있는 큰 건물에 이르렀다. 그곳이 위대한 마법사 오즈의 궁전이었다. 문 앞에는 초록 제복을 입고 기다란 초록 수염을 기른 병사가 서 있었다.`],
[`11-5`, `“낯선 이들이 왔소.” 성문 문지기가 병사에게 말했다. “위대한 오즈님을 만나겠다고 하오.”`],
[`11-6`, `“안으로 들어오시오.” 병사가 대답했다. “내가 오즈님께 말씀을 전하겠소.”`],
[`11-7`, `그래서 일행은 궁전 문을 지나 초록 양탄자가 깔리고 에메랄드를 박은 예쁜 초록 가구가 놓인 큰 방으로 안내되었다. 병사는 이 방에 들어가기 전에 모두 초록 깔개에 발을 닦게 했고, 모두 자리에 앉자 공손하게 말했다.`],
[`11-8`, `“제가 알현실 문으로 가서 오즈님께 여러분이 오셨다고 아뢰는 동안 편히 계십시오.”`],
[`11-9`, `병사가 돌아오기까지는 한참을 기다려야 했다. 마침내 병사가 돌아오자 도로시가 물었다.`],
[`11-10`, `“오즈님을 만났어요?”`],
[`11-11`, `“아, 아니요.” 병사가 대답했다. “나는 오즈님을 뵌 적이 없소. 하지만 칸막이 뒤에 앉아 계신 오즈님께 말씀을 드려 여러분의 뜻을 전했소. 원한다면 만나 주시겠다고 하셨소. 다만 한 사람씩 혼자 들어와야 하고, 하루에 한 사람만 들이시겠다고 하셨소. 그러니 며칠 동안 궁전에 머물러야 할 테니, 여행 뒤에 편히 쉴 수 있도록 방으로 안내해 드리겠소.”`],
[`11-12`, `“고맙습니다.” 소녀가 대답했다. “오즈님은 정말 친절하시네요.”`],
[`11-13`, `병사가 초록 호루라기를 불자, 곧 예쁜 초록 비단 드레스를 입은 소녀가 방으로 들어왔다. 그 소녀는 초록 머리카락과 초록 눈이 아름다웠다. 소녀는 도로시 앞에서 허리 숙여 인사하며 말했다. “따라오세요. 방으로 안내해 드릴게요.”`],
[`11-14`, `그래서 도로시는 토토만 빼고 모든 친구에게 잘 자라고 인사한 다음, 토토를 품에 안고 초록 소녀를 따라 복도 일곱 개를 지나고 계단 세 층을 올라 궁전 앞쪽의 방에 이르렀다. 세상에서 가장 아늑하고 귀여운 작은 방이었다. 초록 비단 침대보와 초록 벨벳 이불이 덮인 부드럽고 편안한 침대가 있었다. 방 한가운데에는 작은 분수가 있어 초록 향수를 공중으로 뿜었고, 그 향수는 아름답게 조각된 초록 대리석 물받이로 떨어졌다. 창가에는 아름다운 초록 꽃이 놓여 있었고, 선반에는 작은 초록 책들이 한 줄로 꽂혀 있었다. 나중에 도로시가 책을 펼쳐 볼 짬이 났을 때, 책 속에는 별난 초록 그림이 가득했는데 어찌나 우스운지 웃음이 터졌다.`],
[`11-15`, `옷장 안에는 비단과 공단과 벨벳으로 지은 초록 드레스가 많이 걸려 있었는데, 모두 도로시에게 딱 맞았다.`],
[`11-16`, `“여기를 내 집처럼 편하게 쓰세요.” 초록 소녀가 말했다. “필요한 게 있으면 종을 울리세요. 오즈님이 내일 아침에 부르실 거예요.”`],
[`11-17`, `초록 소녀는 도로시를 혼자 두고 다른 친구들에게 돌아갔다. 소녀는 그들도 방으로 안내했고, 모두 궁전의 무척 쾌적한 곳에 묵게 되었다. 물론 허수아비에게는 이런 정성이 다 소용없었다. 허수아비는 방에 혼자 남게 되자 문 바로 안쪽 한자리에 멍하니 서서 아침이 오기를 기다렸다. 누워도 쉬어지는 게 아니었고, 눈을 감을 수도 없었다. 그래서 그는 밤새 방구석에서 거미줄을 치는 작은 거미 한 마리를 바라보며 서 있었다. 마치 그곳이 세상에서 가장 멋진 방 가운데 하나가 아닌 것처럼 말이다. 양철 나무꾼은 습관처럼 침대에 누웠다. 살로 되어 있던 때를 기억했기 때문이다. 하지만 잠을 잘 수 없었기에 밤새 마디를 위아래로 움직이며 잘 움직이는지 확인했다. 사자는 숲속의 마른 나뭇잎 잠자리를 더 좋아했고 방에 갇혀 있는 것도 싫었다. 하지만 그런 걸로 속을 끓일 만큼 어리석지 않았기에, 침대 위로 뛰어올라 고양이처럼 몸을 말고 가르랑거리다가 금세 잠들었다.`],
[`11-18`, `이튿날 아침, 식사가 끝나자 초록 소녀가 도로시를 데리러 와서, 초록 무늬 공단으로 지은 가장 예쁜 드레스를 입혀 주었다. 도로시는 초록 비단 앞치마를 두르고 토토의 목에 초록 리본을 매어 준 다음, 위대한 오즈의 알현실로 향했다.`],
[`11-19`, `먼저 일행은 큰 홀에 이르렀다. 그곳에는 화려한 옷을 입은 궁정의 신사 숙녀가 많이 있었다. 이들은 서로 이야기하는 것 말고는 할 일이 없었지만, 오즈를 만나도록 허락받은 적이 한 번도 없는데도 매일 아침 알현실 밖에 와서 기다렸다. 도로시가 들어서자 사람들은 호기심 어린 눈으로 바라보았고, 그중 한 사람이 속삭였다.`],
[`11-20`, `“정말 무시무시한 오즈님의 얼굴을 뵈러 가는 거니?”`],
[`11-21`, `“그럼요.” 소녀가 대답했다. “만나 주신다면요.”`],
[`11-22`, `“아, 만나 주실 거요.” 마법사에게 말을 전했던 병사가 말했다. “오즈님은 사람들이 만나 달라고 하는 걸 좋아하지 않으시지만 말이오. 사실 처음에는 화를 내시며 너를 온 곳으로 돌려보내라고 하셨소. 그러다 네가 어떻게 생겼냐고 물으셨는데, 내가 은 구두 이야기를 하자 무척 관심을 보이셨소. 마지막으로 네 이마의 자국 이야기를 했더니, 너를 만나기로 하셨소.”`],
[`11-23`, `바로 그때 종이 울리자 초록 소녀가 도로시에게 말했다. “신호예요. 알현실에는 혼자 들어가야 해요.”`],
[`11-24`, `소녀가 작은 문을 열자 도로시는 씩씩하게 걸어 들어갔다. 놀라운 곳이었다. 높은 아치형 지붕이 있는 크고 둥근 방이었는데, 벽과 천장과 바닥이 온통 큼직한 에메랄드로 빽빽하게 덮여 있었다. 천장 한가운데에는 해처럼 밝은 커다란 빛이 있어서 에메랄드를 신비롭게 반짝이게 했다.`],
[`11-25`, `하지만 도로시의 눈길을 가장 끈 것은 방 한가운데 놓인 초록 대리석의 커다란 왕좌였다. 의자 모양의 왕좌는 다른 모든 것처럼 보석으로 반짝였다. 그 의자 한가운데에 거대한 머리 하나가 놓여 있었는데, 받쳐 주는 몸도 팔다리도 전혀 없었다. 머리에는 머리카락이 없었지만 눈과 코와 입이 있었고, 가장 큰 거인의 머리보다도 훨씬 컸다.`],
[`11-26`, `도로시가 놀라움과 두려움 속에서 그것을 바라보고 있는데, 그 눈이 천천히 돌아가더니 날카롭고 꼼짝도 않고 도로시를 쳐다보았다. 그러더니 입이 움직였고, 도로시는 이런 목소리를 들었다.`],
[`11-27`, `“나는 위대하고 무시무시한 오즈다. 너는 누구이며, 왜 나를 찾았느냐?”`],
[`11-28`, `커다란 머리에서 나오리라 생각했던 것만큼 끔찍한 목소리는 아니었다. 그래서 도로시는 용기를 내어 대답했다.`],
[`11-29`, `“저는 작고 순한 도로시예요. 도와 달라고 부탁드리러 왔어요.”`],
[`11-30`, `그 눈은 꼬박 일 분 동안 도로시를 곰곰이 바라보았다. 그러더니 목소리가 말했다.`],
[`11-31`, `“은 구두는 어디서 얻었느냐?”`],
[`11-32`, `“동쪽의 나쁜 마녀에게서 얻었어요. 우리 집이 마녀 위로 떨어져서 마녀가 죽었을 때요.” 도로시가 대답했다.`],
[`11-33`, `“이마의 자국은 어디서 얻었느냐?” 목소리가 계속 물었다.`],
[`11-34`, `“북쪽의 착한 마녀님이 작별 인사를 하며 저를 오즈님께 보내실 때 입 맞춰 주신 자리예요.” 소녀가 말했다.`],
[`11-35`, `그 눈이 다시 도로시를 날카롭게 바라보았고, 도로시가 사실을 말하고 있다는 것을 알았다. 그러자 오즈가 물었다. “나에게 무엇을 바라느냐?”`],
[`11-36`, `“저를 엠 아주머니와 헨리 아저씨가 계신 캔자스로 돌려보내 주세요.” 도로시가 간절하게 대답했다. “이 나라는 정말 아름답지만, 저는 좋지 않아요. 그리고 제가 이렇게 오래 떠나 있어서 엠 아주머니가 틀림없이 몹시 걱정하고 계실 거예요.”`],
[`11-37`, `그 눈이 세 번 깜빡이더니 천장으로 올라갔다가 바닥으로 내려갔다가, 방 구석구석을 다 보는 것처럼 이상하게 빙글빙글 굴렀다. 그리고 마침내 다시 도로시를 바라보았다.`],
[`11-38`, `“내가 왜 너를 위해 그렇게 해야 하느냐?” 오즈가 물었다.`],
[`11-39`, `“오즈님은 강하고 저는 약하니까요. 오즈님은 위대한 마법사이고 저는 어린 소녀일 뿐이니까요.”`],
[`11-40`, `“하지만 너는 동쪽의 나쁜 마녀를 죽일 만큼 강했지.” 오즈가 말했다.`],
[`11-41`, `“그건 그냥 그렇게 된 거예요.” 도로시가 꾸밈없이 대답했다. “제가 어쩔 수 없었어요.”`],
[`11-42`, `“그렇다면,” 머리가 말했다. “내 대답을 주겠다. 네가 그 대가로 나를 위해 무언가를 해 주지 않는 한, 내가 너를 캔자스로 돌려보내 주리라 기대할 권리는 없다. 이 나라에서는 누구든 얻는 모든 것에 값을 치러야 한다. 내가 마법의 힘을 써서 너를 집으로 돌려보내기를 바란다면, 먼저 너는 나를 위해 무언가를 해야 한다. 나를 도우면 나도 너를 돕겠다.”`],
[`11-43`, `“무엇을 해야 하죠?” 소녀가 물었다.`],
[`11-44`, `“서쪽의 나쁜 마녀를 죽여라.” 오즈가 대답했다.`],
[`11-45`, `“하지만 저는 못 해요!” 도로시가 깜짝 놀라 외쳤다.`],
[`11-46`, `“너는 동쪽 마녀를 죽였고, 강력한 마법이 깃든 은 구두를 신고 있다. 이제 이 땅에 나쁜 마녀는 하나만 남았다. 그 마녀가 죽었다고 내게 말할 수 있게 되면 너를 캔자스로 돌려보내 주겠다. 하지만 그 전에는 안 된다.”`],
[`11-47`, `어린 소녀는 너무 실망해서 울기 시작했다. 그 눈이 다시 깜빡이더니 걱정스러운 듯 도로시를 바라보았다. 마치 위대한 오즈는 도로시가 마음만 먹으면 자기를 도울 수 있다고 느끼는 것 같았다.`],
[`11-48`, `“저는 한 번도 일부러 무엇을 죽인 적이 없어요.” 도로시가 흐느꼈다. “죽이고 싶다고 해도 제가 어떻게 나쁜 마녀를 죽일 수 있겠어요? 위대하고 무시무시한 오즈님도 직접 죽이지 못하시는데, 어떻게 저한테 그걸 바라세요?”`],
[`11-49`, `“나도 모른다.” 머리가 말했다. “하지만 그것이 내 대답이다. 나쁜 마녀가 죽기 전에는 너는 아저씨와 아주머니를 다시 보지 못할 것이다. 그 마녀는 나쁘다는 것을, 엄청나게 나쁘니 죽어 마땅하다는 것을 기억하라. 이제 가라. 그리고 네 일을 해내기 전까지는 다시 나를 만나겠다고 하지 마라.”`],
[`11-50`, `도로시는 슬픈 마음으로 알현실을 나와, 오즈가 무슨 말을 했는지 들으려고 기다리던 사자와 허수아비와 양철 나무꾼에게 돌아갔다. “나에게는 희망이 없어.” 도로시가 슬프게 말했다. “내가 서쪽의 나쁜 마녀를 죽이기 전에는 오즈님이 나를 집에 보내 주지 않으신대. 그런데 나는 그런 일은 절대 못 해.”`],
[`11-51`, `친구들은 안타까워했지만 도울 수 있는 일이 없었다. 그래서 도로시는 자기 방으로 가서 침대에 누워 울다가 잠이 들었다.`],
[`11-52`, `이튿날 아침, 초록 수염의 병사가 허수아비에게 와서 말했다.`],
[`11-53`, `“나와 함께 갑시다. 오즈님이 부르시오.”`],
[`11-54`, `그래서 허수아비는 병사를 따라가 커다란 알현실에 들어갔다. 그곳 에메랄드 왕좌에는 무척 아름다운 숙녀가 앉아 있었다. 숙녀는 초록 비단 망사 옷을 입고, 물결치는 초록 머리카락 위에 보석 왕관을 쓰고 있었다. 어깨에서는 빛깔이 화려한 날개가 돋아 있었는데, 어찌나 가벼운지 아주 작은 숨결만 닿아도 파르르 떨렸다.`],
[`11-55`, `허수아비가 짚으로 채운 몸이 허락하는 한 최대한 예쁘게 이 아름다운 존재 앞에 허리 숙여 인사하자, 숙녀는 허수아비를 다정하게 바라보며 말했다.`],
[`11-56`, `“나는 위대하고 무시무시한 오즈다. 너는 누구이며, 왜 나를 찾았느냐?”`],
[`11-57`, `도로시에게서 들은 커다란 머리를 보리라 생각했던 허수아비는 무척 놀랐다. 하지만 씩씩하게 대답했다.`],
[`11-58`, `“저는 짚을 채운 허수아비일 뿐입니다. 그래서 뇌가 없습니다. 제 머리에 짚 대신 뇌를 넣어 주셔서, 오즈님이 다스리는 땅의 다른 누구 못지않은 사람이 되게 해 주십사 부탁드리러 왔습니다.”`],
[`11-59`, `“내가 왜 너를 위해 그렇게 해야 하느냐?” 숙녀가 물었다.`],
[`11-60`, `“오즈님은 지혜롭고 힘이 있으시고, 저를 도와줄 수 있는 이는 아무도 없으니까요.” 허수아비가 대답했다.`],
[`11-61`, `“나는 대가 없이 은혜를 베푸는 일이 없다.” 오즈가 말했다. “하지만 이것만은 약속하겠다. 나를 위해 서쪽의 나쁜 마녀를 죽인다면, 너에게 아주 많은 뇌를 주겠다. 어찌나 좋은 뇌인지 너는 오즈 나라에서 가장 지혜로운 사람이 될 것이다.”`],
[`11-62`, `“도로시에게 마녀를 죽이라고 하신 줄 알았는데요.” 허수아비가 놀라서 말했다.`],
[`11-63`, `“그랬다. 누가 죽이든 상관없다. 하지만 마녀가 죽기 전에는 네 소원을 들어주지 않겠다. 이제 가라. 그토록 원하는 뇌를 얻을 자격을 갖추기 전에는 다시 나를 찾지 마라.”`],
[`11-64`, `허수아비는 슬픈 마음으로 친구들에게 돌아가 오즈가 한 말을 전했다. 도로시는 위대한 마법사가 자기가 본 것처럼 머리가 아니라 아름다운 숙녀였다는 말에 놀랐다.`],
[`11-65`, `“어쨌든,” 허수아비가 말했다. “그 숙녀도 양철 나무꾼만큼이나 심장이 필요해요.”`],
[`11-66`, `그다음 날 아침, 초록 수염의 병사가 양철 나무꾼에게 와서 말했다.`],
[`11-67`, `“오즈님이 부르시오. 따라오시오.”`],
[`11-68`, `그래서 양철 나무꾼은 병사를 따라 커다란 알현실로 갔다. 오즈가 아름다운 숙녀일지 머리일지 알 수 없었지만, 그는 아름다운 숙녀이기를 바랐다. ‘머리라면,’ 그는 속으로 생각했다. ‘틀림없이 심장을 받지 못할 거야. 머리에는 제 심장이 없으니 나를 가엾게 여길 수 없을 테니까. 하지만 아름다운 숙녀라면 심장을 달라고 간절히 부탁해야지. 숙녀들은 모두 마음씨가 곱다고들 하니까.’`],
[`11-69`, `그러나 나무꾼이 커다란 알현실에 들어갔을 때 그곳에는 머리도 숙녀도 없었다. 오즈가 아주 무시무시한 괴물의 모습을 하고 있었기 때문이다. 괴물은 코끼리만큼 컸고, 초록 왕좌가 그 무게를 겨우 버티는 것 같았다. 괴물의 머리는 코뿔소 같았는데, 얼굴에 눈이 다섯 개나 있었다. 몸에서는 기다란 팔 다섯 개가 뻗어 나와 있었고, 길고 가느다란 다리도 다섯 개였다. 두껍고 곱슬곱슬한 털이 온몸을 덮고 있어서, 이보다 더 무시무시하게 생긴 괴물은 상상할 수도 없었다. 그 순간 양철 나무꾼에게 심장이 없었던 것은 다행이었다. 심장이 있었다면 공포로 크고 빠르게 두근거렸을 테니까. 하지만 양철일 뿐인 나무꾼은 크게 실망하기는 했어도 조금도 무섭지 않았다.`],
[`11-70`, `“나는 위대하고 무시무시한 오즈다.” 괴물이 커다란 포효 같은 목소리로 말했다. “너는 누구이며, 왜 나를 찾았느냐?”`],
[`11-71`, `“저는 나무꾼이고, 양철로 만들어졌습니다. 그래서 심장이 없어서 사랑할 수 없습니다. 다른 사람들처럼 될 수 있도록 저에게 심장을 주십시오.”`],
[`11-72`, `“내가 왜 그래야 하느냐?” 괴물이 다그쳤다.`],
[`11-73`, `“제가 부탁드리고, 제 부탁을 들어주실 수 있는 분은 오즈님뿐이니까요.” 나무꾼이 대답했다.`],
[`11-74`, `오즈는 이 말에 낮게 으르렁거리더니 퉁명스럽게 말했다. “정말 심장을 원한다면, 얻을 자격을 갖춰라.”`],
[`11-75`, `“어떻게요?” 나무꾼이 물었다.`],
[`11-76`, `“도로시가 서쪽의 나쁜 마녀를 죽이는 것을 도와라.” 괴물이 대답했다. “마녀가 죽으면 나에게 오너라. 그러면 오즈 나라에서 가장 크고 가장 다정하고 가장 사랑이 넘치는 심장을 주겠다.”`],
[`11-77`, `그래서 양철 나무꾼은 어쩔 수 없이 슬픈 마음으로 친구들에게 돌아가, 자기가 본 무시무시한 괴물 이야기를 했다. 모두 위대한 마법사가 그토록 여러 모습으로 변할 수 있다는 것에 크게 놀랐다. 사자가 말했다.`],
[`11-78`, `“내가 만나러 갈 때 오즈가 괴물이라면, 있는 힘껏 울부짖어서 겁을 줄 거야. 그러면 내가 바라는 걸 다 들어주겠지. 아름다운 숙녀라면 덤벼드는 척해서 내 말을 듣게 만들 거야. 그리고 커다란 머리라면 내 마음대로 할 수 있지. 우리가 원하는 걸 주겠다고 약속할 때까지 그 머리를 방 안 여기저기로 굴려 버릴 테니까. 그러니 힘내, 친구들. 다 잘될 거야.”`],
[`11-79`, `이튿날 아침, 초록 수염의 병사가 사자를 커다란 알현실로 데려가 오즈 앞에 들어가라고 했다.`],
[`11-80`, `사자는 곧장 문을 지나 들어가 주위를 둘러보았다. 놀랍게도 왕좌 앞에는 불덩이 하나가 있었는데, 어찌나 사납게 이글거리는지 바라보기조차 힘들었다. 사자는 처음에 오즈가 실수로 불이 붙어 타고 있는 줄 알았다. 하지만 가까이 가 보려 하자 열기가 너무 뜨거워 수염이 그을렸고, 사자는 덜덜 떨며 문 가까이로 슬금슬금 물러났다.`],
[`11-81`, `그러자 불덩이에서 낮고 조용한 목소리가 들려왔다. 그 목소리는 이렇게 말했다.`],
[`11-82`, `“나는 위대하고 무시무시한 오즈다. 너는 누구이며, 왜 나를 찾았느냐?”`],
[`11-83`, `사자가 대답했다. “저는 모든 게 무서운 겁쟁이 사자입니다. 사람들이 저를 부르는 대로 정말 동물의 왕이 될 수 있도록, 저에게 용기를 주십사 부탁드리러 왔습니다.”`],
[`11-84`, `“내가 왜 너에게 용기를 주어야 하느냐?” 오즈가 다그쳤다.`],
[`11-85`, `“모든 마법사 가운데 오즈님이 가장 위대하시고, 제 부탁을 들어줄 힘이 있는 분은 오즈님뿐이니까요.” 사자가 대답했다.`],
[`11-86`, `불덩이가 한동안 사납게 타오르더니 목소리가 말했다. “나쁜 마녀가 죽었다는 증거를 가져오너라. 그 순간 너에게 용기를 주겠다. 하지만 마녀가 살아 있는 한 너는 겁쟁이로 남아야 한다.”`],
[`11-87`, `사자는 이 말에 화가 났지만 아무 대꾸도 할 수 없었다. 사자가 말없이 서서 불덩이를 바라보고 있는 사이 불덩이가 어찌나 맹렬하게 뜨거워졌는지, 사자는 꽁지가 빠지게 방에서 뛰쳐나왔다. 사자는 친구들이 기다리고 있는 것을 보고 기뻐하며, 마법사와의 무시무시한 만남 이야기를 했다.`],
[`11-88`, `“이제 어떡하지?” 도로시가 슬프게 물었다.`],
[`11-89`, `“우리가 할 수 있는 일은 하나뿐이야.” 사자가 대답했다. “윙키들의 나라로 가서 나쁜 마녀를 찾아내 없애는 거지.”`],
[`11-90`, `“하지만 해내지 못하면?” 소녀가 말했다.`],
[`11-91`, `“그러면 나는 영영 용기를 얻지 못하겠지.” 사자가 단언했다.`],
[`11-92`, `“그리고 나는 영영 뇌를 얻지 못하겠지요.” 허수아비가 덧붙였다.`],
[`11-93`, `“그리고 저는 영영 심장을 얻지 못하겠지요.” 양철 나무꾼이 말했다.`],
[`11-94`, `“그리고 나는 엠 아주머니와 헨리 아저씨를 영영 못 보겠지.” 도로시가 말하며 울기 시작했다.`],
[`11-95`, `“조심하세요!” 초록 소녀가 외쳤다. “눈물이 초록 비단 드레스에 떨어지면 얼룩이 져요.”`],
[`11-96`, `그래서 도로시는 눈물을 닦고 말했다. “해 보는 수밖에 없겠지. 하지만 나는 정말 누구도 죽이고 싶지 않아. 엠 아주머니를 다시 만나기 위해서라도.”`],
[`11-97`, `“나도 같이 갈게. 하지만 나는 너무 겁쟁이라 마녀를 죽이지는 못해.” 사자가 말했다.`],
[`11-98`, `“나도 갈게요.” 허수아비가 말했다. “하지만 나는 바보라서 별 도움은 못 될 거예요.”`],
[`11-99`, `“저는 마녀라도 해칠 마음이 없어요.” 양철 나무꾼이 말했다. “하지만 아가씨가 간다면 저도 꼭 같이 갈게요.”`],
[`11-100`, `그래서 다음 날 아침에 길을 떠나기로 정했다. 나무꾼은 초록 숫돌에 도끼를 갈고 마디마디에 기름을 잘 쳤다. 허수아비는 새 짚으로 몸을 채웠고, 도로시는 허수아비가 더 잘 볼 수 있도록 눈을 새로 칠해 주었다. 일행에게 무척 친절했던 초록 소녀는 도로시의 바구니를 맛있는 음식으로 가득 채워 주고, 초록 리본으로 토토의 목에 작은 방울을 달아 주었다.`],
[`11-101`, `일행은 아주 일찍 잠자리에 들어 날이 밝을 때까지 푹 잤다. 그러다 궁전 뒷마당에 사는 초록 수탉이 우는 소리와, 초록 달걀을 낳은 암탉이 꼬꼬댁거리는 소리에 잠을 깼다.`],
  ]
};

/* 원문 책장: 원작 12~13장 — 이 앱을 위해 새로 우리말로 옮김 */
BOOK.ch7 = {
  title: `나쁜 마녀를 찾아서 · 구출`,
  orig: `원작 12~13장`,
  paras: [
[`h`, `원작 12장 「나쁜 마녀를 찾아서」`],
[`12-1`, `초록 수염의 병사는 일행을 데리고 에메랄드 시의 거리를 지나 성문 문지기가 사는 방에 이르렀다. 문지기는 일행의 안경을 풀어 커다란 상자에 도로 넣은 다음, 우리 친구들을 위해 공손하게 문을 열어 주었다.`],
[`12-2`, `“어느 길로 가야 서쪽의 나쁜 마녀에게 갈 수 있어요?” 도로시가 물었다.`],
[`12-3`, `“길이 없단다.” 성문 문지기가 대답했다. “그쪽으로 가고 싶어 하는 사람은 아무도 없거든.”`],
[`12-4`, `“그럼 마녀를 어떻게 찾아요?” 소녀가 물었다.`],
[`12-5`, `“그건 쉽지.” 남자가 대답했다. “너희가 윙키들의 나라에 들어온 걸 알면 마녀가 너희를 찾아낼 테니까. 그리고 너희 모두를 노예로 삼겠지.”`],
[`12-6`, `“아닐지도 몰라요.” 허수아비가 말했다. “우리는 마녀를 물리칠 생각이거든요.”`],
[`12-7`, `“아, 그렇다면 얘기가 다르지.” 성문 문지기가 말했다. “지금까지 아무도 마녀를 물리친 적이 없어서, 당연히 다른 이들처럼 너희도 노예가 될 줄 알았지. 하지만 조심해라. 마녀는 사납고 못된 데다, 순순히 물러나지 않을 테니까. 해가 지는 서쪽으로만 계속 가면 틀림없이 마녀를 찾을 거다.”`],
[`12-8`, `일행은 문지기에게 고맙다고 인사하고 작별한 뒤, 데이지와 미나리아재비가 여기저기 피어 있는 부드러운 풀밭을 지나 서쪽으로 향했다. 도로시는 여전히 궁전에서 입은 예쁜 비단 드레스를 입고 있었는데, 놀랍게도 드레스는 더 이상 초록색이 아니라 새하얀색이었다. 토토 목에 맨 리본도 초록빛을 잃고 도로시의 드레스처럼 하얘져 있었다.`],
[`12-9`, `에메랄드 시는 곧 멀리 뒤로 사라졌다. 나아갈수록 땅은 점점 더 거칠고 언덕이 많아졌다. 이 서쪽 나라에는 농장도 집도 없었고, 땅은 일구어지지 않은 채였다.`],
[`12-10`, `오후가 되자 해가 일행의 얼굴에 뜨겁게 내리쬐었다. 그늘을 드리워 줄 나무가 하나도 없었기 때문이다. 그래서 밤이 되기도 전에 도로시와 토토와 사자는 지쳐서 풀밭에 누워 잠이 들었고, 나무꾼과 허수아비가 망을 보았다.`],
[`12-11`, `그런데 서쪽의 나쁜 마녀는 눈이 하나뿐이었지만, 그 눈은 망원경만큼이나 강해서 어디든 볼 수 있었다. 그래서 마녀가 성문 앞에 앉아 무심코 주위를 둘러보다가, 친구들에게 둘러싸여 잠든 도로시를 보았다. 아주 먼 곳이었지만, 나쁜 마녀는 그들이 자기 나라에 들어온 것을 보고 화가 나서 목에 건 은 호루라기를 불었다.`],
[`12-12`, `그러자 곧 사방에서 커다란 늑대 떼가 마녀에게 달려왔다. 늑대들은 다리가 길고 눈이 사납고 이빨이 날카로웠다.`],
[`12-13`, `“저 사람들에게 가라.” 마녀가 말했다. “그리고 갈기갈기 찢어 버려라.”`],
[`12-14`, `“노예로 삼지 않으실 겁니까?” 늑대들의 우두머리가 물었다.`],
[`12-15`, `“아니.” 마녀가 대답했다. “하나는 양철이고, 하나는 짚이고, 하나는 계집아이고, 또 하나는 사자다. 아무도 일하기에 알맞지 않으니 잘게 찢어 버려도 좋다.”`],
[`12-16`, `“알겠습니다.” 늑대가 말하고는 쏜살같이 달려갔고, 다른 늑대들이 그 뒤를 따랐다.`],
[`12-17`, `다행히 허수아비와 나무꾼은 말짱하게 깨어 있어서 늑대들이 오는 소리를 들었다.`],
[`12-18`, `“이건 제 싸움이에요.” 나무꾼이 말했다. “그러니 제 뒤에 있어요. 놈들이 오는 대로 제가 맞설게요.”`],
[`12-19`, `나무꾼은 아주 날카롭게 갈아 둔 도끼를 움켜쥐고, 늑대 우두머리가 달려들자 팔을 휘둘러 단번에 쓰러뜨렸다. 도끼를 다시 들자마자 또 한 마리가 달려들었고, 그 늑대도 양철 나무꾼의 날카로운 도끼날 아래 쓰러졌다. 늑대는 마흔 마리였고, 마흔 번 늑대가 쓰러져, 마침내 모두 나무꾼 앞에 무더기로 쓰러져 있었다.`],
[`12-20`, `그러자 나무꾼은 도끼를 내려놓고 허수아비 옆에 앉았다. 허수아비가 말했다. “훌륭한 싸움이었어요, 친구.”`],
[`12-21`, `둘은 이튿날 아침 도로시가 깰 때까지 기다렸다. 어린 소녀는 텁수룩한 늑대 무더기를 보고 무척 무서워했지만, 양철 나무꾼이 모든 이야기를 해 주었다. 도로시는 모두를 구해 줘서 고맙다고 인사하고 아침을 먹은 다음, 다시 길을 떠났다.`],
[`12-22`, `바로 그날 아침, 나쁜 마녀는 성문 앞에 나와 멀리까지 보는 외눈으로 바깥을 내다보았다. 그리고 늑대들이 모두 쓰러져 있고, 낯선 이들이 여전히 자기 나라를 지나가고 있는 것을 보았다. 마녀는 전보다 더 화가 나서 은 호루라기를 두 번 불었다.`],
[`12-23`, `그러자 곧 하늘을 어둡게 뒤덮을 만큼 커다란 사나운 까마귀 떼가 마녀를 향해 날아왔다.`],
[`12-24`, `나쁜 마녀가 까마귀 왕에게 말했다. “당장 저 낯선 자들에게 날아가라. 눈을 쪼아 먹고 갈기갈기 찢어 버려라.”`],
[`12-25`, `사나운 까마귀들은 한 덩어리가 되어 도로시와 동료들을 향해 날아갔다. 까마귀 떼가 오는 것을 본 어린 소녀는 겁이 났다.`],
[`12-26`, `하지만 허수아비가 말했다. “이건 내 싸움이에요. 그러니 내 옆에 엎드려요. 그러면 다치지 않을 거예요.”`],
[`12-27`, `그래서 허수아비만 빼고 모두 땅에 엎드렸다. 허수아비는 일어서서 두 팔을 쭉 벌렸다. 까마귀들은 허수아비를 보자 겁을 먹었다. 까마귀는 언제나 허수아비를 무서워하는 법이다. 그래서 감히 더 가까이 오지 못했다. 그런데 까마귀 왕이 말했다.`],
[`12-28`, `“저건 그냥 속을 채운 인형일 뿐이야. 내가 저놈의 눈을 쪼아 버리겠다.”`],
[`12-29`, `까마귀 왕이 허수아비에게 달려들자, 허수아비는 그 머리를 붙잡아 물리쳤다. 또 한 마리가 달려들었고, 허수아비는 그 까마귀도 물리쳤다. 까마귀는 마흔 마리였고, 허수아비는 마흔 번 까마귀를 물리쳐, 마침내 모두 그의 곁에 쓰러져 있었다. 그러자 허수아비는 동료들에게 일어나라고 외쳤고, 일행은 다시 길을 떠났다.`],
[`12-30`, `나쁜 마녀가 다시 내다보았을 때 까마귀들이 모두 무더기로 쓰러져 있는 것을 보자, 마녀는 불같이 화를 내며 은 호루라기를 세 번 불었다.`],
[`12-31`, `그러자 곧 공중에서 커다랗게 윙윙거리는 소리가 들리더니, 검은 벌 떼가 마녀를 향해 날아왔다.`],
[`12-32`, `“저 낯선 자들에게 가서 침으로 쏘아 죽여라!” 마녀가 명령하자, 벌들은 방향을 돌려 도로시와 친구들이 걷고 있는 곳까지 빠르게 날아갔다. 하지만 나무꾼은 벌 떼가 오는 것을 보았고, 허수아비는 이미 어떻게 할지 정해 두었다.`],
[`12-33`, `“내 짚을 꺼내서 도로시와 토토와 사자 위에 뿌려요.” 허수아비가 나무꾼에게 말했다. “그러면 벌들이 쏘지 못할 거예요.” 나무꾼은 그대로 했다. 도로시가 사자 옆에 바짝 붙어 누워 토토를 품에 안자, 짚이 그들을 완전히 덮었다.`],
[`12-34`, `벌들이 와 보니 쏠 상대는 나무꾼밖에 없었다. 그래서 벌들은 나무꾼에게 달려들었지만, 양철에 부딪혀 침만 모두 부러졌을 뿐 나무꾼은 조금도 다치지 않았다. 벌은 침이 부러지면 살 수 없기 때문에, 검은 벌 떼는 그렇게 끝이 났다. 벌들은 고운 석탄 가루를 작게 쌓아 놓은 것처럼 나무꾼 주위에 수북이 흩어져 있었다.`],
[`12-35`, `그러자 도로시와 사자가 일어났고, 소녀는 양철 나무꾼을 도와 허수아비에게 짚을 다시 채워 넣었다. 허수아비는 원래대로 멀쩡해졌다. 그렇게 일행은 다시 한번 길을 떠났다.`],
[`12-36`, `나쁜 마녀는 검은 벌들이 고운 석탄 가루처럼 작은 무더기로 쌓인 것을 보자, 어찌나 화가 났는지 발을 구르고 머리카락을 쥐어뜯고 이를 갈았다. 그러고는 자기 노예인 윙키 열두 명을 불러 날카로운 창을 주고, 낯선 자들에게 가서 없애 버리라고 했다.`],
[`12-37`, `윙키들은 용감한 사람들이 아니었지만 시키는 대로 할 수밖에 없었다. 그래서 행진해 가다가 도로시 가까이에 이르렀다. 그러자 사자가 크게 울부짖으며 그들에게 달려들었고, 불쌍한 윙키들은 너무 무서워서 있는 힘껏 달아나 버렸다.`],
[`12-38`, `윙키들이 성으로 돌아오자 나쁜 마녀는 가죽끈으로 그들을 실컷 때리고 일터로 돌려보냈다. 그러고는 앉아서 다음에 무엇을 할지 궁리했다. 낯선 자들을 없애려는 계획이 왜 모두 실패했는지 알 수가 없었다. 하지만 마녀는 못된 만큼이나 힘센 마녀였기에, 곧 어떻게 할지 마음을 정했다.`],
[`12-39`, `마녀의 찬장에는 황금 모자가 하나 있었다. 둘레에 다이아몬드와 루비가 빙 둘러 박힌 모자였다. 이 황금 모자에는 마법이 걸려 있었다. 모자의 주인은 날개 달린 원숭이들을 세 번 불러낼 수 있었고, 원숭이들은 어떤 명령이든 따랐다. 하지만 누구도 이 별난 동물들에게 세 번 넘게 명령할 수는 없었다. 나쁜 마녀는 이미 두 번이나 모자의 마법을 썼다. 한 번은 윙키들을 노예로 삼고 그들의 나라를 다스리게 되었을 때였다. 날개 달린 원숭이들이 그 일을 도왔다. 두 번째는 위대한 오즈와 맞서 싸워 그를 서쪽 나라에서 몰아냈을 때였다. 그때도 날개 달린 원숭이들이 도왔다. 이제 황금 모자를 쓸 수 있는 건 단 한 번뿐이었다. 그래서 마녀는 다른 힘을 모두 써 버리기 전까지는 모자를 쓰고 싶지 않았다. 하지만 이제 사나운 늑대들도, 사나운 까마귀들도, 침을 쏘는 벌들도 사라졌고, 노예들은 겁쟁이 사자에게 쫓겨 달아났다. 도로시와 친구들을 없앨 방법은 하나밖에 남지 않았다.`],
[`12-40`, `그래서 나쁜 마녀는 찬장에서 황금 모자를 꺼내 머리에 썼다. 그러고는 왼발로 서서 천천히 말했다.`],
[`12-41`, `“에페, 페페, 카케!”`],
[`12-42`, `다음에는 오른발로 서서 말했다.`],
[`12-43`, `“힐로, 홀로, 헬로!”`],
[`12-44`, `그런 다음 두 발로 서서 큰 소리로 외쳤다.`],
[`12-45`, `“지지, 주지, 직!”`],
[`12-46`, `이제 마법이 통하기 시작했다. 하늘이 어두워지고 공중에서 낮게 우르릉거리는 소리가 들렸다. 수많은 날갯짓 소리와 시끄럽게 재잘거리고 웃는 소리가 들려오더니, 어두운 하늘에서 해가 나와 나쁜 마녀를 비추었다. 마녀는 원숭이 떼에 둘러싸여 있었는데, 원숭이마다 어깨에 거대하고 힘센 날개가 한 쌍씩 달려 있었다.`],
[`12-47`, `다른 원숭이들보다 훨씬 큰 원숭이 하나가 우두머리인 것 같았다. 그가 마녀 가까이 날아와 말했다. “우리를 세 번째이자 마지막으로 부르셨군요. 무엇을 명령하시겠습니까?”`],
[`12-48`, `“내 땅에 들어온 낯선 자들에게 가서 사자만 빼고 모두 없애 버려라.” 나쁜 마녀가 말했다. “그 짐승은 나에게 데려오너라. 말처럼 마구를 채워 일을 시킬 생각이니까.”`],
[`12-49`, `“분부대로 하겠습니다.” 우두머리가 말했다. 그러고는 시끄럽게 재잘거리며 날개 달린 원숭이들이 도로시와 친구들이 걷고 있는 곳으로 날아갔다.`],
[`12-50`, `원숭이 몇 마리는 양철 나무꾼을 붙잡고 날아가, 날카로운 바위가 빽빽이 덮인 땅 위에 이르렀다. 그곳에서 원숭이들은 불쌍한 나무꾼을 떨어뜨렸다. 나무꾼은 아주 높은 곳에서 바위 위로 떨어졌고, 너무 심하게 찌그러지고 움푹 패어 움직일 수도 신음할 수도 없었다.`],
[`12-51`, `다른 원숭이들은 허수아비를 붙잡아 긴 손가락으로 옷과 머리에서 짚을 모조리 뽑아냈다. 그리고 모자와 장화와 옷을 작은 꾸러미로 만들어 키 큰 나무 꼭대기 가지에 던져 버렸다.`],
[`12-52`, `나머지 원숭이들은 사자에게 튼튼한 밧줄을 던져 몸과 머리와 다리를 여러 겹 칭칭 감았다. 사자는 물지도 할퀴지도 몸부림치지도 못하게 되었다. 원숭이들은 사자를 들어 올려 마녀의 성으로 날아갔고, 사자는 높은 쇠 울타리가 둘러쳐진 작은 마당에 갇혀 빠져나갈 수 없게 되었다.`],
[`12-53`, `하지만 원숭이들은 도로시는 전혀 해치지 않았다. 도로시는 토토를 품에 안고 서서, 동료들이 슬픈 일을 당하는 것을 지켜보며 곧 자기 차례가 오리라 생각했다. 날개 달린 원숭이의 우두머리가 털북숭이 긴 팔을 쭉 뻗고 흉측한 얼굴로 무섭게 웃으며 도로시에게 날아왔다. 그런데 도로시의 이마에 있는 착한 마녀의 입맞춤 자국을 보더니 우뚝 멈춰 서서, 다른 원숭이들에게 손짓하여 도로시를 건드리지 못하게 했다.`],
[`12-54`, `“우리는 감히 이 소녀를 해칠 수 없다.” 우두머리가 원숭이들에게 말했다. “이 아이는 선의 힘이 지켜 주고 있고, 선의 힘은 악의 힘보다 크니까. 우리가 할 수 있는 건 이 아이를 나쁜 마녀의 성으로 데려가 거기 두는 것뿐이다.”`],
[`12-55`, `그래서 원숭이들은 조심스럽고 부드럽게 도로시를 팔에 안아 들고 재빨리 날아가 성에 이르렀고, 현관 계단 위에 도로시를 내려놓았다. 그러고는 우두머리가 마녀에게 말했다.`],
[`12-56`, `“우리가 할 수 있는 만큼은 분부를 따랐습니다. 양철 나무꾼과 허수아비는 망가졌고, 사자는 당신의 마당에 묶여 있습니다. 어린 소녀와 소녀가 안고 있는 개는 감히 해칠 수 없었습니다. 이제 우리 무리에 대한 당신의 힘은 끝났습니다. 다시는 우리를 보지 못할 겁니다.”`],
[`12-57`, `그러자 날개 달린 원숭이들은 모두 시끄럽게 웃고 재잘거리며 하늘로 날아올라 곧 보이지 않게 되었다.`],
[`12-58`, `나쁜 마녀는 도로시 이마의 자국을 보고 놀라기도 하고 걱정도 되었다. 날개 달린 원숭이들도, 자기 자신도 감히 이 소녀를 조금도 해칠 수 없다는 것을 잘 알았기 때문이다. 마녀는 도로시의 발을 내려다보았다. 그리고 은 구두를 보자 무서워서 떨기 시작했다. 그 구두에 얼마나 강력한 마법이 깃들어 있는지 알았기 때문이다. 처음에 마녀는 도로시에게서 도망치고 싶었다. 그런데 우연히 아이의 눈을 들여다보니, 그 눈 뒤의 마음이 얼마나 순진한지, 그리고 이 어린 소녀가 은 구두가 주는 놀라운 힘을 전혀 모른다는 것을 알게 되었다. 그래서 나쁜 마녀는 속으로 웃으며 생각했다. ‘아직 이 아이를 노예로 삼을 수 있겠어. 자기 힘을 쓰는 법을 모르니까.’ 그러고는 도로시에게 거칠고 엄하게 말했다.`],
[`12-59`, `“나를 따라와라. 내가 시키는 건 무엇이든 잘 들어. 안 그러면 양철 나무꾼과 허수아비처럼 너도 끝장을 내 주겠다.”`],
[`12-60`, `도로시는 마녀를 따라 성의 아름다운 방들을 여러 개 지나 부엌에 이르렀다. 마녀는 도로시에게 냄비와 주전자를 닦고, 바닥을 쓸고, 불이 꺼지지 않게 장작을 넣으라고 했다.`],
[`12-61`, `도로시는 얌전히 일을 시작했다. 있는 힘껏 열심히 일하기로 마음먹었다. 나쁜 마녀가 자기를 죽이지 않기로 해서 다행이라고 생각했기 때문이다.`],
[`12-62`, `도로시가 열심히 일하는 동안, 마녀는 마당에 가서 겁쟁이 사자에게 말처럼 마구를 채우려고 했다. 내키는 대로 마차를 끌게 하면 무척 재미있을 것 같았다. 그런데 마녀가 문을 열자 사자가 크게 울부짖으며 어찌나 사납게 덤벼들었는지, 마녀는 겁이 나서 도로 나가 문을 닫아 버렸다.`],
[`12-63`, `“마구를 채울 수 없다면,” 마녀가 문살 사이로 사자에게 말했다. “굶기면 되지. 내 말을 들을 때까지 너는 아무것도 먹지 못할 거다.”`],
[`12-64`, `그래서 그 뒤로 마녀는 갇힌 사자에게 먹을 것을 하나도 주지 않았다. 대신 날마다 한낮이 되면 문 앞에 와서 물었다. “말처럼 마구를 찰 준비가 됐느냐?”`],
[`12-65`, `그러면 사자는 대답했다. “아니. 이 마당에 들어오면 물어 버릴 테다.”`],
[`12-66`, `사자가 마녀가 바라는 대로 하지 않아도 되었던 까닭은, 매일 밤 마녀가 잠든 사이 도로시가 찬장에서 음식을 꺼내 사자에게 가져다주었기 때문이다. 사자는 음식을 먹고 나면 짚 잠자리에 누웠고, 도로시는 그 곁에 누워 부드럽고 텁수룩한 갈기에 머리를 기댔다. 둘은 서로의 걱정을 이야기하며 빠져나갈 방법을 궁리했다. 하지만 성에서 빠져나갈 방법은 찾을 수 없었다. 성은 늘 노란 윙키들이 지키고 있었는데, 그들은 나쁜 마녀의 노예였고 마녀가 너무 무서워서 시키는 대로 할 수밖에 없었다.`],
[`12-67`, `소녀는 낮 동안 고되게 일해야 했다. 마녀는 늘 손에 들고 다니는 낡은 우산으로 도로시를 때리겠다고 자주 을러댔다. 하지만 사실 마녀는 도로시 이마의 자국 때문에 감히 도로시를 때리지 못했다. 아이는 그것을 몰랐기 때문에 자기와 토토가 어떻게 될까 몹시 두려웠다. 한 번은 마녀가 우산으로 토토를 때렸는데, 용감한 꼬마 개는 마녀에게 달려들어 다리를 물어 되갚아 주었다. 마녀는 물린 곳에서 피가 나지 않았다. 너무 못된 나머지 몸속의 피가 여러 해 전에 다 말라 버렸기 때문이다.`],
[`12-68`, `도로시는 캔자스와 엠 아주머니에게 돌아가는 일이 그 어느 때보다 어려워졌다는 것을 깨닫자 무척 슬퍼졌다. 때로는 몇 시간이고 서럽게 울었다. 그럴 때면 토토는 발치에 앉아 도로시의 얼굴을 올려다보며, 어린 주인이 얼마나 안쓰러운지 보여 주려는 듯 서글프게 낑낑거렸다. 토토는 도로시만 곁에 있다면 캔자스에 있든 오즈 나라에 있든 사실 상관없었다. 하지만 어린 소녀가 불행하다는 것을 알았기에 토토도 불행했다.`],
[`12-69`, `그런데 나쁜 마녀는 소녀가 늘 신고 있는 은 구두를 몹시 갖고 싶었다. 벌과 까마귀와 늑대는 무더기로 쓰러져 말라 가고 있었고, 황금 모자의 힘도 다 써 버렸다. 하지만 은 구두만 손에 넣을 수 있다면, 잃어버린 다른 모든 것보다 더 큰 힘을 얻을 수 있을 터였다. 마녀는 도로시가 혹시 구두를 벗는지 유심히 지켜보았다. 훔칠 생각이었다. 하지만 아이는 예쁜 구두가 너무 자랑스러워서 밤에 잘 때와 목욕할 때 말고는 절대 벗지 않았다. 마녀는 어둠을 너무 무서워해서 밤에 도로시 방에 들어가 구두를 가져갈 엄두를 내지 못했다. 그리고 물을 무서워하는 마음은 어둠을 무서워하는 마음보다 더 커서, 도로시가 목욕할 때는 근처에도 오지 않았다. 사실 늙은 마녀는 한 번도 물을 만진 적이 없었고, 물이 자기 몸에 닿게 한 적도 없었다.`],
[`12-70`, `하지만 그 못된 마녀는 무척 교활해서, 마침내 원하는 것을 얻을 꾀를 생각해 냈다. 마녀는 부엌 바닥 한가운데에 쇠막대를 놓고, 마법을 부려 사람 눈에 보이지 않게 만들었다. 그래서 도로시는 바닥을 가로지르다가 보이지 않는 막대에 걸려 넘어지고 말았다. 크게 다치지는 않았지만, 넘어지는 바람에 은 구두 한 짝이 벗겨졌다. 그리고 도로시가 손을 뻗기도 전에 마녀가 구두를 낚아채 자기의 앙상한 발에 신어 버렸다.`],
[`12-71`, `못된 마녀는 꾀가 성공해서 무척 기뻤다. 구두 한 짝만 가지고 있어도 마법의 힘을 절반은 갖게 되는 데다, 도로시가 설령 쓰는 법을 안다 해도 그 힘을 마녀에게 쓸 수 없을 테니까.`],
[`12-72`, `예쁜 구두 한 짝을 잃어버린 것을 안 어린 소녀는 화가 나서 마녀에게 말했다. “내 구두 돌려줘!”`],
[`12-73`, `“싫다.” 마녀가 맞받았다. “이제 내 구두지, 네 것이 아니야.”`],
[`12-74`, `“당신은 정말 못됐어!” 도로시가 외쳤다. “당신은 내 구두를 가져갈 권리가 없어.”`],
[`12-75`, `“그래도 내가 가질 거다.” 마녀가 도로시를 비웃으며 말했다. “그리고 언젠가 나머지 한 짝도 빼앗을 거다.”`],
[`12-76`, `이 말에 도로시는 몹시 화가 나서, 곁에 있던 물 양동이를 집어 들어 마녀에게 끼얹었다. 마녀는 머리부터 발끝까지 흠뻑 젖었다.`],
[`12-77`, `그 순간 못된 마녀는 겁에 질려 크게 비명을 질렀다. 그리고 도로시가 놀라서 바라보는 사이, 마녀가 쪼그라들며 무너져 내리기 시작했다.`],
[`12-78`, `“네가 무슨 짓을 했는지 봐라!” 마녀가 소리쳤다. “조금 있으면 나는 녹아 없어질 거야.”`],
[`12-79`, `“정말 미안해요.” 도로시가 말했다. 마녀가 눈앞에서 정말로 흑설탕처럼 녹아내리는 것을 보고 도로시는 진심으로 겁이 났다.`],
[`12-80`, `“물이 내 끝장이라는 걸 몰랐느냐?” 마녀가 울부짖듯 절망한 목소리로 물었다.`],
[`12-81`, `“당연히 몰랐죠.” 도로시가 대답했다. “제가 어떻게 알아요?”`],
[`12-82`, `“흠, 몇 분만 지나면 나는 다 녹아 버리고, 이 성은 네 차지가 되겠구나. 나는 평생 못된 짓을 했지만, 너 같은 꼬마 계집아이가 나를 녹여 내 못된 짓을 끝내게 될 줄은 꿈에도 몰랐다. 조심해라, 이제 간다!”`],
[`12-83`, `이 말과 함께 마녀는 형체 없는 갈색 덩어리로 녹아내려 깨끗한 부엌 바닥으로 번져 나갔다. 마녀가 정말로 녹아서 아무것도 남지 않은 것을 보자, 도로시는 물을 한 양동이 더 길어 와 그 위에 끼얹었다. 그리고 모두 문밖으로 쓸어 냈다. 늙은 여자가 남긴 것이라고는 은 구두 한 짝뿐이었다. 도로시는 그것을 주워 천으로 깨끗이 닦아 말린 다음 다시 발에 신었다. 그러고는 마침내 마음대로 할 수 있게 되었기에, 마당으로 달려가 사자에게 서쪽의 나쁜 마녀가 끝장났으며 이제 낯선 땅의 포로 신세에서 벗어났다고 알렸다.`],
[`h`, `원작 13장 「구출」`],
[`13-1`, `나쁜 마녀가 물 한 양동이에 녹아 버렸다는 말을 듣고 겁쟁이 사자는 무척 기뻐했다. 도로시는 곧바로 사자가 갇힌 곳의 문을 열어 풀어 주었다. 둘은 함께 성 안으로 들어갔고, 도로시가 맨 먼저 한 일은 윙키들을 모두 불러 모아 이제 노예가 아니라고 알려 준 것이었다.`],
[`13-2`, `노란 윙키들은 크게 기뻐했다. 여러 해 동안 늘 잔인하게 대하던 나쁜 마녀를 위해 고되게 일해야 했기 때문이다. 윙키들은 그날을 축제일로 정해, 그 뒤로도 해마다 잔치를 열고 춤을 추며 보냈다.`],
[`13-3`, `“우리 친구 허수아비와 양철 나무꾼만 함께 있다면,” 사자가 말했다. “정말 행복할 텐데.”`],
[`13-4`, `“우리가 구할 수 있지 않을까?” 소녀가 걱정스럽게 물었다.`],
[`13-5`, `“해 볼 수는 있지.” 사자가 대답했다.`],
[`13-6`, `그래서 둘은 노란 윙키들을 불러 친구들을 구하는 일을 도와주겠느냐고 물었다. 윙키들은 자기들을 노예 신세에서 풀어 준 도로시를 위해서라면 무엇이든 기꺼이 하겠다고 했다. 그래서 도로시는 가장 아는 것이 많아 보이는 윙키 여럿을 골랐고, 모두 함께 길을 떠났다. 그날 하루와 이튿날 한나절을 가서야 양철 나무꾼이 온통 찌그러지고 구부러진 채 누워 있는 바위 벌판에 이르렀다. 도끼가 곁에 있었지만 날은 녹슬었고 자루는 짧게 부러져 있었다.`],
[`13-7`, `윙키들은 나무꾼을 조심스럽게 안아 들고 노란 성으로 돌아갔다. 가는 동안 도로시는 옛 친구의 딱한 모습에 눈물을 몇 방울 흘렸고, 사자는 침울하고 슬픈 얼굴이었다. 성에 도착하자 도로시가 윙키들에게 말했다.`],
[`13-8`, `“여러분 가운데 양철공이 있나요?”`],
[`13-9`, `“아, 그럼요. 아주 솜씨 좋은 양철공들이 있어요.” 윙키들이 말했다.`],
[`13-10`, `“그럼 데려와 주세요.” 도로시가 말했다. 양철공들이 연장을 바구니에 담아 오자 도로시가 물었다. “양철 나무꾼의 찌그러진 곳을 펴고, 다시 원래 모양으로 구부리고, 부러진 곳을 땜질해 붙일 수 있나요?”`],
[`13-11`, `양철공들은 나무꾼을 꼼꼼히 살펴보더니, 전처럼 멀쩡하게 고칠 수 있을 것 같다고 대답했다. 그래서 그들은 성의 커다란 노란 방 하나에서 일을 시작했다. 사흘 낮 나흘 밤 동안 나무꾼의 다리와 몸통과 머리를 망치로 두드리고 비틀고 구부리고 땜질하고 닦고 다듬은 끝에, 마침내 나무꾼은 예전 모습으로 펴졌고 마디도 전처럼 잘 움직였다. 물론 여기저기 덧댄 자국이 있었지만, 양철공들은 일을 잘해 주었다. 게다가 나무꾼은 허영심 많은 사람이 아니었기에 덧댄 자국을 조금도 신경 쓰지 않았다.`],
[`13-12`, `마침내 나무꾼이 도로시의 방으로 걸어 들어와 구해 줘서 고맙다고 말했을 때, 그는 너무 기뻐서 기쁨의 눈물을 흘렸다. 도로시는 마디가 녹슬지 않도록 앞치마로 그의 얼굴에서 눈물을 한 방울 한 방울 조심스럽게 닦아 주어야 했다. 그와 함께 옛 친구를 다시 만난 기쁨에 도로시 자신의 눈물도 쉴 새 없이 흘러내렸지만, 그 눈물은 닦지 않아도 괜찮았다. 사자는 꼬리 끝으로 어찌나 자주 눈물을 닦았는지 꼬리가 흠뻑 젖어서, 마당에 나가 꼬리를 햇볕에 들고 말려야 했다.`],
[`13-13`, `“허수아비만 다시 함께 있다면,” 도로시가 그동안 있었던 일을 모두 이야기해 주자 양철 나무꾼이 말했다. “정말 행복할 텐데요.”`],
[`13-14`, `“허수아비도 꼭 찾아야 해.” 소녀가 말했다.`],
[`13-15`, `그래서 도로시는 윙키들에게 도움을 청했고, 일행은 그날 하루와 이튿날 한나절을 걸어서, 날개 달린 원숭이들이 허수아비의 옷을 던져 놓은 키 큰 나무에 이르렀다.`],
[`13-16`, `아주 키가 큰 나무였고, 줄기가 너무 매끄러워서 아무도 기어오를 수 없었다. 하지만 나무꾼이 곧바로 말했다. “제가 베어 쓰러뜨릴게요. 그러면 허수아비의 옷을 가져올 수 있어요.”`],
[`13-17`, `그런데 양철공들이 나무꾼을 고치는 동안, 금세공인인 또 다른 윙키가 순금으로 도끼 자루를 만들어 부러진 옛 자루 대신 나무꾼의 도끼에 끼워 주었다. 다른 윙키들은 녹이 다 벗겨질 때까지 도끼날을 닦아, 날은 잘 닦은 은처럼 반짝였다.`],
[`13-18`, `말을 마치자마자 양철 나무꾼은 도끼질을 시작했고, 얼마 지나지 않아 나무가 쿵 하고 쓰러졌다. 그러자 허수아비의 옷이 가지에서 떨어져 땅 위로 굴렀다.`],
[`13-19`, `도로시는 옷을 주워 윙키들에게 성으로 가져가게 했다. 성에서 옷에 깨끗하고 좋은 짚을 채우자, 보라! 허수아비가 원래대로 멀쩡하게 서서, 구해 줘서 고맙다고 몇 번이고 인사하는 것이었다.`],
[`13-20`, `다시 모두 모이게 된 도로시와 친구들은 노란 성에서 며칠 동안 행복하게 지냈다. 그곳에는 편히 지내는 데 필요한 것이 모두 있었다.`],
[`13-21`, `그러던 어느 날 소녀가 엠 아주머니를 떠올리며 말했다. “오즈님께 돌아가서 약속을 지켜 달라고 해야 해.”`],
[`13-22`, `“그래요.” 나무꾼이 말했다. “마침내 심장을 얻게 되겠군요.”`],
[`13-23`, `“그리고 나는 뇌를 얻겠지요.” 허수아비가 기뻐하며 덧붙였다.`],
[`13-24`, `“그리고 나는 용기를 얻겠지.” 사자가 생각에 잠겨 말했다.`],
[`13-25`, `“그리고 나는 캔자스로 돌아가는 거야.” 도로시가 손뼉을 치며 외쳤다. “아, 내일 에메랄드 시로 떠나자!”`],

   l: `문을 연 나는 놀라 탄성을 질렀다. 집은 경이로울 만큼 아름다운 나라 한가운데에 내려앉아 있었다. 초록 풀밭과 탐스러운 열매를 단 나무들, 사방에 핀 화려한 꽃, 눈부신 깃털의 새들. 졸졸 흐르는 시냇물 소리가 메마른 잿빛 대초원에서 살아온 내게는 무척 고맙게 들렸다.`},
  {w: `dorothy`, in: 1, f: `dorothy_surprised`, o: `munchkin`, bk: [`2-4`, `2-5`],

   l: `그때 지금껏 본 가운데 가장 별난 사람들이 다가왔다. 키는 나와 비슷했지만 생김새는 훨씬 나이 들어 보였다. 끝이 뾰족한 둥근 모자 챙에는 작은 방울들이 달려 딸랑거렸다. 세 남자는 모자부터 장화까지 파란색이었고, 주름투성이 작은 할머니는 별이 흩뿌려진 하얀 드레스를 입고 있었다.`},
  {w: `northwitch`, f: `dorothy_surprised`, o: `northwitch`, bk: [`2-6`, `2-7`],
   e: `할머니가 나에게 허리를 깊이 숙여 인사했어. "가장 고귀하신 마법사님, 먼치킨 나라에 오신 걸 환영합니다. 동쪽의 나쁜 마녀를 없애 주셔서 정말 고맙습니다!"`,
   l: `작은 할머니가 내게 걸어와 허리를 깊이 숙이고 다정한 목소리로 말했다. "가장 고귀하신 마법사님, 먼치킨 나라에 오신 것을 환영합니다. 동쪽의 나쁜 마녀를 없애 주시고, 우리 백성을 노예 신세에서 풀어 주셔서 정말 고맙습니다."`},
  {w: `dorothy`, in: 1, f: `dorothy_surprised`, o: `northwitch`, bk: [`2-8`],

   l: `이 작은 여자는 대체 무슨 뜻으로 나를 마법사라 부르고, 내가 동쪽의 나쁜 마녀를 없앴다고 하는 걸까? 나는 회오리바람에 실려 온 순진한 어린 소녀일 뿐이었다. 태어나서 무엇 하나 죽여 본 적이 없었다.`},

   opts: [
    {type: `canon`, go: `c4a`, e: `"고맙지만 잘못 아신 것 같아요. 저는 아무것도 죽이지 않았어요."`, l: `"친절하시지만 착오가 있는 것 같아요. 저는 아무것도 죽이지 않았어요."`, s: {e: `솔직하게 아니라고 말함`, l: `정직하게 오해를 바로잡음`}},

  {t: `goto`, to: `m4`},
  {id: `c4b`, w: `dorothy`, f: `dorothy_brave`, o: `munchkin`,
   e: `"저… 무슨 일이 있었는지 먼저 말씀해 주실래요?" 내가 묻자 파란 옷 아저씨들이 서로 눈치를 보더니, 한 사람이 조심스럽게 내 집 모퉁이를 가리켰어.`,

  {w: `munchkin`, f: `dorothy_surprised`, o: `munchkin`,

   l: `"아가씨의 집이 하늘에서 떨어졌답니다. 바로 저기로요." 모르는 것을 솔직히 묻자, 먼치킨들은 경계를 풀고 한 걸음 다가왔다.`},

  {id: `c4c`, w: `dorothy`, f: `dorothy_happy`, o: `munchkin`, fx: `dream`,

  {w: `dorothy`, f: `dorothy_sad`, o: `northwitch`, bk: [`2-9`],
