  {id: `m4`, w: `northwitch`, f: `dorothy_surprised`, o: `northwitch`, bk: [`2-10`, `2-11`], cam: `left`,
   e: `"어쨌든 아가씨의 집이 그랬지요. 보세요!" 할머니가 집 모퉁이를 가리켰어. 집 밑으로… 은 구두를 신은 두 발이 삐죽 나와 있었어!`,
   l: `"어쨌든 아가씨의 집이 그랬지요. 그게 그거랍니다. 보세요!" 할머니가 집 모퉁이를 가리켰다. 정말로 집을 떠받친 커다란 들보 밑으로, 앞코가 뾰족한 은 구두를 신은 두 발이 삐죽 나와 있었다.`},
  {w: `dorothy`, f: `dorothy_surprised`, o: `northwitch`, bk: [`2-12`, `2-13`], cam: `shake`,
   e: `"어머나, 어쩌면 좋아! 집이 저 사람 위로 떨어졌나 봐요. 이제 어떡해요?" "어떻게 할 일은 없답니다." 할머니는 차분하게 말했어.`,
   l: `"어머나, 어쩜 좋아!" 나는 두 손을 맞잡으며 소리쳤다. "집이 저 사람 위로 떨어졌나 봐요. 이제 어떡하죠?" "어떻게 할 일은 없답니다." 작은 여자가 차분하게 대답했다.`},
  {w: `northwitch`, f: `dorothy_surprised`, o: `northwitch`, bk: [`2-15`, `2-19`],
   e: `할머니가 설명해 주었어. 그건 먼치킨들을 오랫동안 노예처럼 부려 먹던 동쪽의 나쁜 마녀였대. 그리고 할머니는 북쪽에 사는 착한 마녀였어!`,
   l: `할머니의 말에 따르면, 그것은 오랫동안 먼치킨들을 노예로 부리며 밤낮으로 일을 시키던 동쪽의 나쁜 마녀였다. 그리고 할머니 자신은 먼치킨들의 친구이자, 북쪽 나라에 사는 북쪽 마녀였다.`},
  {w: `northwitch`, f: `dorothy_surprised`, o: `northwitch`, bk: [`2-23`, `2-31`],
   e: `"오즈 나라에는 마녀가 넷 있었어요. 북쪽과 남쪽은 착한 마녀, 동쪽과 서쪽은 나쁜 마녀. 이제 나쁜 마녀는 서쪽에 하나 남았지요. 그리고 우리 모두보다 힘이 센 위대한 마법사, 오즈님이 에메랄드 시에 사신답니다."`,
   l: `"오즈 나라 전체에 마녀는 넷뿐이었어요. 북쪽과 남쪽의 둘은 착한 마녀, 동쪽과 서쪽의 둘은 나쁜 마녀였지요. 이제 나쁜 마녀는 서쪽에 사는 하나뿐이랍니다." 그리고 마녀는 목소리를 낮춰 속삭였다. "위대한 마법사는 오즈님이세요. 우리 모두를 합친 것보다 힘이 세시지요. 에메랄드 시에 사신답니다."`},
  {w: `munchkin`, f: `dorothy_surprised`, o: `munchkin`, bk: [`2-32`, `2-33`], cam: `left`,
   e: `그때 먼치킨들이 "앗!" 하고 소리쳤어. 마녀의 두 발이 감쪽같이 사라지고, 은 구두만 덩그러니 남아 있었어!`,
   l: `그때 옆에서 말없이 서 있던 먼치킨들이 큰 소리를 지르며 집 모퉁이를 가리켰다. 죽은 마녀의 두 발은 감쪽같이 사라지고, 은 구두만 남아 있었다.`},
  {w: `northwitch`, f: `dorothy_surprised`, o: `northwitch`, bk: [`2-34`, `2-35`], eff: {item: `silverShoes`},
   e: `"마녀가 너무 늙어서 햇볕에 바싹 말라 버렸군요. 은 구두는 아가씨 거예요. 신도록 해요." 먼치킨 한 명이 덧붙였어. "그 구두엔 무슨 마법이 있대요. 그게 뭔지는 아무도 몰라요."`,
   l: `"너무 늙어서 햇볕에 금세 말라 버린 거예요. 이걸로 끝이지요. 하지만 은 구두는 아가씨 것이니 신도록 해요." 마녀가 구두의 먼지를 털어 건네주었다. 먼치킨 하나가 말했다. "동쪽 마녀는 그 구두를 무척 자랑스러워했어요. 무슨 마법이 깃들어 있다던데, 그게 뭔지는 끝내 알지 못했지요."`},
  {w: `dorothy`, in: 1, f: `dorothy_dreamy`, bk: [`2-36`],

   l: `나는 구두를 집 안으로 가져가 식탁 위에 올려놓았다. 은빛으로 반짝이는 구두였지만, 지금 내게 중요한 것은 따로 있었다.`},

  {id: `s1`, bg: `ch4`, w: `dorothy`, in: 1, f: `dorothy_sad`, o: `toto`, bk: [`6-1`, `6-2`],
   e: `숲은 점점 깊어졌어. 길에는 마른 가지와 낙엽이 잔뜩 덮여 있었어. 이따금 나무 사이에서 "그르르…" 사나운 짐승 소리가 들렸어. 토토는 짖지도 않고 내 옆에 바짝 붙어 걸었어.`,
   l: `우리는 빽빽한 숲속을 걷고 있었다. 노란 벽돌 위로 마른 가지와 낙엽이 잔뜩 덮여 걷기가 고되었다. 새는 거의 없었고, 이따금 나무 사이에 숨은 짐승이 낮게 으르렁거렸다. 그 소리에 내 가슴은 두근거렸다. 토토는 무엇인지 아는 듯 짖지도 않고 내 곁에 바짝 붙어 걸었다.`},

   l: `"저는 기름통만 있으면 무섭지 않고, 허수아비는 아무것도 다치게 할 수 없어요. 아가씨는 이마에 착한 마녀의 입맞춤 자국이 있으니 그게 지켜 줄 거예요." "하지만 토토는요! 토토는 무엇이 지켜 줘요?" 내가 걱정스레 묻자 나무꾼이 답했다. "토토가 위험에 빠지면 우리가 직접 지켜야지요."`},
  {w: `dorothy`, in: 1, f: `dorothy_surprised`, o: `lion`, bk: [`6-7`], cam: `shake`,

   l: `그 순간 숲에서 무시무시한 포효가 울리더니 커다란 사자가 길로 뛰어들었다. 사자는 앞발 한 번에 허수아비를 길가로 굴려 버리고 날카로운 발톱으로 나무꾼을 내리쳤다. 나무꾼은 쓰러졌지만 양철에는 자국 하나 나지 않았다. 토토가 짖으며 달려들자, 거대한 짐승이 토토를 물려고 입을 쩍 벌렸다.`},

   l: `토토가 죽을까 겁이 난 나는 위험도 잊고 뛰어나가 있는 힘껏 사자의 코를 때렸다. "감히 토토를 물기만 해 봐! 부끄러운 줄 알아야지. 너처럼 덩치 큰 짐승이 불쌍한 작은 개를 물다니!"`},

  {id: `m1`, w: `lion`, f: `dorothy_brave`, o: `lion`, bk: [`6-10`, `6-11`, `6-12`],

   l: `"물지 않았어." 사자가 앞발로 코를 문지르며 말했다. "그래, 하지만 물려고 했잖아. 너는 그냥 덩치만 큰 겁쟁이야." 사자는 부끄러워 고개를 푹 숙였다. "알아. 나도 늘 알고 있었어. 하지만 어쩔 수가 없는걸."`},
  {w: `lion`, f: `dorothy_surprised`, o: `lion`, bk: [`6-14`, `6-17`, `6-18`, `6-21`, `6-22`],

   l: `내가 허수아비를 일으켜 모양을 잡아 주고 나무꾼을 세우자 사자가 놀라워했다. 짚이라서 그리 쉽게 굴렀고, 양철이라서 발톱이 오싹했던 것이다. 토토가 살로 된 개라는 말에 사자는 슬프게 말했다. "지금 보니 정말 작네. 이렇게 작은 걸 물 생각을 하는 건 나 같은 겁쟁이밖에 없을 거야."`},
  {w: `lion`, f: `dorothy_sad`, o: `lion`, bk: [`6-24`, `6-26`],

   l: `"어쩌면 심장병이 있는지도 몰라요." 나무꾼이 말했다. "그렇다면 기뻐해야 해요. 심장이 있다는 증거니까요. 저는 심장이 없어서 심장병에도 걸릴 수 없어요." 사자가 생각에 잠겨 말했다. "어쩌면 심장이 없다면 겁쟁이가 되지 않았을지도 몰라."`},

  {id: `c2a`, w: `lion`, f: `dorothy_happy`, o: `lion`, bk: [`6-41`, `6-42`],
   e: `"정말 환영이야! 네가 다른 짐승들을 쫓아 줄 테니까. 너한테 그렇게 쉽게 겁먹다니, 그 짐승들이 너보다 더 겁쟁이인가 봐." "정말 그래. 하지만 그렇다고 내가 용감해지는 건 아니야."`,

  {bg: `ch4_bridge`, w: `lion`, f: `dorothy_surprised`, o: `lion`, bk: [`7-19`, `7-21`],

  {id: `m3`, w: `tinman`, f: `dorothy_sad`, o: `tinman`, bk: [`8-45`, `8-46`],

  {id: `c4b`, w: `tinman`, f: `dorothy_sad`, o: `tinman`,

  /* ---------- 잠든 사이에 (허수아비가 들려준 이야기) ---------- */
  {id: `m4`, w: `dorothy`, in: 1, f: `dorothy_dreamy`, bk: [`8-47`, `8-48`, `8-49`],
   e: `(여기서부터는 내가 잠든 사이에 있었던 일이야. 나중에 허수아비가 들려주었어.) 사자가 말했대. "여기 두면 도로시는 죽을 거야. 나도 눈을 뜨기가 힘들고, 토토는 벌써 잠들었어." 하지만 짚과 양철로 된 두 친구는 꽃향기가 하나도 상관없었대!`,
   l: `(이제부터는 내가 잠든 사이의 일이다. 훗날 허수아비가 들려주었다.) "여기 두고 가면 도로시는 죽을 거야." 사자가 말했다. "꽃향기가 우리 모두를 죽이고 있어. 나도 눈을 뜨기 힘들고, 개는 벌써 잠들었어." 하지만 살로 만들어지지 않은 허수아비와 나무꾼은 꽃향기에 아무렇지도 않았다.`},
  {w: `scarecrow`, f: `dorothy_dreamy`, o: `scarecrow`, bk: [`8-50`, `8-51`, `8-52`],
   e: `허수아비가 말했대. "사자, 빨리 달려서 꽃밭을 빠져나가요! 사자가 잠들면 너무 커서 옮길 수가 없어요. 도로시는 우리가 데려갈게요." 그리고 나무꾼이랑 손을 엮어 의자를 만들어서, 토토를 무릎에 올린 나를 태우고 꽃밭을 건넜대.`,
   l: `"빨리 달려요." 허수아비가 사자에게 말했다. "최대한 빨리 이 죽음의 꽃밭에서 빠져나가요. 도로시는 우리가 데려갈게요. 하지만 사자가 잠들면 너무 커서 옮길 수가 없어요." 사자가 뛰어가자 허수아비가 말했다. "우리 손으로 의자를 만들어 옮겨요." 둘은 토토를 내 무릎에 올리고, 손으로 자리를, 팔로 팔걸이를 만들어 나를 태우고 꽃밭을 건넜다.`},
  {w: `tinman`, f: `dorothy_sad`, o: `lion`, bk: [`8-53`, `8-54`, `8-55`],
   e: `한참을 가다 보니, 꽃밭이 끝나기 바로 몇 걸음 앞에서 사자가 쓰러져 잠들어 있었대. "너무 무거워서 들 수가 없어요. 어쩌면 마침내 용기를 찾은 꿈을 꿀지도 모르지요." 나무꾼이 슬프게 말했대.`,
   l: `강이 굽은 대로 가다 보니, 양귀비 꽃밭이 끝나기 몇 걸음 앞에서 사자가 깊이 잠들어 있었다. 꽃의 힘은 그 거대한 짐승에게도 너무 강했다. "사자를 위해 할 수 있는 일은 없어요. 너무 무거워서 들 수가 없으니까요." 나무꾼이 슬프게 말했다. "어쩌면 마침내 용기를 찾은 꿈을 꿀지도 모르지요."`},
  {bg: `ch5_meadow`, w: `tinman`, f: `dorothy_dreamy`, o: `mousequeen`, bk: [`8-56`, `9-2`, `9-3`], cam: `shake`,
   e: `둘은 나를 꽃밭에서 멀리 떨어진 강가 풀밭에 눕혔대. 그때! 커다란 노란 살쾡이가 작은 회색 들쥐를 쫓아 달려왔대. 나무꾼은 심장이 없어도, 그게 잘못된 일이라는 걸 알았대. 나무꾼이 도끼를 휘둘러 들쥐를 구해 줬대!`,
   l: `둘은 나를 꽃밭에서 충분히 떨어진 강가 풀밭에 눕혔다. 그때 커다란 노란 살쾡이가 작은 회색 들쥐를 쫓아 풀밭을 달려왔다. 나무꾼은 심장이 없었지만, 살쾡이가 그토록 예쁘고 해롭지 않은 생명을 죽이려는 것은 잘못이라는 것을 알았다. 그는 도끼를 들어 재빨리 내리쳤다.`},
  {w: `mousequeen`, f: `dorothy_dreamy`, o: `mousequeen`, bk: [`9-5`, `9-6`, `9-7`, `9-9`],
   e: `"고마워요! 제 목숨을 구해 주셨어요!" "그런 말씀 마세요. 저는 심장이 없어서, 친구가 필요한 이는 누구든 도우려고 조심해요. 생쥐 한 마리라도요." "생쥐 한 마리라니요! 나는 모든 들쥐의 여왕이에요!"`,
   l: `"아, 고마워요! 제 목숨을 구해 주셔서." "그런 말씀 마세요." 나무꾼이 대답했다. "저는 심장이 없어서, 친구가 필요할지 모르는 이는 누구든 도우려고 조심하거든요. 그게 생쥐 한 마리라도요." "생쥐 한 마리라니요!" 작은 동물이 화를 냈다. "나는 모든 들쥐의 여왕이에요! 당신은 용감할 뿐 아니라 위대한 일을 한 거예요."`},

  {w: `scarecrow`, f: `dorothy_dreamy`, o: `scarecrow`, bk: [`9-18`, `9-19`, `9-21`, `9-23`],

   l: `가장 큰 생쥐가 은혜를 갚을 방법을 묻자, 허수아비가 재빨리 말했다. "아, 있어요! 양귀비 꽃밭에서 잠든 우리 친구 겁쟁이 사자를 구해 줄 수 있어요." "사자라니! 우리를 다 잡아먹을 거예요." "아니요, 이 사자는 겁쟁이예요. 그리고 우리 친구라면 절대로 해치지 않을 거예요. 사자가 여러분 모두에게 친절하게 대하겠다고 약속할게요."`},
  {w: `scarecrow`, f: `dorothy_dreamy`, o: `scarecrow`, bk: [`9-25`, `9-26`, `9-27`, `9-29`, `9-30`],

   l: `"여왕님을 따르는 생쥐들이 많나요?" "수천 마리가 있지요." "그럼 모두 최대한 빨리 이리로 오라고 하세요. 그리고 저마다 기다란 끈을 하나씩 가져오라고 하세요." 그러고는 나무꾼에게 말했다. "강가의 나무로 사자를 실을 수레를 만들어요." 나무꾼은 나뭇가지와 나무못, 통나무를 잘라 만든 바퀴 네 개로 금세 수레를 완성했다.`},

   note: {e: `작은 생쥐 수천 마리 + 끈 + 수레! 아무도 생각 못 한 방법을 허수아비가 생각해 냈어요. 이게 바로 생각하는 힘이에요. 힘 카드를 얻었어요.`, l: `원작은 허수아비가 "짚 때문에 생각하려 애써도 잘 안 됐다"고 쓰지만, 수천 마리의 힘을 모으는 계획은 그의 것이었습니다. 작가의 반어를 눈여겨봅시다.`},

   l: `바로 그 무렵 나는 긴 잠에서 깨어났다. 풀밭에 누운 내 주위에 수천 마리 생쥐가 서서 수줍게 나를 바라보고 있었다. 허수아비가 모든 일을 이야기해 주고는 위엄 있는 작은 생쥐를 돌아보며 말했다. "여왕 폐하를 소개해 드리지요."`},

        `원작 결말과 내가 만난 결말을 비교하고, 그 차이를 만든 선택이 무엇이었는지 설명해 봅시다.`]

  /* ---------- 깨어난 사자 ---------- */

   l: `한참 뒤 깨어난 사자는 자기가 살아 있다는 것을 알고 무척 기뻐했다. 들쥐들이 너그럽게 자신을 구했다는 말을 듣자 사자는 웃었다. "나는 늘 내가 아주 크고 무시무시하다고 생각했어. 그런데 꽃처럼 작은 것이 나를 죽일 뻔했고, 생쥐처럼 작은 동물들이 내 목숨을 구했구나. 정말 이상한 일이야!"`},
  {bg: `ch6`, w: `dorothy`, in: 1, f: `dorothy_happy`, o: `scarecrow`, bk: [`10-6`, `10-7`, `10-8`, `10-9`],
   e: `다시 노란 벽돌 길을 찾았어! 길은 매끄럽고 땅은 아름다웠어. 이번엔 울타리도 집도 다 초록색이야. 사람들도 에메랄드빛 초록 옷을 입고 있었어. "먼치킨 나라는 파랑, 여기는 초록이네요. 에메랄드 시가 가까운가 봐요." 그런데 사람들이 사자를 무서워해서 말을 걸지 않았어.`,
   l: `노란 벽돌 길을 다시 찾았다. 길은 잘 닦여 있었고 땅은 아름다웠다. 이번에는 울타리도 농가도 초록색이었고, 사람들은 에메랄드빛 초록 옷에 먼치킨처럼 뾰족한 모자를 쓰고 있었다. "여기가 오즈의 나라인가 봐." 내 말에 허수아비가 답했다. "먼치킨 나라는 파란색, 여기는 초록색이네요. 하지만 사람들이 먼치킨만큼 친절해 보이지 않아요." 사람들은 커다란 사자가 무서워 아무도 다가오지 않았다.`},

   opts: [

    {type: `imag`, go: `c1c`, eff: {album: `tailBow`}, e: `사자에게 꼬리로 인사하는 재주를 부려 보라고 한다.`, l: `사자에게 꼬리 인사를 해 보라고 한다.`, s: {e: `꼬리 인사를 시킴`, l: `꼬리 인사`}}

  {id: `c1a`, w: `farmwife`, f: `dorothy_happy`, o: `farmwife`, bk: [`10-13`, `10-14`, `10-15`, `10-16`],

   l: `"허락해 주신다면 하룻밤 묵고 싶어요. 그리고 사자는 제 친구이자 동료예요. 절대로 아주머니를 해치지 않을 거예요." "길들여진 사자니?" "네, 게다가 엄청난 겁쟁이예요. 아주머니가 사자를 무서워하는 것보다 사자가 아주머니를 더 무서워할걸요." 여자는 사자를 한 번 더 엿보고는 말했다. "그렇다면 들어와도 좋아. 저녁도 주고 잘 곳도 내주마."`},

   l: `"사자야, 꼬리 인사!" 사자가 쑥스러운 듯 꼬리 끝을 흔들다 제 꼬리에 놀라 펄쩍 뛰었다. 여자가 웃음을 터뜨리며 문을 열었다. "저렇게 겁 많은 사자라면 괜찮겠구나."`},
  {id: `m1`, bg: `ch6_farm`, w: `farmer`, f: `dorothy_surprised`, o: `farmer`, bk: [`10-17`, `10-20`, `10-22`, `10-24`],
   e: `집에는 다리를 다친 아저씨가 누워 있었어. 우리가 오즈님을 만나러 간다고 하자 아저씨가 놀랐어. "오즈가 만나 줄까? 나는 에메랄드 시에 여러 번 가 봤지만, 오즈를 본 사람은 하나도 몰라. 오즈는 궁전 안 알현실에만 있고, 시중드는 사람도 얼굴을 못 본대."`,
   l: `집 안에는 아이 둘과 다리를 다쳐 긴 의자에 누운 남자가 있었다. 우리가 오즈를 만나러 간다고 하자 남자가 외쳤다. "오즈가 너희를 만나 줄 거라고 확신하니? 오즈는 아무도 자기 앞에 들이지 않는다고들 해. 나는 에메랄드 시에 여러 번 가 봤지만 오즈를 본 사람은 하나도 몰라. 날마다 궁전의 알현실에 앉아 있고, 시중드는 이들조차 얼굴을 마주 보지 못한대."`},
  {w: `farmer`, f: `dorothy_surprised`, o: `farmer`, bk: [`10-26`],
   e: `"오즈는 위대한 마법사라서 원하는 모습은 뭐든 될 수 있대. 새, 코끼리, 고양이, 아름다운 요정… 진짜 오즈가 어떻게 생겼는지는 아무도 몰라."`,
   l: `"오즈는 위대한 마법사라서 원하는 모습은 무엇이든 될 수 있어. 어떤 이는 새 같다, 어떤 이는 코끼리 같다, 어떤 이는 고양이 같다고 하지. 아름다운 요정이나 꼬마 요정으로 나타나기도 한대. 하지만 진짜 오즈가 제 모습일 때 어떻게 생겼는지는 살아 있는 누구도 말할 수 없어."`},
  {w: `farmer`, f: `dorothy_happy`, o: `farmer`, bk: [`10-29`, `10-30`, `10-31`, `10-32`, `10-33`, `10-34`, `10-36`, `10-37`],
   e: `우리가 각자 소원을 말하자 아저씨가 말했어. "뇌? 오즈는 뇌가 남아돌아. 심장? 크기별로 잔뜩 모아 놨대. 용기? 황금 접시로 덮은 용기 단지가 있대." 그런데 캔자스는? "캔자스가 어디니?" "모르겠어요… 하지만 우리 집이에요. 틀림없이 어딘가에 있어요."`,
   l: `허수아비가 뇌를 원한다고 하자 남자는 오즈에게는 필요한 것보다 뇌가 더 많다고 했다. 나무꾼이 심장을 원하자 오즈는 크기와 모양이 가지각색인 심장을 잔뜩 모아 두었다고 했고, 사자가 용기를 원하자 알현실에 넘치지 않게 황금 접시로 덮은 용기 단지가 있다고 했다. 그런데 내가 캔자스로 돌아가고 싶다고 하자 남자가 놀라 물었다. "캔자스가 어디니?" "모르겠어요. 하지만 우리 집이에요. 틀림없이 어딘가에 있어요."`},
  {t: `name`, id: `N6`, key: `myWish`, free: true, max: 40, label: `내가 오즈에게 부탁하고 싶은 것`, f: `dorothy_dreamy`, o: `farmer`,
   q: {e: `✍️ 뇌, 심장, 용기, 집… 내가 위대한 오즈를 만난다면 무엇을 부탁하고 싶나요?`, l: `✍️ 내가 위대한 오즈 앞에 선다면, 무엇을 청하겠습니까?`},

  {w: `dorothy`, in: 1, f: `dorothy_dreamy`,

  {bg: `ch6_gate`, w: `dorothy`, in: 1, f: `dorothy_surprised`, bk: [`10-41`, `10-43`, `10-44`], cam: `up`,
   e: `다음 날 아침, 하늘 앞쪽이 아름다운 초록빛으로 빛났어. "저게 에메랄드 시인가 봐!" 오후가 되자 높고 두꺼운 초록 성벽이 나타났어. 노란 벽돌 길 끝에 에메랄드가 빽빽이 박힌 커다란 문이 있었는데, 허수아비의 그려 놓은 눈마저 눈이 부셨대!`,
   l: `이튿날 아침 바로 앞 하늘에서 아름다운 초록빛이 빛났다. "저게 에메랄드 시인가 봐." 오후가 되어서야 도시를 둘러싼 높고 두꺼운 초록 성벽에 이르렀다. 노란 벽돌 길이 끝나는 곳에 에메랄드가 빽빽이 박힌 커다란 문이 있었는데, 어찌나 반짝이는지 허수아비의 그려 놓은 눈마저 눈이 부셨다.`},
  {w: `guardian`, f: `dorothy_surprised`, o: `guardian`, bk: [`10-45`, `10-46`, `10-47`, `10-48`, `10-49`, `10-50`],
   e: `종을 누르자 문이 열렸어. 에메랄드로 반짝이는 방에 온통 초록색인 작은 남자가 서 있었어. 오즈님을 만나러 왔다고 하자 남자가 깜짝 놀라 털썩 앉았어. "그런 부탁은 여러 해 만에 처음이구나. 어리석은 볼일로 오즈님을 귀찮게 하면, 순식간에 너희를 없애 버리실지도 몰라."`,
   l: `종을 누르자 은방울 같은 소리와 함께 문이 열렸다. 에메랄드로 반짝이는 아치형 방에, 머리부터 발끝까지 초록이고 피부마저 초록빛이 도는 작은 남자가 서 있었다. 오즈님을 만나러 왔다는 말에 그는 놀라서 주저앉았다. "오즈님을 만나게 해 달라는 사람은 여러 해 만에 처음이로구나. 쓸데없거나 어리석은 볼일로 위대한 마법사를 방해하면, 화가 나셔서 순식간에 너희 모두를 없애 버리실지도 몰라."`},
  {w: `scarecrow`, f: `dorothy_brave`, o: `scarecrow`, bk: [`10-51`, `10-52`],

  {id: `m4`, w: `oz`, f: `dorothy_surprised`, o: `oz_head`, bk: [`11-31`, `11-32`, `11-33`, `11-34`, `11-35`, `11-36`],
   e: `"은 구두는 어디서 얻었느냐?" "동쪽 마녀한테서요. 우리 집이 떨어졌을 때요." "이마의 자국은?" "북쪽 착한 마녀님이 입 맞춰 주셨어요." "나에게 무엇을 바라느냐?" "캔자스로 돌려보내 주세요. 엠 아주머니가 몹시 걱정하고 계실 거예요."`,
   l: `"은 구두는 어디서 얻었느냐?" "동쪽의 나쁜 마녀에게서요. 우리 집이 마녀 위로 떨어졌을 때요." "이마의 자국은?" "북쪽의 착한 마녀님이 작별하며 입 맞춰 주신 자리예요." 눈은 내가 사실을 말한다는 것을 알아보았다. "무엇을 바라느냐?" "저를 엠 아주머니와 헨리 아저씨가 계신 캔자스로 돌려보내 주세요. 아주머니가 몹시 걱정하고 계실 거예요."`},
  {w: `oz`, f: `dorothy_surprised`, o: `oz_head`, bk: [`11-38`, `11-39`, `11-42`],
   e: `"내가 왜 너를 도와야 하느냐?" "오즈님은 강하고 저는 약하니까요." 그러자 오즈가 말했어. "이 나라에서는 누구든 얻는 것에 값을 치러야 한다. 나를 도우면 나도 너를 돕겠다."`,
   l: `"내가 왜 너를 위해 그렇게 해야 하느냐?" "오즈님은 강하고 저는 약하니까요." "하지만 너는 동쪽 마녀를 죽일 만큼 강했지." "그건 그냥 그렇게 된 거예요." 머리가 말했다. "이 나라에서는 누구든 얻는 모든 것에 값을 치러야 한다. 나를 도우면 나도 너를 돕겠다."`},
  {t: `choice`, id: `C5`, kind: `predict`, label: `오즈의 조건`, f: `dorothy_surprised`, o: `oz_head`,

  {id: `c5a`, w: `oz`, f: `dorothy_sad`, o: `oz_head`, bk: [`11-44`, `11-45`, `11-46`], cam: `shake`,
   e: `"서쪽의 나쁜 마녀를 없애라." "하지만 저는 못 해요!" "너는 동쪽 마녀를 없앴고, 강력한 마법이 깃든 은 구두를 신고 있다. 마녀가 사라졌다고 말할 수 있게 되면 너를 캔자스로 보내 주겠다. 그 전에는 안 된다."`,
   l: `"서쪽의 나쁜 마녀를 죽여라." "하지만 저는 못 해요!" "너는 동쪽 마녀를 죽였고, 강력한 마법이 깃든 은 구두를 신고 있다. 이제 나쁜 마녀는 하나만 남았다. 그 마녀가 죽었다고 말할 수 있게 되면 너를 캔자스로 돌려보내 주겠다. 하지만 그 전에는 안 된다."`},
  {w: `dorothy`, f: `dorothy_sad`, o: `oz_head`, bk: [`11-47`, `11-48`, `11-49`],
   e: `나는 울음을 터뜨렸어. "저는 한 번도 일부러 무엇을 해친 적이 없어요. 위대한 오즈님도 못 하시는 걸 어떻게 저한테 하라고 하세요?" "나도 모른다. 하지만 그게 내 대답이다. 이제 가라."`,
   l: `나는 너무 실망해 울기 시작했다. 눈이 다시 깜빡이더니 걱정스러운 듯 나를 바라보았다. "저는 한 번도 일부러 무엇을 죽인 적이 없어요. 위대하고 무시무시한 오즈님도 직접 못 하시는데, 어떻게 저한테 그걸 바라세요?" "나도 모른다. 하지만 그것이 내 대답이다. 이제 가라. 네 일을 해내기 전까지는 다시 나를 찾지 마라."`},
  {w: `dorothy`, in: 1, f: `dorothy_sad`, bk: [`11-50`, `11-51`],
   e: `방으로 돌아와서 나는 울다가 잠들었어. 내가 마녀를 없애야 집에 갈 수 있다니. 나는 그런 일은 절대 못 해.`,
   l: `"나에게는 희망이 없어." 나는 친구들에게 말했다. "오즈님은 내가 서쪽 마녀를 죽이기 전에는 집에 보내 주지 않으신대. 그런데 나는 그런 일은 절대 못 해." 친구들은 안타까워했지만 도울 수 없었다. 나는 방으로 가서 울다 잠들었다.`},

  {w: `scarecrow`, f: `dorothy_surprised`, o: `oz_lady`, bk: [`11-54`, `11-58`, `11-61`, `11-63`],
   e: `다음 날은 허수아비 차례였어. 허수아비가 돌아와서 말해 줬어. "오즈는 머리가 아니라 날개 달린 아름다운 숙녀였어요! 서쪽 마녀를 없애면 오즈 나라에서 제일 지혜로운 뇌를 준대요. 도로시한테 시킨 일 아니냐고 했더니, 누가 하든 상관없대요."`,
   l: `이튿날 허수아비가 불려 갔다. 그가 본 오즈는 초록 비단 망사 옷에 보석 왕관을 쓰고, 어깨에 화려한 날개가 돋은 아름다운 숙녀였다. "서쪽의 나쁜 마녀를 죽인다면 아주 많은 뇌를 주겠다. 오즈 나라에서 가장 지혜로운 사람이 될 것이다." 도로시에게 시킨 일이 아니냐고 묻자 숙녀는 말했다. "누가 죽이든 상관없다."`},
  {w: `scarecrow`, f: `dorothy_surprised`, o: `scarecrow`, bk: [`11-64`, `11-65`],
   e: `"그래도 그 숙녀도 나무꾼만큼 심장이 필요해 보였어요." 허수아비가 덧붙였어. 오즈가 머리가 아니라 숙녀였다니, 나는 깜짝 놀랐어.`,
   l: `내가 본 머리가 아니라 숙녀였다니 놀라웠다. "어쨌든," 허수아비가 말했다. "그 숙녀도 양철 나무꾼만큼이나 심장이 필요해요."`},
  {w: `tinman`, f: `dorothy_surprised`, o: `oz_beast`, bk: [`11-68`, `11-69`, `11-74`, `11-76`],
   e: `그다음 날은 나무꾼. 나무꾼은 숙녀이길 바랐대. 숙녀라면 마음씨가 고울 테니까. 그런데 오즈는 눈이 다섯, 팔다리가 다섯씩인 코끼리만 한 괴물이었대! "심장을 원하면 도로시가 서쪽 마녀를 없애는 걸 도와라. 그러면 가장 다정한 심장을 주겠다."`,
   l: `다음 날 나무꾼은 숙녀를 만나기를 바랐다. '숙녀들은 모두 마음씨가 곱다고들 하니까.' 그러나 그가 본 것은 코뿔소 같은 머리에 눈이 다섯, 팔과 다리가 다섯씩인 코끼리만 한 괴물이었다. 심장이 없어 무섭지는 않았지만 몹시 실망했다. "정말 심장을 원한다면 얻을 자격을 갖춰라. 도로시가 서쪽 마녀를 죽이는 것을 도와라. 그러면 가장 크고 다정한 심장을 주겠다."`},
  {w: `lion`, f: `dorothy_surprised`, o: `lion`, bk: [`11-78`],
   e: `사자가 큰소리쳤어. "괴물이면 크게 울부짖고, 숙녀면 덤비는 척하고, 머리면 데굴데굴 굴려 버릴 거야! 걱정 마, 다 잘될 거야."`,
   l: `"내가 갈 때 오즈가 괴물이라면 있는 힘껏 울부짖어 겁을 줄 거야. 숙녀라면 덤벼드는 척하고, 머리라면 방 안에서 굴려 버리겠어. 그러니 힘내, 친구들. 다 잘될 거야." 사자가 큰소리쳤다.`},
  {w: `lion`, f: `dorothy_surprised`, o: `oz_fire`, bk: [`11-80`, `11-83`, `11-86`, `11-87`],
   e: `그런데 사자 앞에 나타난 오즈는… 이글이글 타는 불덩이였대! 수염이 그을려서 사자는 문 쪽으로 슬금슬금 물러났대. "마녀가 사라졌다는 증거를 가져오면 용기를 주겠다." 불덩이가 더 뜨거워지자 사자는 꽁지 빠지게 도망쳐 나왔대.`,
   l: `그러나 사자 앞의 오즈는 바라보기도 힘들 만큼 이글거리는 불덩이였다. 다가가려 하자 수염이 그을려, 사자는 떨며 문 쪽으로 물러났다. "나쁜 마녀가 죽었다는 증거를 가져오너라. 그 순간 용기를 주겠다. 하지만 마녀가 살아 있는 한 너는 겁쟁이로 남아야 한다." 불덩이가 맹렬히 뜨거워지자 사자는 꽁지가 빠지게 뛰쳐나왔다.`},
  {w: `dorothy`, in: 1, f: `dorothy_dreamy`,
   e: `머리, 숙녀, 괴물, 불덩이. 오즈는 왜 만날 때마다 모습이 다를까? 그리고 다들 결국 똑같은 말을 했어. "서쪽 마녀를 없애라."`,
   l: `머리, 숙녀, 괴물, 불덩이. 오즈는 왜 만나는 이마다 다른 모습일까. 그러면서도 넷에게 한 말은 똑같았다. 서쪽의 나쁜 마녀를 없애라.`},
  {w: `lion`, f: `dorothy_sad`, o: `lion`, bk: [`11-88`, `11-89`, `11-90`, `11-91`, `11-92`, `11-93`, `11-94`],
   e: `"이제 어떡하지?" "할 수 있는 건 하나뿐이야. 윙키 나라로 가서 나쁜 마녀를 찾는 거지." "못 하면?" "그럼 나는 영영 용기가 없겠지." "나는 뇌가." "저는 심장이." "나는… 엠 아주머니를 영영 못 보겠지." 나는 또 울음이 났어.`,
   l: `"이제 어떡하지?" "할 수 있는 일은 하나뿐이야." 사자가 말했다. "윙키들의 나라로 가서 나쁜 마녀를 찾아내는 거지." "하지만 해내지 못하면?" "그러면 나는 영영 용기를 얻지 못하겠지." "나는 뇌를." "저는 심장을." "그리고 나는 엠 아주머니와 헨리 아저씨를 영영 못 보겠지." 나는 울기 시작했다.`},
  {t: `choice`, id: `C6`, kind: `talk`, label: `서쪽으로 갈까`, f: `dorothy_sad`, o: `lion`,
   q: {e: `서쪽 마녀에게 가야 할까요? 도로시는 친구들에게 뭐라고 말할까요?`, l: `서쪽으로 떠나야 할까요? 도로시는 동료들에게 무엇이라 말할까요?`},
   note: {e: `원작의 도로시는 눈물을 닦고 말해요. "해 보는 수밖에 없겠지. 하지만 나는 누구도 해치고 싶지 않아." 그러자 친구들도 하나씩 말해요. "나도 같이 갈게."`, l: `원작에서 도로시는 "엠 아주머니를 다시 만나기 위해서라도 누구를 죽이고 싶지는 않다"고 말하면서도 떠나기로 합니다. 동료들도 저마다 "나는 쓸모없지만 함께 가겠다"고 나서지요.`},

   l: `마녀의 찬장에는 다이아몬드와 루비가 박힌 황금 모자가 있었다. 주인은 날개 달린 원숭이들을 세 번 불러낼 수 있었다. 마녀는 이미 윙키들을 노예로 삼을 때와 오즈를 서쪽에서 몰아낼 때 두 번을 썼다. 마지막 한 번. 마녀는 모자를 쓰고 왼발로 서서 외쳤다. "에페, 페페, 카케!" 오른발로 서서 "힐로, 홀로, 헬로!" 두 발로 서서 "지지, 주지, 직!"`},
  {w: `monkeyking`, f: `dorothy_surprised`, o: `monkeyking`, bk: [`12-46`, `12-47`, `12-48`],
   e: `하늘이 어두워지고, 커다란 날개를 단 원숭이 떼가 나타났어! 우두머리가 말했어. "세 번째이자 마지막으로 부르셨군요." 마녀가 명령했어. "사자만 빼고 모두 없애라. 사자는 데려와. 말처럼 마구를 채워 일을 시킬 테니."`,
   l: `하늘이 어두워지고 수많은 날갯짓과 재잘거림 속에 거대한 날개를 단 원숭이 떼가 나타났다. 우두머리가 말했다. "우리를 세 번째이자 마지막으로 부르셨군요. 무엇을 명령하시겠습니까?" "사자만 빼고 모두 없애라. 그 짐승은 데려와라. 말처럼 마구를 채워 일을 시킬 테니."`},
  {bg: `ch7`, w: `dorothy`, in: 1, f: `dorothy_sad`, o: `monkeyking`, bk: [`12-50`, `12-51`, `12-52`], cam: `shake`,
   e: `원숭이들이 나무꾼을 들고 날아가 뾰족한 바위 위에 떨어뜨렸어. 허수아비의 짚을 모두 뽑아 버리고 옷은 높은 나무에 던졌어. 사자는 밧줄로 칭칭 묶어 마녀의 성으로 데려갔어. 나는 토토를 안고 그걸 지켜볼 수밖에 없었어.`,
   l: `원숭이 몇은 나무꾼을 날카로운 바위 벌판 위로 데려가 떨어뜨렸다. 나무꾼은 심하게 찌그러져 움직일 수도 신음할 수도 없었다. 다른 원숭이들은 허수아비의 짚을 모조리 뽑고 옷을 꾸러미로 묶어 키 큰 나무 꼭대기에 던졌다. 나머지는 사자를 밧줄로 칭칭 감아 마녀의 성으로 날아갔다. 나는 토토를 안고 서서 동료들의 슬픈 운명을 지켜보며 곧 내 차례가 오리라 생각했다.`},
  {w: `monkeyking`, f: `dorothy_surprised`, o: `monkeyking`, bk: [`12-53`, `12-54`, `12-55`],
   e: `원숭이 우두머리가 나에게 날아오다가… 내 이마의 자국을 보고 멈췄어! "이 아이는 해칠 수 없다. 선의 힘이 지켜 주고 있으니까. 선의 힘은 악의 힘보다 크다." 원숭이들은 나를 조심조심 안아서 마녀의 성 앞에 내려놓았어.`,
   l: `우두머리가 털북숭이 팔을 뻗으며 날아왔다. 그러다 내 이마의 입맞춤 자국을 보고 우뚝 멈췄다. "우리는 감히 이 소녀를 해칠 수 없다. 선의 힘이 지켜 주고 있고, 선의 힘은 악의 힘보다 크니까." 원숭이들은 나를 조심스럽고 부드럽게 안아 마녀의 성 현관 계단에 내려놓고, 다시는 마녀에게 오지 않겠다며 날아가 버렸다.`},

  /* ---------- 마녀의 성 ---------- */
  {bg: `ch7_kitchen`, w: `witch`, f: `dorothy_sad`, o: `witch`, bk: [`12-58`, `12-59`, `12-60`],
   e: `마녀는 내 이마 자국과 은 구두를 보고 덜덜 떨었어. 그런데 내 눈을 들여다보더니 씩 웃었어. 내가 은 구두의 힘을 모른다는 걸 알아챈 거야. "따라와라. 내 말을 안 들으면 끝장을 내 주겠다." 마녀는 나에게 냄비를 닦고, 바닥을 쓸고, 불을 지피라고 했어.`,
   l: `마녀는 내 이마의 자국을 보고 걱정했고, 은 구두를 보자 두려워 떨었다. 그 구두에 얼마나 강력한 마법이 깃들었는지 알았기 때문이다. 그러나 내 눈을 들여다본 마녀는 그 뒤의 마음이 얼마나 순진한지, 내가 은 구두의 힘을 전혀 모른다는 것을 알아차렸다. '아직 노예로 삼을 수 있겠어.' 마녀는 나를 부엌으로 데려가 냄비와 주전자를 닦고, 바닥을 쓸고, 불을 지피라고 했다.`},
  {t: `choice`, id: `C3`, kind: `act`, label: `마녀의 부엌에서`, f: `dorothy_sad`, o: `witch`,
   q: {e: `마녀가 일을 시켜요. 도로시는 어떻게 할까요?`, l: `마녀의 부엌에 갇힌 도로시. 어떻게 할까요?`},
   note: {e: `원작의 도로시는 얌전히 열심히 일해요. 마녀가 자기를 해치지 않기로 한 게 다행이라고 생각했거든요. 사실 마녀는 이마 자국 때문에 도로시를 해칠 수 없었는데, 도로시는 그걸 몰랐어요.`, l: `원작에서 도로시는 "얌전히" 일하며 마녀가 자신을 죽이지 않기로 한 것을 다행으로 여깁니다. 실은 마녀가 이마의 자국 때문에 손댈 수 없었다는 것을, 도로시는 끝까지 모릅니다. 자기가 가진 힘을 모르는 것, 이 장의 숨은 주제입니다.`},
   opts: [
    {type: `canon`, go: `c3a`, e: `얌전히, 열심히 일한다.`, l: `얌전히 열심히 일한다.`, s: {e: `열심히 일함`, l: `순종하며 일함`}},
    {type: `bal`, go: `c3b`, eff: {heart: {lion: 1}}, e: `일하면서 몰래 사자가 갇힌 곳을 찾아본다.`, l: `일하며 몰래 사자의 거처를 찾는다.`, s: {e: `사자를 찾음`, l: `사자를 찾음`}},
    {type: `imag`, go: `c3c`, eff: {album: `potDrum`}, e: `냄비를 북처럼 두드리며 노래하면서 일한다.`, l: `냄비를 두드리며 노래로 버틴다.`, s: {e: `노래하며 일함`, l: `노래로 버팀`}}
   ]},
  {id: `c3a`, w: `dorothy`, in: 1, f: `dorothy_sad`, bk: [`12-61`],
   e: `나는 얌전히 일을 시작했어. 있는 힘껏 열심히. 마녀가 나를 해치지 않기로 한 게 다행이라고 생각했거든.`,
   l: `나는 얌전히 일을 시작했다. 마녀가 나를 죽이지 않기로 한 것이 다행이라 여기며, 있는 힘껏 일하기로 마음먹었다.`},
  {t: `goto`, to: `m3`},
  {id: `c3b`, w: `dorothy`, in: 1, f: `dorothy_brave`,
   e: `냄비를 닦으면서 창밖을 몰래 살폈어. 저기 쇠 울타리 마당에… 사자다! 사자가 살아 있어. 꼭 찾아갈게, 사자야.`,
   l: `냄비를 닦으며 몰래 창밖을 살폈다. 높은 쇠 울타리가 둘러친 마당에 사자가 있었다. 살아 있었다. 반드시 찾아가리라.`},
  {t: `goto`, to: `m3`},
  {id: `c3c`, w: `dorothy`, in: 1, f: `dorothy_brave`, fx: `dream`,
   e: `통, 통, 통! 냄비를 북처럼 두드리며 캔자스 노래를 불렀어. 토토가 박자에 맞춰 꼬리를 흔들었어. 노래를 부르니까 조금 덜 무서웠어.`,
   l: `냄비를 북처럼 두드리며 캔자스의 노래를 흥얼거렸다. 토토가 박자에 맞춰 꼬리를 흔들었다. 노래하는 동안만큼은 덜 두려웠다.`},
  {id: `m3`, bg: `ch7_yard`, w: `witch`, f: `dorothy_sad`, o: `lion`, bk: [`12-62`, `12-63`, `12-64`],
   e: `마녀가 사자에게 마구를 채우려고 마당 문을 열자, 사자가 크게 울부짖으며 덤벼들었어! 마녀는 겁이 나서 도망쳤지. "마구를 못 채운다면 굶기겠다!" 그 뒤로 마녀는 사자에게 먹을 걸 하나도 안 주고, 날마다 와서 물었어. "마구를 찰 준비가 됐느냐?"`,
   l: `마녀가 사자에게 마구를 채우려 마당 문을 열자, 사자가 크게 울부짖으며 사납게 덤벼들었다. 겁이 난 마녀는 문을 닫고 문살 사이로 말했다. "마구를 채울 수 없다면 굶기면 되지." 그 뒤로 마녀는 사자에게 먹을 것을 주지 않고, 날마다 한낮에 와서 물었다. "말처럼 마구를 찰 준비가 됐느냐?"`},
  {w: `dorothy`, in: 1, f: `dorothy_sad`, o: `lion`, bk: [`12-66`],
   e: `밤마다 마녀가 잠들면, 나는 찬장에서 몰래 음식을 꺼내 사자에게 가져다주었어. 사자는 짚 잠자리에 눕고, 나는 그 부드러운 갈기에 머리를 기댔어. 그런데 오늘 밤 사자가 힘없이 말했어. "도로시… 나 너무 무서워. 내일은 그냥 마구를 찰까 봐."`,
   l: `밤마다 마녀가 잠들면 나는 찬장에서 음식을 꺼내 사자에게 가져갔다. 사자가 짚 잠자리에 누우면 나는 그 곁에 누워 부드러운 갈기에 머리를 기댔다. 그런데 그날 밤 사자가 힘없이 말했다. "도로시, 나 너무 무서워. 내일은 그냥 마구를 차 버릴까 봐."`},
  {t: `choice`, id: `R1`, kind: `recall`, who: `lion`, label: `사자에게 꺼내 보인 카드`, go: `r1`, f: `dorothy_brave`, o: `lion`,
   q: {e: `✨ 사자가 무서워서 포기하려고 해요. 사자가 예전에 보여 준 힘을 떠올리게 해 주세요! 어떤 카드를 꺼낼까요?`, l: `✨ 굴복하려는 사자에게, 그가 지난날 보여 준 힘을 떠올리게 합시다. 어떤 카드를 꺼낼까요?`},
   note: {e: `카드가 사자에게 힘을 준 게 아니에요. 사자는 이미 그런 일을 해냈던 거예요. 도로시는 그걸 기억하게 도와줬을 뿐이에요.`, l: `카드는 힘을 '주는' 물건이 아닙니다. 사자가 이미 해낸 일을 '기억하게' 할 뿐이지요. 진짜 힘은 처음부터 그의 것이었습니다.`}},
  {id: `r1`, w: `lion`, f: `dorothy_happy`, o: `lion`, eff: {card: `li_no`, heart: {lion: 1}},
   e: `"'{lastCard}'…" 사자가 내 말을 따라 하더니 천천히 고개를 들었어. "맞아. 나 그때… 무서웠는데도 해냈었지." 다음 날 한낮, 마녀가 또 물었어. "마구를 찰 테냐?" 사자가 대답했어. "아니. 이 마당에 들어오면 물어 버릴 테다!"`,
   l: `"'{lastCard}'." 사자는 그 말을 되뇌다 천천히 고개를 들었다. "그래. 나는 그때 무서웠는데도 해냈어." 이튿날 한낮, 마녀가 또 물었다. "마구를 찰 준비가 됐느냐?" 사자가 대답했다. "아니. 이 마당에 들어오면 물어 버릴 테다."`},
  {w: `dorothy`, in: 1, f: `dorothy_sad`, o: `toto`, bk: [`12-67`, `12-68`],
   e: `마녀는 우산으로 나를 때리겠다고 을러댔지만, 사실은 이마 자국 때문에 나를 때릴 수 없었대. 나는 그걸 몰라서 늘 무서웠어. 한 번은 마녀가 토토를 때렸는데, 용감한 토토가 마녀 다리를 콱 물었어! 그래도 캔자스는 점점 더 멀게만 느껴져서, 나는 자주 울었어.`,
   l: `마녀는 늘 들고 다니는 낡은 우산으로 나를 때리겠다고 을러댔지만, 이마의 자국 때문에 감히 때리지 못했다. 나는 그것을 몰라 나와 토토가 어찌 될까 늘 두려웠다. 한 번은 마녀가 우산으로 토토를 때리자, 용감한 꼬마 개가 마녀의 다리를 물어 되갚았다. 캔자스로 돌아가는 일이 더 어려워졌다는 것을 깨달은 나는 몇 시간이고 서럽게 울곤 했고, 토토는 발치에서 낑낑거렸다.`},

  /* ---------- 은 구두와 물 ---------- */
  {bg: `ch7_kitchen`, w: `witch`, f: `dorothy_surprised`, o: `witch`, bk: [`12-69`, `12-70`, `12-71`], cam: `shake`,
   e: `마녀는 내 은 구두가 너무 갖고 싶었어. 그래서 부엌 바닥에 안 보이는 쇠막대를 놓았어. 나는 그걸 못 보고 걸려 넘어졌고, 은 구두 한 짝이 벗겨졌어! 마녀가 냉큼 집어 자기 발에 신어 버렸어.`,
   l: `마녀는 은 구두가 몹시 탐났다. 하지만 나는 밤과 목욕할 때 말고는 구두를 벗지 않았고, 마녀는 어둠과 물을 무척 무서워했다. 결국 마녀는 부엌 바닥에 쇠막대를 놓고 마법으로 보이지 않게 만들었다. 나는 막대에 걸려 넘어졌고, 은 구두 한 짝이 벗겨졌다. 내가 손을 뻗기도 전에 마녀가 그것을 낚아채 제 앙상한 발에 신었다.`},
  {w: `dorothy`, f: `dorothy_brave`, o: `witch`, bk: [`12-72`, `12-73`, `12-74`, `12-75`],
   e: `"내 구두 돌려줘!" "싫다. 이제 내 거야. 언젠가 나머지 한 짝도 빼앗을 거다." 마녀가 깔깔 웃었어. 나는 너무너무 화가 났어.`,
   l: `"내 구두 돌려줘!" "싫다. 이제 내 구두지 네 것이 아니야." "당신은 정말 못됐어! 내 구두를 가져갈 권리가 없어." "그래도 내가 가질 거다." 마녀가 나를 비웃었다. "언젠가 나머지 한 짝도 빼앗을 거다." 나는 몹시 화가 났다.`},
  {t: `choice`, id: `C4`, kind: `act`, label: `빼앗긴 구두`, f: `dorothy_brave`, o: `witch`,
   q: {e: `마녀가 구두를 빼앗고 비웃어요! 도로시는 어떻게 할까요?`, l: `구두를 빼앗기고 조롱당한 도로시. 어떻게 할까요?`},
   note: {e: `원작의 도로시는 너무 화가 나서, 옆에 있던 물 양동이를 마녀에게 끼얹어요. 도로시는 물이 마녀의 끝장이라는 걸 전혀 몰랐어요!`, l: `원작에서 도로시는 분노에 차 곁에 있던 물 양동이를 끼얹습니다. 마녀를 없애려던 것이 아니었습니다. 물이 마녀의 약점이라는 것을 도로시는 몰랐지요.`},
   opts: [
    {type: `canon`, go: `c4a`, e: `옆에 있던 물 양동이를 마녀에게 끼얹는다!`, l: `곁의 물 양동이를 마녀에게 끼얹는다.`, s: {e: `물을 끼얹음`, l: `물을 끼얹음`}},

  {id: `c4a`, w: `dorothy`, f: `dorothy_brave`, o: `witch`, bk: [`12-76`], eff: {item: `waterBucket`}, cam: `shake`,
   e: `나는 옆에 있던 물 양동이를 번쩍 들어서 마녀에게 촤악! 끼얹었어. 마녀가 머리부터 발끝까지 흠뻑 젖었어.`,
   l: `나는 곁에 있던 물 양동이를 집어 들어 마녀에게 끼얹었다. 마녀는 머리부터 발끝까지 흠뻑 젖었다.`},
  {t: `goto`, to: `m4`},
  {id: `c4b`, w: `dorothy`, f: `dorothy_brave`, o: `toto`, eff: {item: `waterBucket`}, cam: `shake`,
   e: `나는 마녀 발에 신긴 구두를 붙잡고 버텼어. 그때 토토가 달려와 마녀 치맛자락을 물고 늘어졌어! 마녀가 비틀거리다 물 양동이를 걷어찼고, 양동이가 엎어지면서 물이 마녀에게 촤악! 쏟아졌어.`,
   l: `나는 마녀의 발에 신긴 구두를 붙들고 버텼다. 토토가 달려와 마녀의 치맛자락을 물고 늘어졌다. 비틀거리던 마녀가 물 양동이를 걷어찼고, 엎어진 양동이의 물이 마녀를 덮쳤다.`},
  {t: `goto`, to: `m4`},
  {id: `c4c`, w: `witch`, f: `dorothy_brave`, o: `witch`, fx: `dream`, eff: {item: `waterBucket`},
   e: `"왜 이렇게 못되게 굴어요?" 마녀가 잠깐 멈칫했어. "…못되게 굴면 모두 무서워하니까. 무서워하면 아무도 날 건드리지 못하지." 그러고는 다시 비웃었어. "나머지 한 짝도 곧 빼앗을 거다!" 나는 너무 화가 나서 물 양동이를 끼얹었어!`,
   l: `"왜 이토록 못되게 구나요?" 마녀가 잠시 멈칫했다. "못되게 굴면 모두가 무서워하지. 무서워하면 아무도 나를 건드리지 못해." 그러고는 다시 비웃었다. "나머지 한 짝도 곧 빼앗을 거다." 나는 분을 참지 못하고 물 양동이를 끼얹었다.`},
  {id: `m4`, w: `witch`, f: `dorothy_surprised`, o: `witch`, bk: [`12-77`, `12-78`, `12-79`, `12-80`, `12-81`], cam: `shake`,
   e: `그 순간 마녀가 비명을 질렀어. 그러더니 몸이 쪼그라들기 시작했어! "네가 무슨 짓을 했는지 봐라! 나는 녹아 버릴 거야!" "정말 미안해요!" 나는 진심으로 무서웠어. "물이 내 끝장이라는 걸 몰랐느냐?" "당연히 몰랐죠! 제가 어떻게 알아요?"`,
   l: `그 순간 마녀가 겁에 질려 비명을 지르더니 쪼그라들며 무너지기 시작했다. "네가 무슨 짓을 했는지 봐라! 조금 있으면 나는 녹아 없어질 거야." "정말 미안해요." 마녀가 눈앞에서 흑설탕처럼 녹아내리는 것을 보고 나는 진심으로 겁이 났다. "물이 내 끝장이라는 걸 몰랐느냐?" "당연히 몰랐죠. 제가 어떻게 알아요?"`},
  {w: `witch`, f: `dorothy_surprised`, o: `witch`, bk: [`12-82`, `12-83`],
   e: `"너 같은 꼬마가 내 못된 짓을 끝내게 될 줄은 몰랐다…" 그 말을 끝으로 마녀는 녹아서 사라져 버렸어. 남은 건 은 구두 한 짝뿐이었어. 나는 구두를 깨끗이 닦아 다시 신고, 마당으로 달려가 사자에게 외쳤어. "사자야! 마녀가 사라졌어! 이제 우린 자유야!"`,
   l: `"나는 평생 못된 짓을 했지만, 너 같은 꼬마가 나를 녹여 그 짓을 끝내게 될 줄은 몰랐다. 이제 간다!" 마녀는 형체 없이 녹아 부엌 바닥으로 번졌다. 남은 것은 은 구두 한 짝뿐이었다. 나는 구두를 깨끗이 닦아 다시 신고, 마당으로 달려가 사자에게 서쪽의 나쁜 마녀가 끝났으며 우리는 더 이상 포로가 아니라고 알렸다.`},

  {bg: `ch7_hall`, w: `winkie`, f: `dorothy_happy`, o: `winkie`, bk: [`13-1`, `13-2`],
   e: `나는 사자를 풀어 주고, 윙키들을 모두 불러 모았어. "여러분은 이제 노예가 아니에요!" 노란 윙키들이 너무너무 기뻐했어. 윙키들은 그날을 축제일로 정했대.`,
   l: `나는 사자의 감옥 문을 열어 풀어 주고, 윙키들을 모두 불러 이제 노예가 아니라고 알렸다. 여러 해 동안 잔인한 마녀를 위해 고되게 일해 온 노란 윙키들은 크게 기뻐했고, 그날을 축제일로 정해 해마다 잔치와 춤으로 보내기로 했다.`},
  {w: `lion`, f: `dorothy_sad`, o: `lion`, bk: [`13-3`, `13-4`, `13-5`],

  {t: `choice`, id: `C5`, kind: `talk`, label: `윙키들에게 부탁`, f: `dorothy_brave`, o: `winkie`,
   q: {e: `친구들을 구하러 가야 해요. 도로시는 윙키들에게 뭐라고 말할까요?`, l: `동료들을 구해야 합니다. 도로시는 윙키들에게 어떻게 말할까요?`},
   note: {e: `원작의 도로시는 윙키들에게 친구들을 구하는 걸 도와 달라고 부탁해요. 윙키들은 자기들을 풀어 준 도로시를 위해서라면 무엇이든 하겠다며 기꺼이 따라나서요.`, l: `원작에서 도로시는 윙키들에게 도움을 청하고, 그중 "가장 아는 것이 많아 보이는" 이들을 골라 함께 떠납니다. 자유를 되찾은 이들이 이번엔 구출의 손이 됩니다.`},
   opts: [

    {type: `bal`, go: `c5a`, eff: {heart: {scarecrow: 1, tinman: 1}}, e: `"우리 친구들이 여러분을 풀어 주려고 싸웠어요. 같이 구해 주세요!"`, l: `"친구들도 함께 싸웠어요. 함께 구해 주세요!"`, s: {e: `친구들의 공을 알림`, l: `동료의 공을 알림`}},
    {type: `imag`, go: `c5a`, eff: {album: `festival`}, e: `"축제는 친구들이랑 다 같이 해요! 우리 먼저 친구들을 찾으러 가요!"`, l: `"축제는 모두 함께해요! 먼저 친구들을 찾아요!"`, s: {e: `축제를 미루자고 함`, l: `축제를 미룸`}}
   ]},
  {id: `c5a`, bg: `ch7`, w: `dorothy`, f: `dorothy_sad`, o: `tinman`, bk: [`13-6`, `13-7`],
   e: `윙키들은 기꺼이 따라나섰어. 하루하고 반나절을 걸어 바위 벌판에 이르렀어. 나무꾼이 온통 찌그러지고 구부러진 채 누워 있었어. 도끼는 녹슬고 자루는 부러져 있었지. 나는 가는 내내 눈물이 났어.`,
   l: `윙키들은 자기들을 풀어 준 나를 위해 무엇이든 하겠다고 했다. 하루하고 반나절을 간 끝에 바위 벌판에서 온통 찌그러지고 구부러진 나무꾼을 찾았다. 도끼는 날이 녹슬고 자루가 부러져 있었다. 윙키들이 그를 조심스레 안아 성으로 돌아가는 동안 나는 옛 친구의 딱한 모습에 눈물을 흘렸고, 사자는 침울한 얼굴이었다.`},
  {bg: `ch7_hall`, w: `winkie`, f: `dorothy_happy`, o: `winkie`, bk: [`13-8`, `13-9`, `13-10`, `13-11`],
   e: `"여러분 중에 양철공이 있나요?" "그럼요! 솜씨 좋은 양철공들이 있어요." 양철공들이 사흘 낮 나흘 밤 동안 망치로 두드리고 펴고 땜질하고 닦았어. 마침내 나무꾼이 원래 모습으로 돌아왔어! 여기저기 덧댄 자국이 있었지만 나무꾼은 하나도 신경 쓰지 않았어.`,
   l: `"여러분 가운데 양철공이 있나요?" "아, 그럼요. 아주 솜씨 좋은 양철공들이 있어요." 양철공들은 사흘 낮 나흘 밤 동안 나무꾼을 두드리고 비틀고 구부리고 땜질하고 닦았다. 마침내 그는 예전 모습으로 펴졌고 마디도 전처럼 잘 움직였다. 여기저기 덧댄 자국이 있었지만, 허영심 없는 나무꾼은 조금도 신경 쓰지 않았다.`},
  {w: `tinman`, f: `dorothy_happy`, o: `tinman`, bk: [`13-12`], eff: {heart: {tinman: 1}},
   e: `나무꾼이 내 방에 들어와 고맙다고 하더니, 너무 기뻐서 눈물을 흘렸어. 나는 녹슬지 않게 앞치마로 눈물을 한 방울 한 방울 닦아 주었어. 내 눈에서도 눈물이 펑펑 났지만, 내 눈물은 안 닦아도 괜찮았어. 사자는 꼬리로 눈물을 하도 닦아서 꼬리가 흠뻑 젖었대!`,
   l: `나무꾼이 내 방으로 걸어 들어와 구해 줘서 고맙다고 하더니 기쁨의 눈물을 흘렸다. 나는 마디가 녹슬지 않도록 앞치마로 눈물을 한 방울씩 닦아 주었다. 옛 친구를 다시 만난 기쁨에 내 눈물도 쉴 새 없이 흘렀지만, 그 눈물은 닦지 않아도 괜찮았다. 사자는 꼬리 끝으로 하도 눈물을 닦아 꼬리가 흠뻑 젖는 바람에 마당에 나가 햇볕에 말려야 했다.`},
  {w: `tinman`, f: `dorothy_brave`, o: `tinman`, bk: [`13-13`, `13-15`, `13-16`, `13-17`, `13-18`, `13-19`], eff: {heart: {scarecrow: 1}},
   e: `"허수아비만 함께 있다면 정말 행복할 텐데요." 우리는 허수아비 옷이 걸린 키 큰 나무를 찾아갔어. 나무꾼은 윙키 금세공인이 만들어 준 순금 자루 도끼로 나무를 쓰러뜨렸어! 옷에 깨끗한 짚을 채우자… 허수아비가 원래대로 돌아왔어! "구해 줘서 고마워요, 고마워요!"`,
   l: `"허수아비만 다시 함께 있다면 정말 행복할 텐데요." 우리는 윙키들과 함께 원숭이들이 옷을 던져 놓은 키 큰 나무를 찾아갔다. 줄기가 매끄러워 아무도 오를 수 없었지만, 나무꾼이 윙키 금세공인이 만들어 준 순금 자루 도끼로 나무를 쓰러뜨렸다. 성으로 가져온 옷에 깨끗한 짚을 채우자, 보라! 허수아비가 원래대로 서서 몇 번이고 고맙다고 인사했다.`},
  {t: `name`, id: `N7`, key: `reunion`, free: true, max: 40, label: `다시 만난 친구에게 하고 싶은 말`, f: `dorothy_happy`, o: `scarecrow`,
   q: {e: `✍️ 다시 넷이 모였어요! 도로시가 되어, 다시 만난 친구들에게 하고 싶은 말을 써 보세요.`, l: `✍️ 다시 모인 넷. 도로시가 되어 동료들에게 건넬 말을 써 봅시다.`},
   ph: `예: 다시는 헤어지지 말자`,
   note: {e: `원작에서 넷은 노란 성에서 며칠 동안 행복하게 지내요. 서로 구하고 구해 준 친구들이니까요.`, l: `원작에서 일행은 노란 성에서 며칠을 행복하게 보냅니다. 서로를 구하고 구원받은 경험이 그들을 하나로 묶었습니다.`}},
  {w: `dorothy`, f: `dorothy_happy`, o: `scarecrow`,
   e: `"'{reunion}'" 내 말에 허수아비, 나무꾼, 사자가 동시에 고개를 끄덕였어. 토토도 "왈!"`,
   l: `"'{reunion}'" 내 말에 세 친구가 한꺼번에 고개를 끄덕였다. 토토도 짖었다.`},
  {w: `dorothy`, f: `dorothy_happy`, o: `tinman`, bk: [`13-20`, `13-21`, `13-22`, `13-23`, `13-24`, `13-25`],
   e: `며칠을 행복하게 보낸 뒤, 나는 엠 아주머니 생각이 났어. "이제 오즈님께 가서 약속을 지켜 달라고 하자!" "드디어 심장을!" "나는 뇌를!" "나는… 용기를." "그리고 나는 캔자스로!"`,
   l: `노란 성에서 며칠을 행복하게 보낸 어느 날, 엠 아주머니가 떠올랐다. "오즈님께 돌아가서 약속을 지켜 달라고 해야 해." "마침내 심장을 얻게 되겠군요." "나는 뇌를." 허수아비가 기뻐했다. "그리고 나는 용기를." 사자는 생각에 잠겨 말했다. "그리고 나는 캔자스로 돌아가는 거야!" 나는 손뼉을 쳤다.`},

     배경색과 거의 같은 순백색이고 일정 크기 이상인 덩어리만 지우므로, 눈 흰자처럼 작은 부분은 남음 */
  if(bgN){
    const br = bgR/bgN, bgg = bgG/bgN, bb = bgB/bgN, smallMin = Math.max(40, Math.round(w*h*0.00006));
    const strict = p => { const i = p*4; if(d[i+3] < 16) return false; const r = d[i], g = d[i+1], b = d[i+2];
      return Math.min(r,g,b) > 212 && Math.max(r,g,b) - Math.min(r,g,b) < 20 && Math.abs(r-br) < 16 && Math.abs(g-bgg) < 16 && Math.abs(b-bb) < 16; };
    const lab = new Uint8Array(w*h);
    for(let s0 = 0; s0 < w*h; s0++){
      if(seen[s0] || lab[s0] || !strict(s0)) continue;
      const comp = [s0], stack = [s0]; lab[s0] = 1;
      while(stack.length){ const p = stack.pop(), x = p % w, y = (p - x) / w;
        const nb = [x>0 ? p-1 : -1, x<w-1 ? p+1 : -1, y>0 ? p-w : -1, y<h-1 ? p+w : -1];
        for(const q of nb){ if(q >= 0 && !seen[q] && !lab[q] && strict(q)){ lab[q] = 1; stack.push(q); comp.push(q); } } }
      /* 덩어리의 평균 색이 배경 종이색과 같으면(따뜻한 기가 없으면) 배경 틈으로 보고 지움.
         이(치아)·눈 흰자처럼 살짝 노르스름하거나 회색빛인 부분은 평균 색이 달라서 남음 */
      if(comp.length < smallMin) continue;
      let sr = 0, sg = 0, sb = 0; for(const p of comp){ sr += d[p*4]; sg += d[p*4+1]; sb += d[p*4+2]; }
      const mr = sr/comp.length, mg = sg/comp.length, mb = sb/comp.length;
      const warm = (mr - mb) - (br - bb), dim = Math.min(br, bgg, bb) - Math.min(mr, mg, mb);
      if(warm > 4.6 || dim > 8) continue;
      /* 눈 흰자 보호: 배경 틈은 펜 선(진한 테두리)에 둘러싸여 있고, 눈 흰자는 대부분 피부색에 둘러싸여 있음 */
      const inC = new Set(comp), ringSeen = new Set(); let dark = 0, tot = 0;
      for(const p of comp){ const x = p % w, y = (p - x) / w;
        for(let dy=-3; dy<=3; dy++) for(let dx=-3; dx<=3; dx++){ const xx = x+dx, yy = y+dy; if(xx<0||yy<0||xx>=w||yy>=h) continue;
          const q = yy*w + xx; if(inC.has(q) || ringSeen.has(q)) continue; ringSeen.add(q); tot++;
          if((d[q*4] + d[q*4+1] + d[q*4+2]) / 3 < 90) dark++; } }
      if(tot && dark / tot >= 0.18){ for(const p of comp){ seen[p] = 1; d[p*4+3] = 0; } }
    }
  }
  for(let pass = 0; pass < 2; pass++){
    const edge = [];
    for(let y=1; y<h-1; y++) for(let x=1; x<w-1; x++){ const p = y*w + x; if(seen[p]) continue;
      if(seen[p-1] || seen[p+1] || seen[p-w] || seen[p+w]) edge.push(p); }
    for(const p of edge){ const i = p*4, mn = Math.min(d[i], d[i+1], d[i+2]);
      if(mn > 200){ d[i+3] = Math.round(d[i+3] * Math.max(0.1, (255 - mn) / 55)); if(mn > 238) seen[p] = 1; }
      else if(mn > 170 && pass === 0) d[i+3] = Math.round(d[i+3] * Math.max(0.35, (255 - mn) / 85)); }
  }
  ctx.putImageData(id, 0, 0);
}
async function processImage(src, key){
  const im = await loadImg(src), bg = isBgKey(key);
  const sc = Math.min(1, (bg ? 1600 : 1200) / im.naturalWidth, (bg ? 900 : 1000) / im.naturalHeight);
  const w = Math.max(1, Math.round(im.naturalWidth * sc)), h = Math.max(1, Math.round(im.naturalHeight * sc));
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d", {willReadFrequently: !bg});
  if(bg){ ctx.fillStyle = "#ecfbf5"; ctx.fillRect(0, 0, w, h); }
  ctx.drawImage(im, 0, 0, w, h);
  if(bg) return cv.toDataURL("image/jpeg", 0.86);
  if(/^(av|it|end)_/.test(key)) return cv.toDataURL("image/png");  /* 얼굴·물건·결말 아이콘은 그대로 */
  removeEdgeWhite(ctx, w, h);

}
async function handleFiles(files){
  const list = Array.from(files || []).filter(f => /^image\//.test(f.type) || /\.(png|jpe?g|webp|gif)$/i.test(f.name));
  if(!list.length) return;
  toast("이미지를 정리하는 중이에요… (" + list.length + "개)");
  const ok = [], fail = [];
  for(const f of list){
    const key = normalizeKey(f.name), url = URL.createObjectURL(f);
    try{ uploaded[key] = await processImage(url, key); ok.push(key); }catch(e){ fail.push(f.name); }finally{ URL.revokeObjectURL(url); }
  }
  renderScene(true);
  const known = ok.filter(k => BG_KEYS.includes(k) || SPRITE_KEYS.includes(k)), other = ok.filter(k => !known.includes(k));
  let msg = `<p><b>${ok.length}개</b>의 이미지를 불러와 화면에 바로 반영했어요.</p>`;
  if(known.length) msg += `<div class="img-list">${known.map(k => `<span>${k}</span>`).join("")}</div>`;
  if(other.length) msg += `<p style="margin-top:8px">아래 이미지는 아직 쓰이는 장면이 없지만, 배포용 파일에는 함께 저장돼요. (앞으로 만들 장에서 쓸 수 있어요)</p><div class="img-list">${other.map(k => `<span class="miss">${k}</span>`).join("")}</div>`;
  if(fail.length) msg += `<p style="margin-top:8px;color:#b9473f">읽지 못한 파일: ${esc(fail.join(", "))}</p>`;
  modal("🖼️ 이미지 불러오기 완료", msg, [{label:"확인", cls:"big alt"}]);
}

/* ---------- SVG 수채화 폴백 ---------- */
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DEFS = id => `<defs>
  <filter id="wc${id}" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="${id*7+3}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="1.4"/></filter>
  <filter id="soft${id}"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="paper${id}"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="t"/><feColorMatrix in="t" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0.10 0"/></filter></defs>`;
const SVG_OPEN = `<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">`;
function blossomCloud(rnd, cx, cy, rx, ry, n, cols){ let s = ""; for(let i=0;i<n;i++){ const a = rnd()*Math.PI*2, r = Math.sqrt(rnd()); s += `<circle cx="${(cx+Math.cos(a)*r*rx).toFixed(0)}" cy="${(cy+Math.sin(a)*r*ry).toFixed(0)}" r="${(18+rnd()*28).toFixed(0)}" fill="${cols[i%cols.length]}" opacity="${(.55+rnd()*.4).toFixed(2)}"/>`; } return s; }

/* 작품 설정(WORK.svgScenes)의 색·요소로 그리는 범용 수채화 장면. 그림 파일이 없을 때만 쓰임 */
function svgScene(key){
  const all = WORK.svgScenes || {};
  const sp = all[key] || all[key.split("_")[0]] || {sky:["#a9cbe0","#d6e6ea","#f2eedc"], far:"#9cbf86", near:"#7aa866"};
  let seed = 7; for(const c of key) seed = (seed * 31 + c.charCodeAt(0)) | 0;
  const rnd = mulberry(seed), id = Math.abs(seed) % 900 + 20, sky = sp.sky || ["#a9cbe0","#d6e6ea","#f2eedc"];
  let g = `<linearGradient id="sk${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset=".55" stop-color="${sky[1]}"/><stop offset="1" stop-color="${sky[2]}"/></linearGradient>
    <rect width="1600" height="900" fill="url(#sk${id})"/>`;
  if(sp.dark || sp.stars){ for(let i=0;i<(sp.stars || 30);i++) g += `<circle cx="${(rnd()*1600).toFixed(0)}" cy="${(rnd()*(sp.dark ? 900 : 380)).toFixed(0)}" r="${(1+rnd()*1.8).toFixed(1)}" fill="#fff" opacity="${(.2+rnd()*.5).toFixed(2)}"/>`; }
  if(sp.sun) g += `<circle cx="${sp.sun[0]}" cy="${sp.sun[1]}" r="70" fill="${sp.sun[2] || "#fff3c4"}" opacity=".85" filter="url(#soft${id})"/>`;
  g += `<g filter="url(#wc${id})">`;
  for(let i=0;i<(sp.clouds || 0);i++) g += blossomCloud(rnd, 150 + rnd()*1300, 90 + rnd()*160, 120, 30, 8, ["#ffffff","#f4f1ea"]);
  if(sp.funnel) g += `<path d="M1060 0 Q1180 0 1260 0 Q1230 220 1190 380 Q1170 520 1150 600 Q1120 610 1110 600 Q1100 470 1080 360 Q1040 200 1060 0Z" fill="#3b3c40" opacity=".78"/>
    <path d="M1080 90 Q1170 110 1240 80 M1095 200 Q1170 220 1220 190 M1110 320 Q1165 335 1200 310 M1120 440 Q1160 450 1180 430" stroke="#5c5d62" stroke-width="10" fill="none" opacity=".7"/>`;
  if(sp.swirl){ for(let i=0;i<7;i++){ const r = 120 + i*90; g += `<path d="M${800-r} 450 A${r} ${r*.55} 0 0 1 ${800+r} 450" stroke="#4a4e63" stroke-width="${14 - i}" fill="none" opacity="${(.5 - i*.05).toFixed(2)}" transform="rotate(${i*23} 800 450)"/>`; }
    g += `<rect x="640" y="330" width="320" height="240" fill="#4b4436"/><rect x="700" y="390" width="70" height="70" fill="#7a6a4a"/><rect x="830" y="400" width="80" height="170" fill="#2d281f"/>`; }
  if(sp.far){ g += sp.flat ? `<rect x="0" y="560" width="1600" height="340" fill="${sp.far}"/>` : `<path d="M0 520 Q300 430 640 500 T1280 470 T1600 500 L1600 900 L0 900Z" fill="${sp.far}"/>`; }
  if(sp.near){ g += sp.flat ? `<rect x="0" y="640" width="1600" height="260" fill="${sp.near}"/>` : `<path d="M0 640 Q520 590 1000 650 T1600 630 L1600 900 L0 900Z" fill="${sp.near}"/>`;
    if(sp.flat) for(let i=0;i<30;i++){ const x = rnd()*1600, y = 660 + rnd()*230; g += `<path d="M${x.toFixed(0)} ${y.toFixed(0)} l${(30+rnd()*60).toFixed(0)} ${(rnd()*4-2).toFixed(0)}" stroke="#7c7464" stroke-width="2" opacity=".5"/>`; } }
  if(sp.stream) g += `<path d="M0 720 Q400 680 800 730 T1600 700 L1600 760 Q1200 790 800 770 T0 780Z" fill="#7cc0e0" opacity=".85"/>`;
  if(sp.road){ g += `<path d="M640 900 L760 560 L840 560 L1060 900Z" fill="#e9c04a"/>`;
    for(let i=0;i<14;i++){ const t = i/14, y = 560 + (900-560)*t*t, lx = 760 - 120*t*t, rx = 840 + 220*t*t; g += `<path d="M${lx.toFixed(0)} ${y.toFixed(0)} H${rx.toFixed(0)}" stroke="#b8902a" stroke-width="${(1+3*t).toFixed(1)}" opacity=".7"/>`; } }
  for(let i=0;i<(sp.trees || 0);i++){ const x = (i % 2 ? 1000 + rnd()*560 : 40 + rnd()*560), y = 520 + rnd()*90, r = 50 + rnd()*40;
    g += `<rect x="${(x-6).toFixed(0)}" y="${y.toFixed(0)}" width="12" height="${(r*1.4).toFixed(0)}" fill="#6a5038"/>` + blossomCloud(rnd, x, y - r*.3, r, r*.8, 7, [sp.tree || "#4f8a4a", "#6aa35a", "#3f7440"]); }
  if(sp.house){ const wall = sp.house === "blue" ? "#8fb2e0" : "#b8b2a2", roof = sp.house === "blue" ? "#3f68b0" : "#8d8676", hx = sp.house === "blue" ? 1150 : 900, hy = sp.flat ? 470 : 470;
    g += sp.house === "blue" ? `<rect x="${hx}" y="${hy}" width="170" height="120" fill="${wall}"/><path d="M${hx-20} ${hy+4} Q${hx+85} ${hy-140} ${hx+190} ${hy+4}Z" fill="${roof}"/><rect x="${hx+65}" y="${hy+50}" width="40" height="70" fill="#5a6f98"/>`
                             : `<rect x="${hx}" y="${hy}" width="240" height="140" fill="${wall}"/><path d="M${hx-20} ${hy+4} L${hx+120} ${hy-70} L${hx+260} ${hy+4}Z" fill="${roof}"/><rect x="${hx+40}" y="${hy+40}" width="44" height="44" fill="#8a8272"/><rect x="${hx+140}" y="${hy+50}" width="46" height="90" fill="#6e6658"/>`; }
  if(sp.flowers){ for(let i=0;i<70;i++){ const x = rnd()*1600, y = 680 + rnd()*210; if(sp.road && x > 600 && x < 1100) continue; g += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(4+rnd()*6).toFixed(1)}" fill="${sp.flowers[i % sp.flowers.length]}" opacity=".9"/>`; } }
  g += `</g>`;
  if(sp.dark) g += `<rect width="1600" height="900" fill="#0d0f18" opacity=".25"/>`;
  return SVG_OPEN + DEFS(id) + g + `<rect width="1600" height="900" filter="url(#paper${id})"/></svg>`;
}

function esc(s){ return String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }
function T(o){ if(!o) return ""; if(o.b) return o.b; return (level === "lit" ? (o.l || o.e) : (o.e || o.l)) || ""; }
const JOSA = {"이라고":"라고", "아":"야", "은":"는", "이":"가", "을":"를", "으로":"로", "과":"와", "이에요":"예요"};
function josa(word, form){
  const c = String(word || "").trim().slice(-1).charCodeAt(0);
  if(!(c >= 0xAC00 && c <= 0xD7A3)) return JOSA[form] || form;
  const jong = (c - 0xAC00) % 28;
  if(form === "으로" && jong === 8) return "로";
  return jong ? form : (JOSA[form] || form);
}
function fill(t){

function applyEff(eff){
  if(!eff) return;
  if(eff.flag) S.flags[eff.flag] = true;
  if(eff.met){ S.met[eff.met] = true; if(S.hearts[eff.met] === undefined) S.hearts[eff.met] = CHARS[eff.met] ? CHARS[eff.met].start : 0; setTimeout(() => bumpHud(eff.met), 50); }
  if(eff.name) Object.assign(S.names, eff.name);
  if(eff.heart) for(const k in eff.heart){ const before = S.hearts[k] || 0, d = eff.heart[k]; S.met[k] = true; S.hearts[k] = Math.max(0, Math.min(5, before + d)); setTimeout(() => bumpHud(k), 50);
    if(d && CHARS[k]){ const nm = CHARS[k].full; toast(S.hearts[k] === before ? (d > 0 ? `💗 ${nm}의 마음이 이미 가득해요` : `💔 ${nm}의 마음이 더 내려갈 곳이 없어요`) : d > 0 ? `💗 ${nm}의 마음 +${d}` : `💔 ${nm}의 마음 ${d}`); } }
  if(eff.item && !S.items.includes(eff.item)){ S.items.push(eff.item); const it = ITEMS[eff.item]; setTimeout(() => { sfx("item"); toast({t:`추억 상자에 '${it.name}'${josa(it.name, "을")} 넣었어요`, ic:itHtml(eff.item, "sm"), emoji:"🎁"}); }, 400); }
  if(eff.card && CARDS[eff.card]){ S.cards = S.cards || []; if(!S.cards.includes(eff.card)){ S.cards.push(eff.card); const c = CARDS[eff.card], pw = POWERS[c.who] || {}; setTimeout(() => { sfx("item"); toast({t:`힘 카드: ${pw.name || ""}의 ${pw.power || "힘"} — ${c.name}`, ic:avHtml(c.who), emoji:"💡"}); }, 500); } }
  if(eff.album && !P.album[eff.album]){ P.album[eff.album] = true; if(!/^e_/.test(eff.album)) setTimeout(() => { sfx("dream"); toast("✨ 숨은 장면을 발견했어요! (" + albumCount() + "/" + ALBUM.length + ")"); }, 300); }
}
function albumCount(){ return ALBUM.filter(a => P.album[a.id]).length; }
function decideEnding(){
  const t = S.tally, arr = ["canon","imag","bal"].sort((a,b) => t[b] - t[a]);
  return t[arr[0]] > t[arr[1]] ? arr[0] : "bal";
}
function enter(i, note){
  S.note = note || null;
  for(let guard = 0; guard < 400; guard++){
    const n = NODES[i];
    if(!n){ S.phase = "report"; break; }
    if(n.t === "goto"){ i = IDX[n.to]; continue; }
    if(n.t === "ending"){ if(!S.ending) S.ending = decideEnding(); i = IDX["E_" + S.ending]; continue; }
    if(!n.t && n.when && !n.when(S)){ i++; continue; }
    S.pos = i;
    if(n.bg && n.bg !== S.bg){ S.bg = n.bg; S.cam = ""; }
    if(n.cam !== undefined){ if(n.cam === "shake") shakeCam(); else S.cam = n.cam; }
    if(n.t === "choice"){ S.phase = "choice"; S.order = null; }
    else if(n.t === "name"){ S.phase = "name"; }
    else if(n.t === "endcard"){ S.phase = "endcard"; P.endings[CH.key + "_" + S.ending] = true; S.hist[CH.key] = {ending:S.ending, tally:Object.assign({}, S.tally)}; }
    else { S.phase = "play"; applyEff(n.eff); if(n.fx === "dream" && !(NODES[i-1] && NODES[i-1].fx === "dream")) sfx("dream"); }
    break;
  }
  save(); render(false);
}
function advance(){
  if(!el.modal.hidden || picking) return;
  if(!el.cover.classList.contains("hide")) return;
  if(el.vn.classList.contains("peek")){ el.vn.classList.remove("peek"); return; }
  if(typing){ finishTyping(); return; }
  if(S.phase === "play") enter(S.pos + 1);
  else if(S.phase === "endcard"){ S.phase = "report"; save(); render(false); }
}

const BGM = {el:null, gain:null, cur:null, urls:{}, vol:0.32, fading:false};
function bgmWant(){ return (musicOn && S.started && !document.hidden && !document.body.classList.contains("covering") && CH.bgm) ? CH.bgm : null; }
function bgmSetVol(v, sec){
  if(BGM.gain && actx){ const g = BGM.gain.gain, t = actx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(v, t + sec); }
  else if(BGM.el){ BGM.el.volume = Math.max(0, Math.min(1, v)); }
}
async function bgmSrc(f){
  if(BGM.urls[f]) return BGM.urls[f];
  if(/^https?:$/.test(location.protocol)){
    try{ const r = await fetch(f); if(!r.ok) throw 0; BGM.urls[f] = URL.createObjectURL(await r.blob()); return BGM.urls[f]; }catch(e){ return null; }
  }
  return f;
}
async function bgmUpdate(){
  const want = bgmWant();
  if(want === BGM.cur) return;
  const prev = BGM.el; BGM.cur = want;
  if(prev){ bgmSetVol(0, 0.8); setTimeout(() => { if(BGM.el === prev && BGM.cur !== prev.dataset.f) prev.pause(); }, 850); }
  if(!want) return;
  const src = await bgmSrc(want);
  if(BGM.cur !== want) return;
  if(!src){ BGM.cur = null; return; }
  if(!BGM.el){
    BGM.el = new Audio(); BGM.el.loop = true; BGM.el.preload = "auto";
    const ctx = unlockAudio();
    if(ctx && /^https?:$/.test(location.protocol)){ try{ BGM.gain = ctx.createGain(); BGM.gain.gain.value = 0; ctx.createMediaElementSource(BGM.el).connect(BGM.gain); BGM.gain.connect(ctx.destination); }catch(e){ BGM.gain = null; } }
    BGM.el.addEventListener("timeupdate", () => {
      const a = BGM.el; if(!a.duration || BGM.cur !== a.dataset.f) return;
      if(a.duration - a.currentTime < 2.2 && !BGM.fading){ BGM.fading = true; bgmSetVol(0.02, 2); }
      else if(a.currentTime < 1.5 && BGM.fading){ BGM.fading = false; bgmSetVol(BGM.vol, 2.5); }
    });
  }
  const a = BGM.el;
  if(a.dataset.f !== want){ a.src = src; a.dataset.f = want; BGM.fading = false; }
  if(!BGM.gain) a.volume = 0;
  a.play().then(() => bgmSetVol(BGM.vol, 2)).catch(() => { BGM.cur = null; });
}
document.addEventListener("visibilitychange", bgmUpdate);
window.addEventListener("pointerdown", () => { if(!BGM.cur) bgmUpdate(); }, {passive:true});

function toast(msg){ toastQ.push(msg); if(toastQ.length === 1) showToast(); }
function showToast(){ const msg = toastQ[0]; if(msg === undefined) return;
  if(typeof msg === "object") el.toast.innerHTML = (/^<img/.test(msg.ic) ? msg.ic : (msg.emoji || "")) + " " + esc(msg.t); else el.toast.textContent = msg; el.toast.classList.add("show"); clearTimeout(toastT);
  toastT = setTimeout(() => { el.toast.classList.remove("show"); toastQ.shift(); if(toastQ.length) setTimeout(showToast, 250); }, toastQ.length > 1 ? 1500 : 2400); }

/* =========================================================
   10. 입력
   ========================================================= */
el.dialog.addEventListener("click", e => {
  if(e.target.closest("button, input, .choices, .gl")) return;
  unlockAudio(); advance();
});
el.viewer.addEventListener("click", e => { if(e.target.closest(".cover")) return; unlockAudio(); advance(); });
el.nameOk.addEventListener("click", e => { e.stopPropagation(); submitName(); });
el.nameInput.addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); submitName(); } e.stopPropagation(); });
el.btnStart.addEventListener("click", e => { e.stopPropagation(); unlockAudio(); startNew(); });
el.btnContinue.addEventListener("click", e => { e.stopPropagation(); unlockAudio(); el.cover.classList.add("hide"); curBg = null; render(false); });
document.addEventListener("keydown", e => {
  if(!el.modal.hidden){ if(e.key === "Escape") closeModal(); return; }
  if(e.key === "Escape" && el.book.classList.contains("open")){ closeBook(); return; }
  const tag = e.target && e.target.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA") return;
  if(tag === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
  if(S.phase === "choice" && /^[1-3]$/.test(e.key) && el.cover.classList.contains("hide")){ const b = el.choiceList.querySelectorAll(".choice")[+e.key - 1]; if(b) b.click(); return; }
  if(e.key === "Enter" || e.key === " " || e.key === "ArrowRight"){
    e.preventDefault();
    if(S.phase === "report") return;
    if(!el.cover.classList.contains("hide")){ S.started && S.phase !== "cover" ? el.btnContinue.click() : startNew(); return; }
    advance();
  }
});

if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  const hadCtl = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(hadCtl && !reloaded){ reloaded = true; location.reload(); } });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(r => r.update()).catch(() => {}));
}
load(); preloadChapter(); probeFolder(); warmCache(); applyLevelUI(); applySoundUI(); applyFxUI(); applyMusicUI(); updateGauge();
renderCover();
